<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>A Shopping List, Mostly Kept</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,100vh);height:min(100vw,100vh);display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
/* ===========================================================
   PAINT — a small acrylic/mixed-media engine for canvas 2d.
   Every mark is built from bristles with pressure, dry gaps and
   colour drift. Surfaces are baked once into plates; animation
   is transform, reveal and two-plate boil, the way hand-painted
   animation actually moves.
   =========================================================== */
var TAU = Math.PI * 2;

function rnd(seed) {
  var s = (Math.imul(seed | 0, 2654435761) ^ 0x9e3779b9) >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- colour ---- */
function hx(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function cl(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
function toHex(a) {
  return '#' + a.map(function (v) { return ('0' + Math.round(cl(v)).toString(16)).slice(-2); }).join('');
}
function mix(a, b, t) {
  var A = hx(a), B = hx(b);
  return toHex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
}
function rgba(h, a) { var c = hx(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function jit(h, r, amt) {
  var c = hx(h), d = (r() - 0.5) * 2 * amt;
  return toHex([c[0] + d, c[1] + d * (0.55 + r() * 0.6), c[2] + d * (0.3 + r() * 0.7)]);
}

/* ---- plates ---- */
function plate(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c: c, x: c.getContext('2d'), w: w, h: h };
}

/* ---- geometry ---- */
function crSample(p, n, close) {
  var N = p.length, out = [];
  if (N < 2) return p.slice();
  if (N === 2) {
    for (var k = 0; k <= n; k++) {
      var t = k / n;
      out.push([p[0][0] + (p[1][0] - p[0][0]) * t, p[0][1] + (p[1][1] - p[0][1]) * t]);
    }
    return out;
  }
  var get = function (i) {
    return close ? p[((i % N) + N) % N] : p[i < 0 ? 0 : i > N - 1 ? N - 1 : i];
  };
  var last = close ? N : N - 1;
  for (var i = 0; i < last; i++) {
    var p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (var j = 0; j < n; j++) {
      var u = j / n, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
      ]);
    }
  }
  if (!close) out.push(p[N - 1]);
  return out;
}

function curve(x, p, close) {
  if (p.length < 2) return;
  var sm = crSample(p, 10, close);
  x.moveTo(sm[0][0], sm[0][1]);
  for (var i = 1; i < sm.length; i++) x.lineTo(sm[i][0], sm[i][1]);
  if (close) x.closePath();
}

function blobPts(cx, cy, rx, ry, seed, lumps, amp) {
  var r = rnd(seed), n = lumps || 13, a = amp == null ? 0.13 : amp, pts = [];
  for (var i = 0; i < n; i++) {
    var th = i / n * TAU, k = 1 + (r() - 0.5) * 2 * a;
    pts.push([cx + Math.cos(th) * rx * k, cy + Math.sin(th) * ry * k]);
  }
  return pts;
}

function shrinkPts(pts, k) {
  var cx = 0, cy = 0;
  pts.forEach(function (p) { cx += p[0]; cy += p[1]; });
  cx /= pts.length; cy /= pts.length;
  return pts.map(function (p) { return [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]; });
}

function movePts(pts, dx, dy) {
  return pts.map(function (p) { return [p[0] + dx, p[1] + dy]; });
}

function rotPts(pts, cx, cy, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return pts.map(function (p) {
    var dx = p[0] - cx, dy = p[1] - cy;
    return [cx + dx * c - dy * s, cy + dx * s + dy * c];
  });
}

/* A torn edge, not a pinking-shear edge. Sampling at a fixed step with a
   uniform random offset makes an even sawtooth, which is the giveaway that a
   shape was generated rather than torn. Here the step length wanders and the
   offset carries a slow drift with the odd deep nick, the way paper fibre
   gives way unevenly. */
function jagPoly(pts, seed, amp, step) {
  var r = rnd(seed), out = [], drift = 0;
  var base = step || 22;
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (!L) continue;
    var nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;
    var d = 0;
    while (d < L) {
      drift = drift * 0.62 + (r() - 0.5) * amp * 1.1;
      var nick = r() < 0.09 ? (r() - 0.5) * amp * 3.2 : 0;
      var o = drift + nick + (r() - 0.5) * amp * 0.5;
      var t = d / L;
      out.push([a[0] + (b[0] - a[0]) * t + nx * o, a[1] + (b[1] - a[1]) * t + ny * o]);
      d += base * (0.35 + r() * 1.5);
    }
  }
  return out;
}

function partial(pts, f) {
  if (f >= 1) return pts;
  var sm = crSample(pts, 8, false);
  var n = Math.max(2, Math.round(sm.length * Math.max(0.02, f)));
  return sm.slice(0, n);
}

/* ---- the brush ----
   pressure + bristle spread + dry-brush gaps + colour drift. */
function brush(x, pts, o) {
  o = o || {};
  var r = rnd(o.seed == null ? 11 : o.seed);
  var sm = o.raw ? pts : crSample(pts, o.dens || 8, !!o.close);
  if (sm.length < 2) return;
  var nb = o.bristles == null ? 4 : o.bristles;
  var W = o.w == null ? 10 : o.w;
  var A = o.alpha == null ? 0.9 : o.alpha;
  var col = o.col || '#1A1A1A';
  x.lineCap = 'round'; x.lineJoin = 'round';
  for (var b = 0; b < nb; b++) {
    var off = nb === 1 ? (r() - 0.5) * W * 0.12 : (b / (nb - 1) - 0.5) * W * (o.spread == null ? 0.92 : o.spread);
    var ph = r() * TAU, ph2 = r() * TAU;
    /* arc modulation: a closed outline of even weight all the way round is the
       sticker die-cut tell. Real drawn contours swell where the hand pressed
       and vanish where it lifted, so weight rides a slow wave along the path
       and drops out entirely in the troughs. */
    var arcPh = r() * TAU, arcPh2 = r() * TAU, arcF = 1.3 + r() * 1.7;
    var bw = (W / Math.max(1, nb)) * (o.thick == null ? 1.5 : o.thick) * (0.72 + r() * 0.56);
    var bcol = o.vary ? jit(col, r, o.vary) : col;
    /* dry-brush skips are run-lengths in real distance, not a per-sample coin
       flip: a coin flip at the sampling step turns every stroke into a regular
       dash pattern, which reads as digital hatching rather than a loaded
       bristle losing contact with the tooth of the canvas. */
    var dry = o.dry || 0;
    var runLeft = dry ? (6 + r() * 26) / Math.max(0.2, dry) : Infinity;
    var inGap = false;
    var prev = null, skip = false, run = 0, band = [], bands = [];
    for (var i = 0; i < sm.length; i++) {
      if (i) run += Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]);
      var p = sm[i];
      var q = sm[Math.min(sm.length - 1, i + 1)], pp = sm[Math.max(0, i - 1)];
      var nx = -(q[1] - pp[1]), ny = q[0] - pp[0];
      var L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      /* Wobble and pressure ride travelled distance, not sample index. Keyed
         to the index they beat at a period set by the sampling density, so a
         long stroke came out banded into even segments like a bamboo cane. */
      var wig = Math.sin(run * 0.024 + ph) * W * 0.05 + Math.sin(run * 0.0065 + ph2) * W * 0.1;
      var xx = p[0] + nx * (off + wig), yy = p[1] + ny * (off + wig);
      var u = i / (sm.length - 1);
      var press = 1;
      if (o.taper) press = Math.pow(Math.sin(Math.PI * u), o.taper === true ? 0.42 : o.taper);
      press *= 0.68 + 0.22 * Math.sin(run * 0.031 + ph) + 0.24 * r();
      if (o.arc) {
        var av = 0.62 * Math.sin(u * TAU * arcF + arcPh) + 0.38 * Math.sin(u * TAU * arcF * 2.3 + arcPh2);
        press *= Math.max(0, 0.55 + (o.arc === true ? 0.85 : o.arc) * av);
      }
      if (dry && prev) {
        runLeft -= Math.hypot(xx - prev[0], yy - prev[1]);
        if (runLeft <= 0) {
          inGap = !inGap;
          runLeft = inGap ? (2 + r() * 9) * dry * 2.4 : (6 + r() * 26) / Math.max(0.2, dry);
        }
        skip = inGap;
      }
      /* Ribbon mode collects the bristle into one filled band and lays it
         down once. Stroking every segment separately at part alpha stacks
         the overlaps and scallops the round caps, so a solid form like a
         cane came out as a chain of translucent beads. Scumble and wash
         still want the stacking, so they keep the segment-by-segment path. */
      if (o.ribbon) {
        if (skip || press <= 0.06) { if (band.length > 1) bands.push(band); band = []; }
        else band.push([xx, yy, Math.max(0.5, bw * press) / 2]);
      } else if (prev && !skip && press > 0.06) {
        x.beginPath();
        x.moveTo(prev[0], prev[1]); x.lineTo(xx, yy);
        x.strokeStyle = bcol;
        x.globalAlpha = o.solid ? A : A * (0.6 + 0.4 * r()) * (o.fade ? Math.max(0.12, press) : 1);
        x.lineWidth = Math.max(0.5, bw * press);
        x.stroke();
      }
      prev = [xx, yy];
    }
    if (o.ribbon) {
      if (band.length > 1) bands.push(band);
      x.globalAlpha = A;
      x.fillStyle = bcol;
      for (var bi = 0; bi < bands.length; bi++) ribbon(x, bands[bi]);
    }
  }
  x.globalAlpha = 1;
}

/* fill a band of [x, y, halfWidth] as one closed shape */
function ribbon(x, band) {
  var n = band.length, left = [], right = [], i, a, b, nx, ny, L;
  for (i = 0; i < n; i++) {
    a = band[Math.max(0, i - 1)]; b = band[Math.min(n - 1, i + 1)];
    nx = -(b[1] - a[1]); ny = b[0] - a[0];
    L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    left.push([band[i][0] + nx * band[i][2], band[i][1] + ny * band[i][2]]);
    right.push([band[i][0] - nx * band[i][2], band[i][1] - ny * band[i][2]]);
  }
  x.beginPath();
  x.moveTo(left[0][0], left[0][1]);
  for (i = 1; i < n; i++) x.lineTo(left[i][0], left[i][1]);
  for (i = n - 1; i >= 0; i--) x.lineTo(right[i][0], right[i][1]);
  x.closePath();
  x.fill();
}

/* ---- grain: canvas tooth, composited with overlay ---- */
function grainPlate(W, H, seed, amt, weave) {
  var p = plate(W, H), im = p.x.createImageData(W, H), d = im.data, r = rnd(seed);
  for (var y = 0; y < H; y++) {
    var wy = weave ? Math.sin(y * 1.93) : 0;
    for (var x = 0; x < W; x++) {
      var i = (y * W + x) * 4;
      var v = (r() - 0.5) * 2;
      if (weave) v += 0.42 * (Math.sin(x * 1.71) + wy);
      var g = 128 + v * amt;
      d[i] = d[i + 1] = d[i + 2] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i + 3] = 255;
    }
  }
  p.x.putImageData(im, 0, 0);
  return p;
}

function applyGrain(x, g, a, W, H) {
  x.save();
  x.globalCompositeOperation = 'overlay';
  x.globalAlpha = a;
  x.drawImage(g.c, 0, 0, W, H);
  x.restore();
}

/* ---- crumpled tissue / crackle, as a reusable transparent plate ---- */
function crazePlate(W, H, o) {
  o = o || {};
  var p = plate(W, H), x = p.x, r = rnd(o.seed || 3);
  var facets = o.facets == null ? 130 : o.facets;
  for (var i = 0; i < facets; i++) {
    var cx = r() * W, cy = r() * H, n = 4 + (r() * 3 | 0), rad = 9 + r() * 34, pts = [];
    for (var k = 0; k < n; k++) {
      var a = k / n * TAU;
      pts.push([cx + Math.cos(a) * rad * (0.45 + r() * 0.9), cy + Math.sin(a) * rad * (0.45 + r() * 0.9)]);
    }
    x.beginPath(); curve(x, pts, true);
    x.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.028)' : 'rgba(0,0,0,0.05)';
    x.fill();
  }
  var lines = o.lines == null ? 300 : o.lines;
  for (var j = 0; j < lines; j++) {
    var px = r() * W, py = r() * H, ang = r() * TAU, ps = [[px, py]];
    var segs = 3 + (r() * 7 | 0);
    for (var s = 0; s < segs; s++) {
      ang += (r() - 0.5) * 1.15;
      var Ln = 12 + r() * 48;
      px += Math.cos(ang) * Ln; py += Math.sin(ang) * Ln;
      ps.push([px, py]);
    }
    var sd = (r() * 1e6) | 0;
    brush(x, ps.map(function (q) { return [q[0] - 1.5, q[1] - 1.6]; }),
      { col: '#ffffff', w: 1.5, alpha: 0.13, bristles: 1, seed: sd + 1, dens: 4, dry: 0.3 });
    brush(x, ps, { col: '#000000', w: 1.7, alpha: 0.14 + r() * 0.1, bristles: 1, seed: sd, dens: 4, dry: 0.16 });
  }
  return p;
}

/* draw a texture plate through a shape */
function textureThrough(x, tex, pathFn, a, dx, dy) {
  x.save();
  x.beginPath(); pathFn(x); x.clip();
  x.globalAlpha = a == null ? 0.85 : a;
  x.drawImage(tex.c, dx || 0, dy || 0);
  x.restore();
  x.globalAlpha = 1;
}

/* ---- scrubbed, trowelled ground ---- */
function ground(x, W, H, o) {
  var r = rnd(o.seed || 1);
  x.fillStyle = o.base; x.fillRect(0, 0, W, H);
  var tints = o.tints || [o.base];
  var i, g, cx, cy, rad;
  for (i = 0; i < (o.mottle == null ? 110 : o.mottle); i++) {
    cx = r() * W; cy = r() * H; rad = 50 + r() * 230;
    g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    var col = tints[(r() * tints.length) | 0];
    g.addColorStop(0, rgba(col, 0.08 + r() * 0.13));
    g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g;
    x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
  var vert = !!o.vertical;
  for (i = 0; i < (o.sweeps == null ? 90 : o.sweeps); i++) {
    var len = (vert ? H : W) * (0.3 + r() * 0.8);
    var sx = r() * W * 1.1 - W * 0.05, sy = r() * H * 1.1 - H * 0.05;
    var drift = (r() - 0.5) * 180;
    var pts = vert
      ? [[sx, sy], [sx + drift * 0.3, sy + len * 0.4], [sx + drift, sy + len]]
      : [[sx, sy], [sx + len * 0.4, sy + drift * 0.3], [sx + len, sy + drift]];
    /* No dry gaps on a sweep this wide. The ink runs come out a similar
       length across every bristle, so ninety of them tile the whole ground
       into rows of little lozenges — the pattern reads as machine hatching
       and it prints straight through anything translucent laid over it. */
    brush(x, pts, {
      col: jit(tints[(r() * tints.length) | 0], r, o.drift == null ? 26 : o.drift),
      w: 18 + r() * 64, alpha: 0.04 + r() * 0.1, bristles: 4,
      seed: (r() * 1e6) | 0, dens: 6, spread: 0.6, thick: 2.6, taper: 0.85
    });
  }
  /* Broken touches instead, each its own short mark, so the break is in where
     they fall rather than in a rhythm along a stroke. */
  for (i = 0; i < (o.mottle == null ? 60 : o.mottle); i++) {
    var tx = r() * W, ty = r() * H, ta = r() * TAU;
    var tL = 10 + Math.pow(r(), 2) * 150;
    brush(x, [[tx, ty], [tx + Math.cos(ta) * tL, ty + Math.sin(ta) * tL]], {
      col: jit(tints[(r() * tints.length) | 0], r, o.drift == null ? 26 : o.drift),
      w: 6 + r() * 42, alpha: 0.035 + r() * 0.1, bristles: 4,
      seed: (r() * 1e6) | 0, dens: 5, taper: 0.9, spread: 0.6, thick: 2.6
    });
  }
  for (i = 0; i < (o.scrape == null ? 40 : o.scrape); i++) {
    var ax = r() * W, ay = r() * H, aa = (vert ? Math.PI / 2 : 0) + (r() - 0.5) * 0.7, aL = 60 + r() * 260;
    brush(x, [[ax, ay], [ax + Math.cos(aa) * aL, ay + Math.sin(aa) * aL]], {
      col: r() < 0.5 ? o.light || '#ffffff' : o.dark || '#4a4038',
      w: 5 + r() * 16, alpha: 0.05 + r() * 0.1, bristles: 3,
      seed: (r() * 1e6) | 0, dens: 5, taper: 0.9, arc: 0.7
    });
  }
  if (o.vignette !== false) {
    g = x.createRadialGradient(W * 0.5, H * 0.48, W * 0.22, W * 0.5, H * 0.5, W * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, rgba(o.dark || '#2B2B2B', o.vignette || 0.2));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
}

/* ---- edges: fuzzy charcoal envelope + drawn outline ---- */
function envelope(x, pts, o) {
  o = o || {};
  var col = o.col || '#1A1A1A', close = o.close !== false;
  var w = o.w == null ? 12 : o.w;
  /* the halo is a blurred fill, not a stroke: a form sinking into the ground
     rather than a ring drawn around a sticker. Body paint covers it after. */
  var halos = o.halo == null ? 2 : o.halo;
  for (var i = 0; i < halos; i++) {
    x.save();
    x.shadowColor = rgba(o.haloCol || col, (o.haloA == null ? 0.4 : o.haloA) / (1 + i));
    x.shadowBlur = (o.blur == null ? 26 : o.blur) * (1 + i * 1.6);
    x.shadowOffsetX = (o.hox || 0) * (1 + i);
    x.shadowOffsetY = (o.hoy || 0) * (1 + i);
    x.beginPath(); curve(x, pts, true);
    x.fillStyle = rgba(o.fillCol || col, 0.9);
    x.fill();
    x.restore();
  }
  for (var k = 0; k < (o.passes || 3); k++) {
    brush(x, k ? movePts(pts, (k % 2 ? 1.6 : -1.4), (k % 2 ? -1.2 : 1.8)) : pts, {
      col: k === 2 ? mix(col, '#ffffff', 0.18) : col,
      w: w * (k === 0 ? 1 : k === 1 ? 0.7 : 0.4),
      alpha: k === 0 ? 0.88 : 0.5, bristles: k === 0 ? 4 : 2,
      close: close, seed: (o.seed || 5) + k * 7 + 1, dens: 9, dry: k ? 0.25 : 0.06, vary: 14,
      arc: o.arc == null ? 0.7 : o.arc
    });
  }
}

/* ---- charcoal contour ----
   The contour is one dark line, not a bundle. Running brush() with four
   spread bristles and dry gaps gives each bristle its own phase, so the
   outline comes out as four parallel dashed tracks: stitching round a patch,
   which is the die-cut tell. So: a soft dark bleed either side, then a single
   continuous core whose weight rides the arc wave, then a short overdrawn
   passage or two where the hand went back over the line. */
function contour(x, pts, o) {
  o = o || {};
  var col = o.col || '#141210', W = o.w == null ? 17 : o.w;
  var close = o.close !== false, seed = o.seed == null ? 5 : o.seed;
  var r = rnd(seed + 991);
  var sm = crSample(pts, 7, close);
  /* the bleed: wide, faint, no gaps, so the line has soot around it */
  for (var b = 0; b < 2; b++) {
    brush(x, movePts(sm, (r() - 0.5) * 3, (r() - 0.5) * 3), {
      col: col, w: W * (2.1 + b * 1.5), alpha: 0.1 - b * 0.035, bristles: 2,
      close: close, seed: seed + 40 + b, raw: true, spread: 1.2, thick: 1.1
    });
  }
  /* the core: continuous, weight-varied, drawn once */
  brush(x, sm, {
    col: col, w: W, alpha: o.alpha == null ? 0.93 : o.alpha, bristles: 2,
    close: close, seed: seed + 1, raw: true, vary: o.vary == null ? 16 : o.vary,
    spread: 0.3, thick: 1.3, arc: o.arc == null ? 0.42 : o.arc, ribbon: true
  });
  /* going back over it: a couple of short passages, heavier, slightly off */
  var goes = o.goes == null ? 3 : o.goes;
  for (var g = 0; g < goes; g++) {
    var i0 = (r() * sm.length) | 0;
    var len = Math.max(6, (sm.length * (0.09 + r() * 0.17)) | 0);

      x.fillStyle = rgba('#4a2e08', 0.5 + r() * 0.24); x.fill();
      x.beginPath(); x.arc(hx - hr * 0.34, hy - hr * 0.38, hr * 0.52, 0, TAU);
      x.fillStyle = rgba('#fff0c0', 0.22 + r() * 0.2); x.fill();
      x.restore();
    }
    /* the bite, taken out of the top-left, its wall lit from inside the crumb */
    var bite = blobPts(cx - 322, cy - 224, 154, 138, 4148, 11, 0.22);
    x.save(); x.globalCompositeOperation = 'destination-out';
    x.beginPath(); curve(x, bite, true); x.fill();
    x.restore();
    x.save();
    x.beginPath(); pf(x); x.clip();
    contour(x, bite, { col: '#33230b', w: 16, seed: 4149, arc: 0.5, vary: 18, goes: 2 });
    brush(x, shrinkPts(bite, 1.13), { col: '#ffe9a8', w: 26, alpha: 0.24, bristles: 4, close: true, seed: 4150, dens: 7, dry: 0.4 });
    x.restore();
    /* The shade goes under the bitten silhouette, not under the path it was cut
       from: an envelope halo drawn first left a grey crescent hanging in the
       bite where the paint had been lifted away from over it. */
    var p = plate(W, H);
    p.x.save();
    p.x.shadowColor = rgba('#6b5326', 0.42); p.x.shadowBlur = 48;
    p.x.shadowOffsetX = 16; p.x.shadowOffsetY = 24;
    p.x.drawImage(body.c, 0, 0);
    p.x.restore();
    p.x.drawImage(body.c, 0, 0);
    return p;
  })();
  var macroBiscB = (function () {
    var p = plate(W, H), x = p.x;
    ground(x, W, H, {
      base: P.scorch, seed: 288, tints: [P.soot, P.ember, '#2a1a12', '#070505'],
      mottle: 76, sweeps: 36, scrape: 24, drift: 14, dark: '#000000', light: '#8a5a32', vignette: 0.44
    });
    x.save(); x.globalAlpha = 0.5; x.drawImage(craze.c, -180, -120, W * 2.2, H * 2.2); x.restore();
    heatBloom(x, 528, 556, 1, 2.2);
    x.drawImage(biscBig.c, 0, 0);
    /* relit, not recoloured: gold dragged along the top of the crumb only, so
       the dark pole is the same biscuit under a different light */
    var rl = rnd(4321);
    x.save();
    x.beginPath(); curve(x, blobPts(528, 556, 388, 366, 4141, 20, 0.045), true); x.clip();
    x.globalCompositeOperation = 'overlay';
    for (var g2 = 0; g2 < 34; g2++) {
      var ga2 = rl() * TAU, gd2 = Math.sqrt(rl()) * 380;
      var gx2 = 528 + Math.cos(ga2) * gd2, gy2 = 556 + Math.sin(ga2) * gd2 * 0.94;
      brush(x, [[gx2, gy2], [gx2 + 60 + rl() * 150, gy2 + (rl() - 0.5) * 80]], {
        col: rl() < 0.5 ? P.gold : P.amber, w: 16 + rl() * 40, alpha: 0.12 + rl() * 0.2,
        bristles: 4, seed: (rl() * 1e6) | 0, dens: 6, dry: 0.36, taper: 0.7
      });
    }
    x.restore();
    spatter(x, 528, 556, 520, 200, P.goldDk, 771, 2.6);
    return p;
  })();
  var macroBiscA = (function () {
    var p = plate(W, H), x = p.x;
    macroPaper(x);
    x.drawImage(biscBig.c, 0, 0);
    /* still crossed off, in the same biro, at the same angle as on the list */
    brush(x, [[110, 700], [520, 520], [960, 636]], {
      col: P.verm, w: 26, alpha: 0.85, bristles: 2, seed: 881, dens: 8, taper: 0.5, ribbon: true, vary: 20, spread: 0.3
    });
    brush(x, [[150, 480], [560, 660], [940, 470]], {
      col: P.verm, w: 20, alpha: 0.7, bristles: 2, seed: 882, dens: 8, taper: 0.5, ribbon: true, vary: 20, spread: 0.3
    });
    return p;
  })();

  /* --- the branch: the biro underline gives up being a line and becomes a
     family of paths, which is how the list stops being an errand --- */
  var TREE = makeBranch({
    x: MWX + 800, y: MWY + 212, ang: -2.0, len: 300, depth: 3, seed: 515,
    spread: 0.78, shrink: 0.62, w: 22, wobble: 0.42, step: 0.3
  });

  /* --- trajectories: seven arcs off the ends of the seven words, thrown at
     where each thing is about to be. Drawn in biro, gone in a second. --- */
  var TRAJ = ITEMS.map(function (it, i) {
    return {
      ax: LX + textWidth(it.w, LSZ) + 26, ay: it.ly + 18,
      bx: it.sx, by: it.sy, bend: (i % 2 ? 0.2 : -0.22) * (0.7 + (i % 3) * 0.3), seed: 4400 + i * 31
    };
  });

  /* ---------------- the two poles ---------------- */
  function drawA(u, o) {
    o = o || {};
    X.drawImage(gCanvas.c, 0, 0);
    X.drawImage(scrapBody.c, 0, 0);
    X.drawImage(scrapInk[boil(u)].c, 0, 0);
    if (o.objects) objects(u, o.objects, true);
  }

  function drawB(u, o) {
    o = o || {};
    X.drawImage(gSlate.c, 0, 0);
    if (o.words !== false) X.drawImage(slateWords.c, 0, 0);
    if (o.stars) stars(u, o.stars);
    if (o.heat) heatBloom(X, ITEMS[6].sx, ITEMS[6].sy, o.heat * (0.9 + 0.1 * Math.sin(u * 4.2)), 1);
    if (o.objects) objects(u, o.objects, false);
  }

  function stars(u, f) {
    STARS.forEach(function (s, i) {
      var a = clamp01(f * STARS.length * 0.8 - i * 0.6);
      if (a <= 0) return;
      var tw = Math.sin(u * 1.7 + i * 2.3) * 0.5 + 0.5;
      star(X, s[0], s[1], s[2] * a * (0.86 + 0.14 * tw), 600 + i, a * (0.5 + 0.5 * tw));
    });
  }

  /* one placement function for every phase, so a form never jumps between
     two different drawing routines — only its coordinates change */
  function objects(u, place, warm, aMul) {
    var order = ITEMS.map(function (it, i) { return i; })
      .sort(function (a, b) { return ITEMS[a].z - ITEMS[b].z; });
    order.forEach(function (i) {
      var pos = place(i, ITEMS[i], u);
      if (!pos || pos[4] <= 0) return;
      if (aMul != null) pos = [pos[0], pos[1], pos[2], pos[3], pos[4] * aMul];
      var bj = boil(u + i * 0.13);
      X.save();
      X.translate(pos[0] + (bj ? 1.3 : -1.2), pos[1] + (bj ? -1.5 : 1.1));
      X.rotate(pos[2] + (bj ? 0.004 : -0.004));
      X.scale(pos[3], pos[3]);
      X.globalAlpha = pos[4];
      if (warm) {
        /* on the cream the same sprite needs shade under it or it floats, which
           is the sticker complaint in another form */
        X.save();
        X.shadowColor = rgba('#6b5f52', pos[4] * 0.3);
        X.shadowBlur = 36; X.shadowOffsetX = 9; X.shadowOffsetY = 15;
        X.drawImage(SPR[i].c, -SPC, -SPC);
        X.restore();
      }
      X.drawImage(SPR[i].c, -SPC, -SPC);
      X.restore();
    });
    X.globalAlpha = 1;
  }

  function skyPlace(i, it) { return [it.sx, it.sy, 0, it.s, 1]; }

  function strikeIndex(u) {
    var i = 0;
    for (var k = 0; k < T.strikeCuts.length; k++) if (u >= T.strikeCuts[k][0]) i = k; else break;
    return i;
  }

  /* ---------------- the fourteen seconds ---------------- */
  function draw(t) {
    var u = ((t % DUR) + DUR) % DUR, bj = boil(u);
    var v = camAt(u, CAM);
    /* in the strike the camera is part of the cut: mode and framing change on
       the same frame, which is what stops eight cuts reading as one shot */
    if (u >= T.strike && u < T.breathe) {
      var sc = T.strikeCuts[strikeIndex(u)];
      v = { x: sc[3], y: sc[4], z: sc[2] };
    }
    var sh = shake(u, u >= T.chaos && u < T.grid ? 5 : (u >= T.strike && u < T.breathe ? 3 : 0));
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.clearRect(0, 0, W, H);
    X.save();
    X.translate((bj ? 0.8 : -0.7) + sh[0], (bj ? -0.6 : 0.9) + sh[1]);
    applyCam(X, v, W, H);

    if (u < T.macroWord) {
      /* --- breathe, then the heartbeat: three snaps to the dark pole and back,
         the words never moving --- */
      var m = held(u, [[0, 'A']].concat(T.hb));
      if (m === 'A') {
        drawA(u);
        if (u >= T.cross) {
          /* she goes over the crossing-out again, live, harder */
          var cp = clamp01((u - T.cross) / 0.14);
          var by = ITEMS[6].ly + 30, bw = textWidth('biscuits', LSZ);
          brush(X, partial([[LX - 26, by + 16], [LX + bw * 0.5, by - 16], [LX + bw + 22, by + 8]], cp), {
            col: P.verm, w: 15, alpha: 0.9, bristles: 3, seed: 9001, dens: 7, taper: 0.45, fade: true
          });
        }
      } else {
        drawB(u, {});
      }

    } else if (u < T.wide) {
      /* --- SCALE JUMP 1: one word, monumental. The underline branches. --- */
      X.drawImage(macroWordA.c, 0, 0);
      if (u >= T.branch) {
        drawBranch(X, TREE, clamp01((u - T.branch) / 0.52), {
          cols: [P.cad, P.verm, P.mag, mix(P.pencil, P.cad, 0.55)], alpha: 0.72, seed: 55, taper: 0.6
        });
      }
      if (u >= T.irisFlash && u < T.irisOut) {
        /* the cold pole blinks through the paper for two frames */
        var ir = 150 + 90 * ease((u - T.irisFlash) / 0.11);
        var ip = lensPath(MWX + 430, MWY + 60, ir, 41);
        lensThrough(X, ip, function (c) { c.drawImage(macroWordB.c, 0, 0); });
        lensRim(X, ip, { seed: 42, w: 14, bw: 8 });
      }

    } else if (u < T.lens) {
      /* --- back out, and the branch is now seven thrown arcs across the whole
         square, each aimed at where a thing is going to be --- */
      drawA(u);
      var tf = clamp01((u - T.traj) / 0.3);
      TRAJ.forEach(function (a, i) {
        arcThrow(X, a.ax, a.ay, a.bx, a.by, a.bend, clamp01(tf * 1.6 - i * 0.07), {
          col: i === 6 ? P.verm : P.pencil, w: 5, alpha: 0.5, seed: a.seed, headCol: P.cad
        });
      });

    } else if (u < T.burst) {
      /* --- REVEALING LENS: hung from the top of the square and swung across
         it, the dark pole and everything already up in it --- */
      drawA(u);
      var lp = (u - T.lens) / (T.burst - T.lens);
      /* hung from above the top edge and swung once across the square: the
         low point of the swing crosses the middle of the list */
      var ang = lerp(-0.62, 0.62, ease(lp));
      var pivx = 540, pivy = 96, L = 424;
      var cx = pivx + Math.sin(ang) * L, cy = pivy + Math.cos(ang) * L;
      var rad = 132 + 158 * ease(lp * 1.4);
      var lpath = lensPath(cx, cy, rad, 41 + frameOf(u, 6));
      lensThrough(X, lpath, function (c) {
        c.drawImage(gSlate.c, 0, 0);
        c.drawImage(slateWords.c, 0, 0);
        if (u >= T.montage && u < T.montageEnd) {
          /* flash montage inside the lens: each thing for a frame and a half,
             at a size the wide shot never gives it */
          var k = Math.floor((u - T.montage) / 0.068) % ITEMS.length;
          var it = ITEMS[k];
          c.save();
          c.translate(cx, cy); c.scale(1.45 * it.s, 1.45 * it.s);
          c.translate(-SPC, -SPC);
          c.drawImage(SPR[k].c, 0, 0);
          c.restore();
        } else {
          objects(u, function (i, it) {
            var f = clamp01((u - T.lens - 0.1 - i * 0.06) / 0.2);
            return f <= 0 ? null : [it.sx, it.sy, 0, it.s * (0.5 + 0.5 * f), 1];
          }, false);
        }
      });
      lensRim(X, lpath, { seed: 42, w: 18, bw: 9 });
      /* the string it hangs on, drawn as a mark */
      brush(X, [[pivx, pivy + 120], [(pivx + cx) / 2, (pivy + cy) / 2], [cx - Math.sin(ang) * rad, cy - Math.cos(ang) * rad]], {
        col: P.pencil, w: 4, alpha: 0.3, bristles: 1, seed: 44, dens: 6, dry: 0.3
      });

    } else if (u < T.chaos) {
      /* --- the lens goes off like a flashbulb and takes the frame with it --- */
      var bp = clamp01((u - T.burst) / 0.05);
      drawB(u, { objects: skyPlace });
      flash(X, P.goldLt, 0.5 * (1 - bp), W, H);

    } else if (u < T.grid) {
      /* --- CHAOS: seven things loose in the dark, counted as they go past --- */
      drawB(u, { words: false });
      var cf = clamp01((u - T.chaos) / 0.3);
      var scatter = function (i, it, uu) {
        var c = chaosAt(i, 5150, uu * 2.1, 540, 520, 470);
        var p = ease(cf);
        return [lerp(it.sx, c[0], p), lerp(it.sy, c[1], p), c[2] * p,
          it.s * lerp(1, 0.5 * c[3] + 0.34, p), 1];
      };
      /* two earlier exposures behind the live one. A form travelling this fast
         should smear; without the smear the frame reads as an arrangement. */
      objects(u - 0.12, scatter, false, 0.13);
      objects(u - 0.06, scatter, false, 0.26);
      objects(u, scatter, false);
      tallyMarks(X, 92, 946, 7, clamp01((u - T.chaos - 0.1) / 0.8), { col: P.gold, seed: 71, w: 8, h: 52, gap: 21 });

    } else if (u < T.brk) {
      /* --- GRID SNAP: for half a second it is an inventory, ruled up by hand,
         everything level and counted --- */
      drawB(u, { words: false });
      objects(u, function (i, it) {
        var g = gridAt(i, 4, 540, 520, 238, 254, 7);
        return [g[0], g[1], 0, it.s * 0.5, 1];
      }, false);
      var gf = clamp01((u - T.grid) / 0.16);
      ITEMS.forEach(function (it, i) {
        var g = gridAt(i, 4, 540, 520, 238, 254, 7);
        crosshair(X, g[0], g[1], 86, clamp01(gf * 1.4 - i * 0.06), { col: P.gold, seed: 300 + i * 7, w: 4, alpha: 0.5 });
      });
      /* the box round it drawn with a hand, not a ruler */
      var bx0 = 540 - 2 * 238 + 60, bx1 = 540 + 2 * 238 - 60, by0 = 520 - 254 * 0.5 - 130, by1 = 520 + 254 * 0.5 + 130;
      [[[bx0, by0], [540, by0 - 7], [bx1, by0 + 4]], [[bx1, by0], [bx1 + 6, 520], [bx1 - 3, by1]],
       [[bx1, by1], [540, by1 + 8], [bx0, by1 - 5]], [[bx0, by1], [bx0 - 7, 520], [bx0 + 4, by0]]]
        .forEach(function (side, k) {
          brush(X, partial(side, clamp01(gf * 2 - k * 0.22)), {
            col: P.gold, w: 5, alpha: 0.42, bristles: 1, seed: 380 + k, dens: 6, dry: 0.3
          });
        });
      tallyMarks(X, 92, 946, 7, 1, { col: P.gold, seed: 71, w: 8, h: 52, gap: 21 });

    } else if (u < T.cons) {
      /* --- and it breaks: thrown out to the sky positions, overshooting --- */
      var fp = (u - T.brk) / (T.cons - T.brk);
      drawB(u, { words: false });
      objects(u, function (i, it) {
        var g = gridAt(i, 4, 540, 520, 238, 254, 7);
        var p = over(clamp01(fp * (0.85 + (i % 3) * 0.1)));
        return [lerp(g[0], it.sx, p), lerp(g[1], it.sy, p), (1 - p) * 0.3 * (i % 2 ? 1 : -1), it.s * lerp(0.5, 1, p), 1];
      }, false);

    } else if (u < T.mcA) {
      /* --- the constellation: struck marks in the gaps the objects leave --- */
      var sf = clamp01((u - T.cons) / 0.9);
      drawB(u, { words: false, stars: sf, heat: clamp01((u - T.cons - 0.45) / 0.5), objects: skyPlace });
      /* three arcs joining what the eye is joining anyway. They draw on, hold
         for a beat and retract: a note in the margin, not a wiring diagram. */
      var af = clamp01((u - T.cons - 0.7) / 0.3) * clamp01((T.mcA - 0.1 - u) / 0.22);
      [[0, 4], [4, 2], [2, 6]].forEach(function (pr, k) {
        var a = ITEMS[pr[0]], b = ITEMS[pr[1]];
        arcThrow(X, a.sx, a.sy, b.sx, b.sy, k % 2 ? 0.16 : -0.14, af, {
          col: P.gold, w: 4, alpha: 0.34 * af, seed: 4500 + k * 13, head: false, dry: 0.3
        });
      });

    } else if (u < T.macroB) {
      /* --- match-cut on the constellation: the same seven, same places, on the
         cream, then straight back to the dark --- */
      if (held(u, [[T.mcA, 'A'], [T.mcB, 'B']]) === 'A') drawA(u, { objects: skyPlace });
      else drawB(u, { words: false, stars: 1, heat: 1, objects: skyPlace });

    } else if (u < T.macroA) {
      /* --- SCALE JUMP 2: the thing she crossed off, at monument size, with the
         crossing-out coming back as two meteors --- */
      X.drawImage(macroBiscB.c, 0, 0);
      /* the crossing-out arrives as two meteors and is gone in a third of a
         second — the joke is that being crossed off is what set it alight */
      var mf = clamp01((u - T.meteor) / 0.3);
      var mfade = 1 - clamp01((u - T.meteor - 0.34) / 0.3);
      [[[-160, 780], [520, 452], [1240, 604], 9101], [[100, 300], [600, 712], [1220, 418], 9102]]
        .forEach(function (m, k) {
          var p = clamp01(mf * 1.3 - k * 0.2);
          if (p <= 0 || mfade <= 0) return;
          var sm = crSample([m[0], m[1], m[2]], 16, false);
          var n = Math.max(2, Math.round(sm.length * p));
          var tail = sm.slice(Math.max(0, n - 22), n);
          /* One loaded mark with body, not an outline: two thin ribbons plus a
             pale core came out a hollow tube, which is a wireframe not a
             brushload. Bristles are stacked wide and the light sits inside it. */
          brush(X, tail, {
            col: k ? P.amber : P.verm, w: 60, alpha: 0.9 * mfade, bristles: 4, seed: m[3],
            raw: true, taper: 1.2, thick: 2.1, vary: 26, spread: 0.2, solid: true
          });
          brush(X, tail, {
            col: P.goldLt, w: 22, alpha: 0.6 * mfade, bristles: 2, seed: m[3] + 1,
            raw: true, taper: 1.6, thick: 1.7, spread: 0.14, solid: true
          });
          var hd = sm[n - 1];
          X.beginPath(); X.arc(hd[0], hd[1], 15, 0, TAU);
          X.fillStyle = rgba(P.goldLt, 0.85 * mfade); X.fill();
          spatter(X, hd[0], hd[1], 46, 22, P.amber, m[3] + 2, 3);
          /* and it leaves a scorch where it went over the biscuit */
          if (p >= 1) {
            brush(X, sm.filter(function (q, qi) { return qi % 3 === 0; }), {
              col: '#5a2f16', w: 16, alpha: 0.18 * (1 - mfade), bristles: 2, seed: m[3] + 5,
              dens: 5, dry: 0.4, taper: 0.9
            });
          }
        });
      crosshair(X, 528, 556, 430, clamp01((u - T.meteor - 0.5) / 0.4), { col: P.gold, seed: 907, w: 6, alpha: 0.4 });
      tallyMarks(X, 96, 962, 1, clamp01((u - T.meteor - 0.62) / 0.25), { col: P.goldLt, seed: 73, w: 9, h: 58, gap: 22 });

    } else if (u < T.strike) {
      /* --- and the same close-up on paper: pencil, biro, no fire --- */
      X.drawImage(macroBiscA.c, 0, 0);

    } else if (u < T.breathe) {
      /* --- STRIKE: eight cuts in a second and a third, mode and scale jumping
         together, the positions never moving --- */
      var i = 0;
      for (var k = 0; k < T.strikeCuts.length; k++) if (u >= T.strikeCuts[k][0]) i = k; else break;
      var c = T.strikeCuts[i];
      if (c[1] === 'A') drawA(u, { objects: skyPlace });
      else drawB(u, { words: false, stars: 1, heat: 1, objects: skyPlace });
      if (i === 6) flash(X, P.gold, 0.28, W, H);
      var tf2 = clamp01((u - T.strike) / 0.9);
      tallyMarks(X, 92, 946, 6, tf2, { col: c[1] === 'A' ? P.pencil : P.gold, seed: 71, w: 8, h: 52, gap: 21 });
      tallyMarks(X, 92 + 148, 946, 1, clamp01(tf2 * 1.4 - 0.5), { col: P.verm, seed: 74, w: 9, h: 52, gap: 21 });

    } else if (u < T.scrub) {
      /* --- breathe: the dark, held, and the aside written in --- */
      drawB(u, { words: false, stars: 1, heat: 1, objects: skyPlace });
      var af2 = clamp01((u - T.aside) / 0.7);
      if (af2 > 0) {
        X.save();
        X.beginPath(); X.rect(0, 860, 60 + af2 * 700, 220); X.clip();
        X.globalAlpha = 0.9;
        X.drawImage(extrasP.c, 0, 0);
        X.restore();
        X.globalAlpha = 1;
      }
      if (u >= T.mark) opusMark(X, 878, 1032, 30, P.gold, 0.45);

    } else if (u < T.home) {
      /* --- the cream is scrubbed back over the dark, and the list with it --- */
      drawB(u, { words: false, stars: 1, heat: 1, objects: skyPlace });
      var wp = clamp01((u - T.scrub) / 1.15);
      paintOn(X, plateA[bj], wipeRev, wp, scratchP, W, H);
      var nw = wipeStrokes.length, cur = wp * nw;
      var scrubCols = [P.mist, P.dust, P.stone, P.oat, '#cfc6b6'];
      for (var k2 = Math.max(0, Math.floor(cur) - 2); k2 <= Math.floor(cur) && k2 < nw; k2++) {
        var f2 = clamp01(cur - k2);
        brush(X, partial(wipeStrokes[k2].pts, f2), {
          col: scrubCols[k2 % scrubCols.length], w: 138, alpha: 0.88, bristles: 8, thick: 1.15,
          dens: 6, dry: 0.16, vary: 34, raw: true, seed: k2 * 31 + 7, spread: 0.96, taper: 1.3, fade: true
        });
      }
      if (wp >= 1) drawA(u);

    } else {
      drawA(u);
    }

    X.restore();
    applyGrain(X, grain, 0.4, W, H);
  }

  window.draw = draw;
})();
/* auto-start; ?t=SEC renders one frame and holds it, for frame review */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has('t')) { window.draw(parseFloat(q.get('t')) || 0); return; }
  var t0 = null;
  function frame(now) {
    if (t0 == null) t0 = now;
    window.draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
