<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Showers Later, Mainly in the Cup</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,100vh);height:min(100vw,100vh);display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
/* ===========================================================
   PAINT — a small acrylic/mixed-media engine for canvas 2d.
   Every mark is built from bristles with pressure, dry gaps and
   colour drift. Surfaces are baked once into plates; animation
   is transform, reveal and two-plate boil, the way hand-painted
   animation actually moves.
   =========================================================== */
var TAU = Math.PI * 2;

function rnd(seed) {
  var s = (Math.imul(seed | 0, 2654435761) ^ 0x9e3779b9) >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- colour ---- */
function hx(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function cl(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
function toHex(a) {
  return '#' + a.map(function (v) { return ('0' + Math.round(cl(v)).toString(16)).slice(-2); }).join('');
}
function mix(a, b, t) {
  var A = hx(a), B = hx(b);
  return toHex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
}
function rgba(h, a) { var c = hx(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function jit(h, r, amt) {
  var c = hx(h), d = (r() - 0.5) * 2 * amt;
  return toHex([c[0] + d, c[1] + d * (0.55 + r() * 0.6), c[2] + d * (0.3 + r() * 0.7)]);
}

/* ---- plates ---- */
function plate(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c: c, x: c.getContext('2d'), w: w, h: h };
}

/* ---- geometry ---- */
function crSample(p, n, close) {
  var N = p.length, out = [];
  if (N < 2) return p.slice();
  if (N === 2) {
    for (var k = 0; k <= n; k++) {
      var t = k / n;
      out.push([p[0][0] + (p[1][0] - p[0][0]) * t, p[0][1] + (p[1][1] - p[0][1]) * t]);
    }
    return out;
  }
  var get = function (i) {
    return close ? p[((i % N) + N) % N] : p[i < 0 ? 0 : i > N - 1 ? N - 1 : i];
  };
  var last = close ? N : N - 1;
  for (var i = 0; i < last; i++) {
    var p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (var j = 0; j < n; j++) {
      var u = j / n, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
      ]);
    }
  }
  if (!close) out.push(p[N - 1]);
  return out;
}

function curve(x, p, close) {
  if (p.length < 2) return;
  var sm = crSample(p, 10, close);
  x.moveTo(sm[0][0], sm[0][1]);
  for (var i = 1; i < sm.length; i++) x.lineTo(sm[i][0], sm[i][1]);
  if (close) x.closePath();
}

function blobPts(cx, cy, rx, ry, seed, lumps, amp) {
  var r = rnd(seed), n = lumps || 13, a = amp == null ? 0.13 : amp, pts = [];
  for (var i = 0; i < n; i++) {
    var th = i / n * TAU, k = 1 + (r() - 0.5) * 2 * a;
    pts.push([cx + Math.cos(th) * rx * k, cy + Math.sin(th) * ry * k]);
  }
  return pts;
}

function shrinkPts(pts, k) {
  var cx = 0, cy = 0;
  pts.forEach(function (p) { cx += p[0]; cy += p[1]; });
  cx /= pts.length; cy /= pts.length;
  return pts.map(function (p) { return [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]; });
}

function movePts(pts, dx, dy) {
  return pts.map(function (p) { return [p[0] + dx, p[1] + dy]; });
}

function rotPts(pts, cx, cy, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return pts.map(function (p) {
    var dx = p[0] - cx, dy = p[1] - cy;
    return [cx + dx * c - dy * s, cy + dx * s + dy * c];
  });
}

/* A torn edge, not a pinking-shear edge. Sampling at a fixed step with a
   uniform random offset makes an even sawtooth, which is the giveaway that a
   shape was generated rather than torn. Here the step length wanders and the
   offset carries a slow drift with the odd deep nick, the way paper fibre
   gives way unevenly. */
function jagPoly(pts, seed, amp, step) {
  var r = rnd(seed), out = [], drift = 0;
  var base = step || 22;
  for (var i = 0; i < pts.length; i++) {
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (!L) continue;
    var nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;
    var d = 0;
    while (d < L) {
      drift = drift * 0.62 + (r() - 0.5) * amp * 1.1;
      var nick = r() < 0.09 ? (r() - 0.5) * amp * 3.2 : 0;
      var o = drift + nick + (r() - 0.5) * amp * 0.5;
      var t = d / L;
      out.push([a[0] + (b[0] - a[0]) * t + nx * o, a[1] + (b[1] - a[1]) * t + ny * o]);
      d += base * (0.35 + r() * 1.5);
    }
  }
  return out;
}

function partial(pts, f) {
  if (f >= 1) return pts;
  var sm = crSample(pts, 8, false);
  var n = Math.max(2, Math.round(sm.length * Math.max(0.02, f)));
  return sm.slice(0, n);
}

/* ---- the brush ----
   pressure + bristle spread + dry-brush gaps + colour drift. */
function brush(x, pts, o) {
  o = o || {};
  var r = rnd(o.seed == null ? 11 : o.seed);
  var sm = o.raw ? pts : crSample(pts, o.dens || 8, !!o.close);
  if (sm.length < 2) return;
  var nb = o.bristles == null ? 4 : o.bristles;
  var W = o.w == null ? 10 : o.w;
  var A = o.alpha == null ? 0.9 : o.alpha;
  var col = o.col || '#1A1A1A';
  x.lineCap = 'round'; x.lineJoin = 'round';
  for (var b = 0; b < nb; b++) {
    var off = nb === 1 ? (r() - 0.5) * W * 0.12 : (b / (nb - 1) - 0.5) * W * (o.spread == null ? 0.92 : o.spread);
    var ph = r() * TAU, ph2 = r() * TAU;
    /* arc modulation: a closed outline of even weight all the way round is the
       sticker die-cut tell. Real drawn contours swell where the hand pressed
       and vanish where it lifted, so weight rides a slow wave along the path
       and drops out entirely in the troughs. */
    var arcPh = r() * TAU, arcPh2 = r() * TAU, arcF = 1.3 + r() * 1.7;
    var bw = (W / Math.max(1, nb)) * (o.thick == null ? 1.5 : o.thick) * (0.72 + r() * 0.56);
    var bcol = o.vary ? jit(col, r, o.vary) : col;
    /* dry-brush skips are run-lengths in real distance, not a per-sample coin
       flip: a coin flip at the sampling step turns every stroke into a regular
       dash pattern, which reads as digital hatching rather than a loaded
       bristle losing contact with the tooth of the canvas. */
    var dry = o.dry || 0;
    var runLeft = dry ? (6 + r() * 26) / Math.max(0.2, dry) : Infinity;
    var inGap = false;
    var prev = null, skip = false, run = 0, band = [], bands = [];
    for (var i = 0; i < sm.length; i++) {
      if (i) run += Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]);
      var p = sm[i];
      var q = sm[Math.min(sm.length - 1, i + 1)], pp = sm[Math.max(0, i - 1)];
      var nx = -(q[1] - pp[1]), ny = q[0] - pp[0];
      var L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      /* Wobble and pressure ride travelled distance, not sample index. Keyed
         to the index they beat at a period set by the sampling density, so a
         long stroke came out banded into even segments like a bamboo cane. */
      var wig = Math.sin(run * 0.024 + ph) * W * 0.05 + Math.sin(run * 0.0065 + ph2) * W * 0.1;
      var xx = p[0] + nx * (off + wig), yy = p[1] + ny * (off + wig);
      var u = i / (sm.length - 1);
      var press = 1;
      if (o.taper) press = Math.pow(Math.sin(Math.PI * u), o.taper === true ? 0.42 : o.taper);
      press *= 0.68 + 0.22 * Math.sin(run * 0.031 + ph) + 0.24 * r();
      if (o.arc) {
        var av = 0.62 * Math.sin(u * TAU * arcF + arcPh) + 0.38 * Math.sin(u * TAU * arcF * 2.3 + arcPh2);
        press *= Math.max(0, 0.55 + (o.arc === true ? 0.85 : o.arc) * av);
      }
      if (dry && prev) {
        runLeft -= Math.hypot(xx - prev[0], yy - prev[1]);
        if (runLeft <= 0) {
          inGap = !inGap;
          runLeft = inGap ? (2 + r() * 9) * dry * 2.4 : (6 + r() * 26) / Math.max(0.2, dry);
        }
        skip = inGap;
      }
      /* Ribbon mode collects the bristle into one filled band and lays it
         down once. Stroking every segment separately at part alpha stacks
         the overlaps and scallops the round caps, so a solid form like a
         cane came out as a chain of translucent beads. Scumble and wash
         still want the stacking, so they keep the segment-by-segment path. */
      if (o.ribbon) {
        if (skip || press <= 0.06) { if (band.length > 1) bands.push(band); band = []; }
        else band.push([xx, yy, Math.max(0.5, bw * press) / 2]);
      } else if (prev && !skip && press > 0.06) {
        x.beginPath();
        x.moveTo(prev[0], prev[1]); x.lineTo(xx, yy);
        x.strokeStyle = bcol;
        x.globalAlpha = o.solid ? A : A * (0.6 + 0.4 * r()) * (o.fade ? Math.max(0.12, press) : 1);
        x.lineWidth = Math.max(0.5, bw * press);
        x.stroke();
      }
      prev = [xx, yy];
    }
    if (o.ribbon) {
      if (band.length > 1) bands.push(band);
      x.globalAlpha = A;
      x.fillStyle = bcol;
      for (var bi = 0; bi < bands.length; bi++) ribbon(x, bands[bi]);
    }
  }
  x.globalAlpha = 1;
}

/* fill a band of [x, y, halfWidth] as one closed shape */
function ribbon(x, band) {
  var n = band.length, left = [], right = [], i, a, b, nx, ny, L;
  for (i = 0; i < n; i++) {
    a = band[Math.max(0, i - 1)]; b = band[Math.min(n - 1, i + 1)];
    nx = -(b[1] - a[1]); ny = b[0] - a[0];
    L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    left.push([band[i][0] + nx * band[i][2], band[i][1] + ny * band[i][2]]);
    right.push([band[i][0] - nx * band[i][2], band[i][1] - ny * band[i][2]]);
  }
  x.beginPath();
  x.moveTo(left[0][0], left[0][1]);
  for (i = 1; i < n; i++) x.lineTo(left[i][0], left[i][1]);
  for (i = n - 1; i >= 0; i--) x.lineTo(right[i][0], right[i][1]);
  x.closePath();
  x.fill();
}

/* ---- grain: canvas tooth, composited with overlay ---- */
function grainPlate(W, H, seed, amt, weave) {
  var p = plate(W, H), im = p.x.createImageData(W, H), d = im.data, r = rnd(seed);
  for (var y = 0; y < H; y++) {
    var wy = weave ? Math.sin(y * 1.93) : 0;
    for (var x = 0; x < W; x++) {
      var i = (y * W + x) * 4;
      var v = (r() - 0.5) * 2;
      if (weave) v += 0.42 * (Math.sin(x * 1.71) + wy);
      var g = 128 + v * amt;
      d[i] = d[i + 1] = d[i + 2] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i + 3] = 255;
    }
  }
  p.x.putImageData(im, 0, 0);
  return p;
}

function applyGrain(x, g, a, W, H) {
  x.save();
  x.globalCompositeOperation = 'overlay';
  x.globalAlpha = a;
  x.drawImage(g.c, 0, 0, W, H);
  x.restore();
}

/* ---- crumpled tissue / crackle, as a reusable transparent plate ---- */
function crazePlate(W, H, o) {
  o = o || {};
  var p = plate(W, H), x = p.x, r = rnd(o.seed || 3);
  var facets = o.facets == null ? 130 : o.facets;
  for (var i = 0; i < facets; i++) {
    var cx = r() * W, cy = r() * H, n = 4 + (r() * 3 | 0), rad = 9 + r() * 34, pts = [];
    for (var k = 0; k < n; k++) {
      var a = k / n * TAU;
      pts.push([cx + Math.cos(a) * rad * (0.45 + r() * 0.9), cy + Math.sin(a) * rad * (0.45 + r() * 0.9)]);
    }
    x.beginPath(); curve(x, pts, true);
    x.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.028)' : 'rgba(0,0,0,0.05)';
    x.fill();
  }
  var lines = o.lines == null ? 300 : o.lines;
  for (var j = 0; j < lines; j++) {
    var px = r() * W, py = r() * H, ang = r() * TAU, ps = [[px, py]];
    var segs = 3 + (r() * 7 | 0);
    for (var s = 0; s < segs; s++) {
      ang += (r() - 0.5) * 1.15;
      var Ln = 12 + r() * 48;
      px += Math.cos(ang) * Ln; py += Math.sin(ang) * Ln;
      ps.push([px, py]);
    }
    var sd = (r() * 1e6) | 0;
    brush(x, ps.map(function (q) { return [q[0] - 1.5, q[1] - 1.6]; }),
      { col: '#ffffff', w: 1.5, alpha: 0.13, bristles: 1, seed: sd + 1, dens: 4, dry: 0.3 });
    brush(x, ps, { col: '#000000', w: 1.7, alpha: 0.14 + r() * 0.1, bristles: 1, seed: sd, dens: 4, dry: 0.16 });
  }
  return p;
}

/* draw a texture plate through a shape */
function textureThrough(x, tex, pathFn, a, dx, dy) {
  x.save();
  x.beginPath(); pathFn(x); x.clip();
  x.globalAlpha = a == null ? 0.85 : a;
  x.drawImage(tex.c, dx || 0, dy || 0);
  x.restore();
  x.globalAlpha = 1;
}

/* ---- scrubbed, trowelled ground ---- */
function ground(x, W, H, o) {
  var r = rnd(o.seed || 1);
  x.fillStyle = o.base; x.fillRect(0, 0, W, H);
  var tints = o.tints || [o.base];
  var i, g, cx, cy, rad;
  for (i = 0; i < (o.mottle == null ? 110 : o.mottle); i++) {
    cx = r() * W; cy = r() * H; rad = 50 + r() * 230;
    g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    var col = tints[(r() * tints.length) | 0];
    g.addColorStop(0, rgba(col, 0.08 + r() * 0.13));
    g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g;
    x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
  var vert = !!o.vertical;
  for (i = 0; i < (o.sweeps == null ? 90 : o.sweeps); i++) {
    var len = (vert ? H : W) * (0.3 + r() * 0.8);
    var sx = r() * W * 1.1 - W * 0.05, sy = r() * H * 1.1 - H * 0.05;
    var drift = (r() - 0.5) * 180;
    var pts = vert
      ? [[sx, sy], [sx + drift * 0.3, sy + len * 0.4], [sx + drift, sy + len]]
      : [[sx, sy], [sx + len * 0.4, sy + drift * 0.3], [sx + len, sy + drift]];
    /* No dry gaps on a sweep this wide. The ink runs come out a similar
       length across every bristle, so ninety of them tile the whole ground
       into rows of little lozenges — the pattern reads as machine hatching
       and it prints straight through anything translucent laid over it. */
    brush(x, pts, {
      col: jit(tints[(r() * tints.length) | 0], r, o.drift == null ? 26 : o.drift),
      w: 18 + r() * 64, alpha: 0.04 + r() * 0.1, bristles: 4,
      seed: (r() * 1e6) | 0, dens: 6, spread: 0.6, thick: 2.6, taper: 0.85
    });
  }
  /* Broken touches instead, each its own short mark, so the break is in where
     they fall rather than in a rhythm along a stroke. */
  for (i = 0; i < (o.mottle == null ? 60 : o.mottle); i++) {
    var tx = r() * W, ty = r() * H, ta = r() * TAU;
    var tL = 10 + Math.pow(r(), 2) * 150;
    brush(x, [[tx, ty], [tx + Math.cos(ta) * tL, ty + Math.sin(ta) * tL]], {
      col: jit(tints[(r() * tints.length) | 0], r, o.drift == null ? 26 : o.drift),
      w: 6 + r() * 42, alpha: 0.035 + r() * 0.1, bristles: 4,
      seed: (r() * 1e6) | 0, dens: 5, taper: 0.9, spread: 0.6, thick: 2.6
    });
  }
  for (i = 0; i < (o.scrape == null ? 40 : o.scrape); i++) {
    var ax = r() * W, ay = r() * H, aa = (vert ? Math.PI / 2 : 0) + (r() - 0.5) * 0.7, aL = 60 + r() * 260;
    brush(x, [[ax, ay], [ax + Math.cos(aa) * aL, ay + Math.sin(aa) * aL]], {
      col: r() < 0.5 ? o.light || '#ffffff' : o.dark || '#4a4038',
      w: 5 + r() * 16, alpha: 0.05 + r() * 0.1, bristles: 3,
      seed: (r() * 1e6) | 0, dens: 5, taper: 0.9, arc: 0.7
    });
  }
  if (o.vignette !== false) {
    g = x.createRadialGradient(W * 0.5, H * 0.48, W * 0.22, W * 0.5, H * 0.5, W * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, rgba(o.dark || '#2B2B2B', o.vignette || 0.2));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
}

/* ---- edges: fuzzy charcoal envelope + drawn outline ---- */
function envelope(x, pts, o) {
  o = o || {};
  var col = o.col || '#1A1A1A', close = o.close !== false;
  var w = o.w == null ? 12 : o.w;
  /* the halo is a blurred fill, not a stroke: a form sinking into the ground
     rather than a ring drawn around a sticker. Body paint covers it after. */
  var halos = o.halo == null ? 2 : o.halo;
  for (var i = 0; i < halos; i++) {
    x.save();
    x.shadowColor = rgba(o.haloCol || col, (o.haloA == null ? 0.4 : o.haloA) / (1 + i));
    x.shadowBlur = (o.blur == null ? 26 : o.blur) * (1 + i * 1.6);
    x.shadowOffsetX = (o.hox || 0) * (1 + i);
    x.shadowOffsetY = (o.hoy || 0) * (1 + i);
    x.beginPath(); curve(x, pts, true);
    x.fillStyle = rgba(o.fillCol || col, 0.9);
    x.fill();
    x.restore();
  }
  for (var k = 0; k < (o.passes || 3); k++) {
    brush(x, k ? movePts(pts, (k % 2 ? 1.6 : -1.4), (k % 2 ? -1.2 : 1.8)) : pts, {
      col: k === 2 ? mix(col, '#ffffff', 0.18) : col,
      w: w * (k === 0 ? 1 : k === 1 ? 0.7 : 0.4),
      alpha: k === 0 ? 0.88 : 0.5, bristles: k === 0 ? 4 : 2,
      close: close, seed: (o.seed || 5) + k * 7 + 1, dens: 9, dry: k ? 0.25 : 0.06, vary: 14,
      arc: o.arc == null ? 0.7 : o.arc
    });
  }
}

/* ---- charcoal contour ----
   The contour is one dark line, not a bundle. Running brush() with four
   spread bristles and dry gaps gives each bristle its own phase, so the
   outline comes out as four parallel dashed tracks: stitching round a patch,
   which is the die-cut tell. So: a soft dark bleed either side, then a single
   continuous core whose weight rides the arc wave, then a short overdrawn
   passage or two where the hand went back over the line. */
function contour(x, pts, o) {
  o = o || {};
  var col = o.col || '#141210', W = o.w == null ? 17 : o.w;
  var close = o.close !== false, seed = o.seed == null ? 5 : o.seed;
  var r = rnd(seed + 991);
  var sm = crSample(pts, 7, close);
  /* the bleed: wide, faint, no gaps, so the line has soot around it */
  for (var b = 0; b < 2; b++) {
    brush(x, movePts(sm, (r() - 0.5) * 3, (r() - 0.5) * 3), {
      col: col, w: W * (2.1 + b * 1.5), alpha: 0.1 - b * 0.035, bristles: 2,
      close: close, seed: seed + 40 + b, raw: true, spread: 1.2, thick: 1.1
    });
  }
  /* the core: continuous, weight-varied, drawn once */
  brush(x, sm, {
    col: col, w: W, alpha: o.alpha == null ? 0.93 : o.alpha, bristles: 2,
    close: close, seed: seed + 1, raw: true, vary: o.vary == null ? 16 : o.vary,
    spread: 0.3, thick: 1.3, arc: o.arc == null ? 0.42 : o.arc, ribbon: true
  });
  /* going back over it: a couple of short passages, heavier, slightly off */
  var goes = o.goes == null ? 3 : o.goes;
  for (var g = 0; g < goes; g++) {
    var i0 = (r() * sm.length) | 0;
    var len = Math.max(6, (sm.length * (0.09 + r() * 0.17)) | 0);

      brush(x, [[kx0, cy - 6 + r() * 16], [kx0 + 40 + r() * 130, cy - 4 + r() * 18]], {
        col: col, w: 12 + r() * 34, alpha: 0.06 + r() * 0.11, bristles: 4,
        seed: seed + 40 + k, dens: 5, taper: 0.85, spread: 0.6, thick: 2.6
      });
    }
  }

  function paintCup(x, storm) {
    var st = function (a, b, t) { return storm ? mix(a, b, t) : a; };
    contact(x, 866, 942, 84, 20, storm ? '#04090f' : '#4a3a28', 6001);
    var pf = function (k) { curve(k, CUP, true); };
    envelope(x, CUP, {
      w: 12, seed: 601, col: '#1a1208', fillCol: st('#8d7a5c', P.stormDk, 0.5),
      halo: 2, blur: 22, haloA: 0.46, hox: 7, hoy: 11
    });
    impasto(x, pf, {
      base: st(P.cream, P.stormLt, 0.42),
      cols: [st(P.cream, P.stormLt, 0.42), st('#e2d8c0', '#7f95a6', 0.45), st('#bfae90', '#4a5d6c', 0.5)],
      bb: [766, 770, 200, 200], seed: 602, n: 16, kw: 22,
      angle: -1.4, spreadA: 0.9, stipple: 80, crease: 18,
      lit: st('#fffaf0', '#c4d4dc', 0.5), shade: st('#8a7a5c', '#1a2832', 0.5)
    });
    textureThrough(x, craze, pf, 0.5, -700, -640);
    /* One band of colour round the rim. Everything of hers has a bit of
       decoration on it that does not quite line up. */
    brush(x, [[794, 828], [862, 818], [932, 826]], {
      col: st(P.cad, '#7a3a20', 0.5), w: 11, alpha: 0.7, bristles: 2,
      seed: 603, dens: 8, arc: 0.4, ribbon: true
    });
    contour(x, CUP, { col: '#1a1208', w: 13, seed: 604, arc: 0.44, vary: 16 });
    /* handle, on the far side, slightly too small */
    var hl = [[930, 842], [972, 846], [976, 890], [936, 896]];
    brush(x, hl, { col: '#1a1208', w: 17, alpha: 0.88, bristles: 2, seed: 605, dens: 9, ribbon: true });
    brush(x, hl, { col: st(P.cream, P.stormLt, 0.42), w: 9, alpha: 0.9, bristles: 2, seed: 606, dens: 9, ribbon: true });
  }

  /* ---------------- the cloud ----------------
     Built as mass, lit on the shoulder and heavy underneath, so it reads as
     weather rather than a cartoon bubble. Never outlined: an outlined cloud
     is a speech balloon. */
  var CLOUD = (function () {
    var lobes = [], r = rnd(701);
    var spine = [[186, 236], [300, 176], [434, 146], [566, 162], [688, 206], [780, 268]];
    for (var i = 0; i < spine.length; i++) {
      for (var k = 0; k < 3; k++) {
        lobes.push({
          x: spine[i][0] + (r() - 0.5) * 120, y: spine[i][1] + (r() - 0.5) * 96 + k * 22,
          rx: 84 + r() * 96, ry: 54 + r() * 62, s: r()
        });
      }
    }
    return lobes;
  })();

  function paintCloud(x, dark, f) {
    if (f <= 0) return;
    var r = rnd(711);
    var base = mix('#d4d8d6', '#2a2f36', dark);
    var lit = mix('#fdfdfb', '#7d8a96', dark);
    var low = mix('#a3a8a6', '#0d1218', dark);
    /* Painted as one mass, not lobe by lobe. Giving each lobe its own impasto
       pass scattered short dark marks all over the top of the square, which
       read as debris blown about rather than a body of cloud. So: the lobes
       only establish the silhouette, and the knife work runs across the whole
       of it in one direction, with the weight below and the light above. */
    var grown = [];
    CLOUD.forEach(function (lo, i) {
      var g = clamp01(f * CLOUD.length * 0.62 - i * 0.34);
      if (g > 0) grown.push({ lo: lo, g: g });
    });
    if (!grown.length) return;
    /* The silhouette is torn, not scalloped. Stacked clean ellipses gave a
       thought balloon, which is the one shape a cloud must not be. */
    var silo = function (k) {
      grown.forEach(function (e, i) {
        var lp = blobPts(e.lo.x, e.lo.y, e.lo.rx * e.g, e.lo.ry * e.g, 721 + i, 13, 0.3);
        k.moveTo(lp[0][0], lp[0][1]);
        curve(k, jagPoly(lp, 760 + i, 9, 26), true);
      });
    };
    grown.forEach(function (e, i) {
      wash(x, jagPoly(blobPts(e.lo.x, e.lo.y, e.lo.rx * e.g, e.lo.ry * e.g, 721 + i, 13, 0.3),
        760 + i, 9, 26), {
        col: mix(base, low, e.lo.s * 0.55), seed: 730 + i, layers: 3,
        alpha: 0.17 + 0.09 * e.lo.s, edge: 0, bleed: 4
      });
    });
    var bb = [110, 60, 760, 330];
    x.save();
    x.beginPath(); silo(x); x.clip();
    /* An opaque core. Left translucent all the way through, the torn-paper
       newsprint on the wall behind printed straight through the cloud and
       tiled it with little grey blocks. */
    x.globalAlpha = 0.66 * Math.min(1, f * 1.4);
    x.fillStyle = mix(base, lit, 0.28);
    x.fillRect(0, 0, W, H);
    x.globalAlpha = 1;
    /* the roll of it: broad slow strokes lying along the cloud, lightening
       upward, so the mass turns over */
    for (var s = 0; s < 54; s++) {
      var sy = bb[1] + r() * bb[3];
      var up = 1 - (sy - bb[1]) / bb[3];
      var sx = bb[0] - 120 + r() * (bb[2] + 180);
      var L = 130 + r() * 330;
      /* No dry gaps on the wide passes. At this width the gaps land at a
         similar size all over and tile the cloud into grey brickwork. */
      brush(x, [[sx, sy], [sx + L * 0.5, sy + (r() - 0.5) * 34], [sx + L, sy + (r() - 0.5) * 44]], {
        col: jit(mix(low, lit, Math.pow(up, 0.8) * (0.35 + r() * 0.65)), r, 14),
        w: 40 + r() * 90, alpha: 0.08 + r() * 0.13, bristles: 4,
        seed: 740 + s, dens: 5, taper: 0.85, spread: 0.6, thick: 2.6
      });
    }
    /* curdling at the top where it is piling up */
    for (var c = 0; c < 26; c++) {
      var cx0 = bb[0] + r() * bb[2], cy0 = bb[1] + r() * bb[3] * 0.45;
      var cr = 26 + r() * 62;
      wash(x, blobPts(cx0, cy0, cr, cr * (0.5 + r() * 0.5), (r() * 1e5) | 0, 9, 0.3), {
        col: r() < 0.62 ? lit : mix(base, lit, 0.5), seed: (r() * 1e5) | 0,
        layers: 2, alpha: 0.075, edge: 0
      });
    }
    /* and the flat wet underside it will rain out of */
    for (var w0 = 0; w0 < 20; w0++) {
      var wx = bb[0] - 60 + r() * (bb[2] + 120);
      var wy = bb[1] + bb[3] * (0.66 + r() * 0.38);
      brush(x, [[wx, wy], [wx + 120 + r() * 240, wy + (r() - 0.5) * 30]], {
        col: mix(low, '#05090e', 0.3 + r() * 0.4), w: 46 + r() * 92,
        alpha: 0.07 + r() * 0.12, bristles: 4, seed: 790 + w0, dens: 5,
        taper: 0.85, spread: 0.6, thick: 2.6
      });
    }
    textureThrough(x, craze, function (k) { k.rect(0, 0, W, H); }, 0.3, -200, -140);
    x.restore();
    /* the lit shoulder, laid over the silhouette edge so the top catches */
    for (var t = 0; t < 18; t++) {
      var tx = 190 + r() * 580;
      brush(x, [[tx, 128 + r() * 58], [tx + 80 + r() * 160, 120 + r() * 62]], {
        col: mix('#ffffff', '#93a4b4', dark), w: 24 + r() * 52,
        alpha: (0.05 + r() * 0.09) * f, bristles: 4, seed: 780 + t, dens: 5,
        taper: 0.85, spread: 0.6, thick: 2.6
      });
    }
  }

  /* ---------------- steam: the column that feeds it ---------------- */
  function steam(x, u, f, dark) {
    if (f <= 0) return;
    var step = Math.floor(u * 12), r = rnd(step * 6151 + 29);
    var sx0 = KX - 340, sy0 = KY - 330;
    for (var i = 0; i < 16; i++) {
      var sway = Math.sin(step * 0.31 + i) * 34;
      var climb = 90 + r() * 320;
      var pts = [[sx0 + (r() - 0.5) * 30, sy0 - r() * 20],
        [sx0 + sway * 0.5 + (r() - 0.5) * 44, sy0 - climb * 0.45],
        [sx0 + sway + (r() - 0.5) * 70, sy0 - climb]];
      brush(x, pts, {
        col: mix(P.steam, '#8d9aa6', dark), w: 30 + r() * 62,
        alpha: (0.04 + r() * 0.08) * f, bristles: 4, seed: (r() * 1e6) | 0,
        dens: 6, taper: 0.8, spread: 0.6, thick: 2.6, fade: true
      });
    }
    /* a few whole curls, so the column has drawing in it as well as haze */
    for (var c = 0; c < 4; c++) {
      var cy0 = sy0 - 40 - r() * 260, cr = 18 + r() * 40;
      brush(x, blobPts(sx0 + (r() - 0.5) * 150, cy0, cr, cr * 0.7, (r() * 1e5) | 0, 9, 0.3), {
        col: mix('#ffffff', '#a4b2be', dark), w: 4 + r() * 5,
        alpha: (0.08 + r() * 0.12) * f, bristles: 1, close: true,
        seed: (r() * 1e6) | 0, dens: 7, arc: 1.2
      });
    }
  }

  /* ---------------- rain out of the cloud into the cup ---------------- */
  function rain(x, u, f) {
    if (f <= 0) return;
    var step = Math.floor(u * 12), r = rnd(step * 4409 + 71);
    /* Rain falls; it does not radiate. Long strokes converging on the cup
       turned the square into a ray diagram, and at full length and near-white
       they were scratches in the film. Each drop is now a short fast dash,
       leaning the same way as its neighbours, mostly barely there. */
    var lean = 0.1 + 0.05 * Math.sin(step * 0.27);
    var n = Math.round(230 * f);
    for (var i = 0; i < n; i++) {
      var x0 = 40 + r() * 1000, y0 = 250 + r() * 700;
      var L = 26 + Math.pow(r(), 1.7) * 150;
      brush(x, [[x0, y0], [x0 - L * lean * 0.5, y0 + L * 0.5], [x0 - L * lean, y0 + L]], {
        col: mix('#b4c2cc', '#ffffff', r() * 0.45), w: 1 + r() * 2.2,
        alpha: (0.05 + Math.pow(r(), 1.8) * 0.3) * f, bristles: 1,
        seed: (r() * 1e6) | 0, dens: 5, taper: 0.85, ribbon: true
      });
    }
    /* Over the cup it comes down harder, which is the whole joke: the weather
       has an opinion about where the tea goes. */
    for (var j = 0; j < Math.round(46 * f); j++) {
      var jx = 862 + (r() - 0.5) * 150, jy = 330 + r() * 470;
      var jL = 40 + r() * 130;
      brush(x, [[jx, jy], [jx - jL * lean, jy + jL]], {
        col: mix('#ccd8e0', '#ffffff', r() * 0.6), w: 1.3 + r() * 2.4,
        alpha: (0.14 + r() * 0.3) * f, bristles: 1,
        seed: (r() * 1e6) | 0, dens: 5, taper: 0.8, ribbon: true
      });
    }
    /* veils behind it, so the air is wet and not just striped */
    for (var v = 0; v < 18; v++) {
      var vx = 120 + r() * 800, vy = 260 + r() * 300;
      brush(x, [[vx, vy], [vx + 60, vy + 240], [vx + 130, vy + 480]], {
        col: '#9fadb8', w: 50 + r() * 120, alpha: (0.014 + r() * 0.03) * f,
        bristles: 4, seed: (r() * 1e6) | 0, dens: 6, taper: 0.85, spread: 0.6,
        thick: 2.6, fade: true
      });
    }
    /* splash in the cup, and a couple that miss */
    for (var s = 0; s < 7; s++) {
      var px = 806 + r() * 120, py = 812 + r() * 16;
      brush(x, [[px, py], [px + (r() - 0.5) * 40, py - 20 - r() * 34]], {
        col: '#f0f6f8', w: 2 + r() * 3.4, alpha: (0.2 + r() * 0.3) * f,
        bristles: 1, seed: (r() * 1e6) | 0, dens: 5, taper: 0.6, ribbon: true
      });
    }
    spatter(x, 862, 818, 74, 14, '#e8f0f4', step * 13 + 3, 2.4);
  }

  /* how full the cup is: the payoff */
  function tea(x, f) {
    if (f <= 0) return;
    var top = 830 - f * 26;
    var surf = [[798 + (1 - f) * 14, top], [862, top - 5], [930 - (1 - f) * 14, top + 3]];
    x.save();
    x.beginPath(); curve(x, CUP, true); x.clip();
    wash(x, [[790, top], [934, top - 6], [934, 944], [790, 944]], {
      col: '#6b3a12', seed: 901, layers: 4, alpha: 0.22, edge: 0
    });
    var r = rnd(902);
    for (var i = 0; i < 16; i++) {
      var iy = top + 6 + r() * (944 - top);
      brush(x, [[794, iy], [862 + (r() - 0.5) * 40, iy + (r() - 0.5) * 8], [932, iy + (r() - 0.5) * 9]], {
        col: jit(r() < 0.5 ? '#8a4f18' : '#4a2408', r, 26), w: 6 + r() * 16,
        alpha: 0.1 + r() * 0.2, bristles: 3, seed: 910 + i, dens: 5, dry: 0.3
      });
    }
    x.restore();
    brush(x, surf, {
      col: '#c98a3a', w: 7, alpha: 0.5 * f, bristles: 2, seed: 903,
      dens: 8, arc: 0.5, ribbon: true
    });
  }

  /* ---------------- plates, baked once ---------------- */
  var gRoom = room(false), gStorm = room(true);

  var kettleRoom = plate(W, H), kettleStorm = plate(W, H);
  paintKettle(kettleRoom.x, false); paintCup(kettleRoom.x, false);
  paintKettle(kettleStorm.x, true); paintCup(kettleStorm.x, true);

  /* Stroke order for painting the kettle on: the way you would actually
     build it — body, then the spout out of it, then the handle over, then
     the lid down, then the cup last because it is only waiting. */
  var kettleRev = new Reveal(W, H, (function () {
    var s = [], r = rnd(1201);
    var bandY = [KY + 250, KY + 170, KY + 90, KY + 10, KY - 70, KY - 140];
    bandY.forEach(function (y, i) {
      var half = 176 + (i < 2 ? 14 : -i * 8);
      s.push({
        pts: [[KX - half - 20, y + (r() - 0.5) * 18], [KX, y - 12 + (r() - 0.5) * 20],
          [KX + half + 24, y + (r() - 0.5) * 18]],
        w: 132
      });
    });
    s.push({ pts: SPOUT_MID, w: 132 });
    s.push({ pts: HANDLE, w: 96 });
    s.push({ pts: [[KX - 120, KY - 190], [KX + 10, KY - 240], [KX + 120, KY - 186]], w: 118 });
    s.push({ pts: [[KX - 20, KY - 250], [KX + 20, KY - 280]], w: 74 });
    return s;
  })());

  var cupRev = new Reveal(W, H, [
    { pts: [[788, 820], [862, 800], [938, 818]], w: 96 },
    { pts: [[790, 880], [862, 866], [936, 878]], w: 96 },
    { pts: [[800, 934], [862, 948], [928, 932]], w: 84 },
    { pts: [[928, 840], [980, 866], [934, 898]], w: 58 }
  ]);

  /* The front coming through. Same lesson as the other two films: an advancing
     straight edge reads as a sheet of plastic sliding over the picture, so the
     sweep goes on in bands of short overlapping scrubs and its face stays
     torn. */
  var frontStrokes = (function () {
    var s = [], r = rnd(1301), bands = 24, per = 7;
    for (var b = 0; b < bands; b++) {
      var base = -240 + (b / (bands - 1)) * 1620;
      var offs = [];
      for (var k = 0; k < per; k++) offs.push(-780 + (k / (per - 1)) * 1560 + (r() - 0.5) * 160);
      for (var k2 = offs.length - 1; k2 > 0; k2--) {
        var sw = (r() * (k2 + 1)) | 0, tmp = offs[k2]; offs[k2] = offs[sw]; offs[sw] = tmp;
      }
      offs.forEach(function (off) {
        var c = base + (r() - 0.5) * 72;
        var cx = c + off * 0.2, cy = off;
        var ang = 0.34 + (r() - 0.5) * 0.5;
        var L = 430 + r() * 330;
        s.push({
          pts: [[cx - Math.cos(ang) * L / 2, cy - Math.sin(ang) * L / 2],
            [cx + (r() - 0.5) * 40, cy + (r() - 0.5) * 40],
            [cx + Math.cos(ang) * L / 2, cy + Math.sin(ang) * L / 2]],
          w: 150 + r() * 90
        });
      });
    }
    return s;
  })();
  var frontRev = new Reveal(W, H, frontStrokes);

  var backStrokes = (function () {
    var s2 = [], r = rnd(1601), bands = 24, per = 7;
    for (var b = 0; b < bands; b++) {
      var base = 1640 - (b / (bands - 1)) * 1720;
      var ys = [];
      for (var k = 0; k < per; k++) ys.push(-120 + (k / (per - 1)) * 1320 + (r() - 0.5) * 170);
      for (var k2 = ys.length - 1; k2 > 0; k2--) {
        var sw = (r() * (k2 + 1)) | 0, tmp = ys[k2]; ys[k2] = ys[sw]; ys[sw] = tmp;
      }
      ys.forEach(function (y0) {
        var x0 = base + (r() - 0.5) * 80;
        var ang = Math.PI / 2 + (r() - 0.5) * 0.55;
        var L = 440 + r() * 340;
        s2.push({
          pts: [[x0 - Math.cos(ang) * L / 2, y0 - Math.sin(ang) * L / 2],
            [x0 + (r() - 0.5) * 50, y0 + (r() - 0.5) * 40],
            [x0 + Math.cos(ang) * L / 2, y0 + Math.sin(ang) * L / 2]],
          w: 155 + r() * 95
        });
      });
    }
    return s2;
  })();
  var backRev = new Reveal(W, H, backStrokes);

  /* the belly holds the other weather, blurred in as reflection not decal */
  var BELLY = blobPts(KX - 18, KY + 46, 128, 150, 1401, 15, 0.1);

  function belly(x, src, f) {
    if (f <= 0) return;
    var b = bellyP.x;
    b.clearRect(0, 0, W, H);
    /* feathered mask: nested shrinks accumulating alpha, so the edge of the
       reflection dissolves instead of being die-cut */
    for (var i = 0; i < 9; i++) {
      b.save();
      b.beginPath(); curve(b, shrinkPts(BELLY, 1 - i * 0.055), true); b.clip();
      b.globalAlpha = 0.13;
      b.drawImage(src.c, 0, 0);
      b.restore();
    }
    /* Laid in as light on curved tin, not as a picture pasted into a window.
       Drawn straight over at strength it bleached a hole through the middle
       of the kettle and the form went with it. */
    x.save();
    x.globalCompositeOperation = 'soft-light';
    x.globalAlpha = f * 0.85;
    x.drawImage(bellyP.c, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = f * 0.2;
    x.drawImage(bellyP.c, 0, 0);
    x.restore();
    /* the curve of the tin bending the light across it */
    var r = rnd(1411);
    for (var k = 0; k < 9; k++) {
      var ky = KY - 80 + k * 30;
      brush(x, [[KX - 130, ky + (r() - 0.5) * 16], [KX - 20, ky - 10], [KX + 110, ky + (r() - 0.5) * 14]], {
        col: k < 3 ? '#cfe8ea' : '#0a1e26', w: 10 + r() * 22,
        alpha: (0.05 + r() * 0.08) * f, bristles: 3, seed: 1420 + k,
        dens: 6, dry: 0.3, taper: 0.8
      });
    }
  }

  /* ---------------- words ---------------- */
  var wordsP = plate(W, H);
  (function () {
    var x = wordsP.x;
    /* Both lines sat too low: at this size the descenders of the second one
       fell off the bottom of the square and it read as half a word. */
    hand(x, 'showers later,', 92, 952, 47, {
      col: mix(P.cream, P.amber, 0.34), seed: 1501, w: 0.09, bristles: 2, alpha: 0.9
    });
    hand(x, 'mainly in the cup', 142, 1010, 47, {
      col: mix(P.cream, P.amber, 0.34), seed: 1502, w: 0.09, bristles: 2, alpha: 0.9
    });
  })();

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  /* ---------------- the eleven and a half seconds ---------------- */
  window.draw = function (t) {
    var u = ((t % DUR) + DUR) % DUR;
    X.clearRect(0, 0, W, H);

    /* --- ground, and the front that changes it --- */
    var fp = clamp01((u - 7.2) / 1.25);
    X.drawImage(gRoom.c, 0, 0);
    if (fp > 0) {
      var m = frontRev.mask(fp);
      X.save();
      X.globalCompositeOperation = 'source-over';
      var tmp = cloudP;
      tmp.x.clearRect(0, 0, W, H);
      tmp.x.drawImage(gStorm.c, 0, 0);
      tmp.x.globalCompositeOperation = 'destination-in';
      tmp.x.drawImage(m.plate.c, 0, 0);
      tmp.x.globalCompositeOperation = 'source-over';
      X.drawImage(tmp.c, 0, 0);
      X.restore();
      /* the loaded edge of the brush, live, so the sweep is a mark and not
         a wipe between two bitmaps */
      if (m.cur) {
        var sc = ['#3c4c5e', '#22303e', P.stormLt, '#1a2530', '#54687c'];
        for (var q = 0; q < 3; q++) {
          brush(X, partial(m.cur.pts, clamp01(m.f * 1.3)), {
            col: sc[(m.i + q) % sc.length], w: m.cur.w * (0.5 + q * 0.2),
            alpha: 0.22 - q * 0.05, bristles: 5, seed: m.i * 37 + q,
            dens: 5, dry: 0.3, taper: 0.8, spread: 1.05
          });
        }
      }
    }
    var storm = fp > 0.45;
    var dark = clamp01((u - 6.4) / 1.6);

    /* --- the heat: on from 3.7, and the last thing the storm takes --- */
    var hf = clamp01((u - 3.7) / 0.9);
    var puls = 0.86 + 0.14 * Math.sin(u * 5.1) + 0.06 * Math.sin(u * 11.3);
    heat(X, KX + 10, KY + 268, hf * puls, storm);

    /* --- the kettle, painted on --- */
    var kp = clamp01((u - 1.3) / 1.6);
    var src = storm ? kettleStorm : kettleRoom;
    if (kp >= 1) {
      X.drawImage(src.c, 0, 0);
    } else if (kp > 0) {
      var km = kettleRev.mask(kp);
      var kt = cloudP;
      kt.x.clearRect(0, 0, W, H);
      kt.x.drawImage(src.c, 0, 0);
      kt.x.globalCompositeOperation = 'destination-in';
      kt.x.drawImage(km.plate.c, 0, 0);
      kt.x.globalCompositeOperation = 'source-over';
      X.drawImage(kt.c, 0, 0);
      if (km.cur) {
        brush(X, partial(km.cur.pts, clamp01(km.f * 1.35)), {
          col: km.i > 5 ? '#5a2d16' : P.enamel, w: km.cur.w * 0.62,
          alpha: 0.5, bristles: 5, seed: km.i * 29 + 7, dens: 5,
          dry: 0.22, taper: 0.7, spread: 1.05, vary: 24
        });
      }
    }
    /* the cup arrives after, and only waits */
    var cp = clamp01((u - 2.9) / 0.8);
    if (cp > 0 && cp < 1) {
      var cm = cupRev.mask(cp);
      var ct = bellyP;
      ct.x.clearRect(0, 0, W, H);
      ct.x.drawImage(src.c, 0, 0);
      ct.x.globalCompositeOperation = 'destination-in';
      ct.x.drawImage(cm.plate.c, 0, 0);
      ct.x.globalCompositeOperation = 'source-over';
      X.save();
      X.beginPath(); curve(X, movePts(CUP, 0, 0), true);
      X.rect(930, 830, 60, 80);
      X.clip();
      X.drawImage(ct.c, 0, 0);
      X.restore();
    }

    /* --- the belly reflection: whichever weather the room is not in --- */
    var bf = clamp01((u - 6.1) / 0.9);
    if (kp >= 1) belly(X, storm ? gRoom : gStorm, bf);

    /* --- steam, gathering --- */
    var sf = clamp01((u - 4.6) / 0.8);
    steam(X, u, sf, dark);

    /* --- the cloud it becomes --- */
    var cf = clamp01((u - 5.0) / 1.5);
    paintCloud(X, dark, cf);

    /* --- and what it does --- */
    var rf = clamp01((u - 8.4) / 0.8);
    rain(X, u, rf);
    tea(X, clamp01((u - 8.7) / 1.9));

    /* --- the forecast, in her hand --- */
    var wf = clamp01((u - 9.3) / 0.7);
    if (wf > 0) {
      X.save();
      X.globalAlpha = wf;
      X.drawImage(wordsP.c, 0, 0);
      X.restore();
    }

    /* Closing the loop. Every element used to hold to the last frame and then
       vanish, so the restart was a hard cut back to an empty bench. The
       weather clears the same way it arrived: the bare kitchen is scrubbed
       back over the top, and the last frame is the first frame. */
    var tb = clamp01((u - 10.45) / 1.05);
    if (tb > 0) {
      var bm = backRev.mask(tb);
      var bt = cloudP;
      bt.x.clearRect(0, 0, W, H);
      bt.x.drawImage(gRoom.c, 0, 0);
      bt.x.globalCompositeOperation = 'destination-in';
      bt.x.drawImage(bm.plate.c, 0, 0);
      bt.x.globalCompositeOperation = 'source-over';
      X.drawImage(bt.c, 0, 0);
      if (bm.cur) {
        var bc = [P.putty, P.clay, P.plaster, '#d8c9ae', '#c2b49c'];
        for (var z = 0; z < 3; z++) {
          brush(X, partial(bm.cur.pts, clamp01(bm.f * 1.3)), {
            col: bc[(bm.i + z) % bc.length], w: bm.cur.w * (0.5 + z * 0.2),
            alpha: 0.24 - z * 0.06, bristles: 4, seed: bm.i * 41 + z,
            dens: 5, taper: 0.85, spread: 0.6, thick: 2.6
          });
        }
      }
    }

    applyGrain(X, grain, 0.1, W, H);
  };
})();
/* auto-start; ?t=SEC renders one frame and holds it, for frame review */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has('t')) { window.draw(parseFloat(q.get('t')) || 0); return; }
  var t0 = null;
  function frame(now) {
    if (t0 == null) t0 = now;
    window.draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
