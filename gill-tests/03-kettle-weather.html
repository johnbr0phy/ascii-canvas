<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>03 — Kettle Weather</title>
<style>
  html,body{margin:0;height:100%;background:#1a1612;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,100vh);height:min(100vw,100vh);display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
/* 03-kettle-weather — ~10s seamless loop
   Kitchen kettle as tiny weather system — monumental ordinary (Gill thesis).
   Steam as clouds; revealing lens into the boil (slate pressure chart).
   Accent: amber/gold heat. Hard cuts / paint-over. NOT: catalogue kitchen pieces, Claude green. */
(function () {
  const W = 1080, H = 1080, DUR = 10;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const P = {
    cream: '#F5F0E6', peach: '#FACFAE', amber: '#F3B616',
    gold: '#FFD700', cadmium: '#FF4D00', ochre: '#8B5A2B',
    turquoise: '#38BDF8', navy: '#0a3a59', ink: '#121212',
    slate: '#211919', mist: '#E9E5E2', steam: '#f1fafa',
    copper: '#B8860B', warmgrey: '#ded4d7'
  };

  function R(seed) {
    let s = seed | 0;
    return () => { s = (s * 1664525 + 1013904223) | 0; return (s >>> 0) / 4294967296; };
  }
  function mix(a, b, t) {
    const p = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const A = p(a), B = p(b);
    const r = (A[0]+(B[0]-A[0])*t)|0, g = (A[1]+(B[1]-A[1])*t)|0, bl = (A[2]+(B[2]-A[2])*t)|0;
    return '#' + [r,g,bl].map(x => ('0'+Math.max(0,Math.min(255,x)).toString(16)).slice(-2)).join('');
  }

  function bristle(c, x0,y0,x1,y1, w, col, rng, opts) {
    opts = opts || {};
    const n = opts.bristles || 5;
    const a0 = opts.alpha != null ? opts.alpha : 0.85;
    for (let i = 0; i < n; i++) {
      const o = (i - (n-1)/2) * (w / n) * 0.9;
      const ang = Math.atan2(y1-y0, x1-x0) + Math.PI/2;
      const ox = Math.cos(ang)*o + (rng()-0.5)*1.2;
      const oy = Math.sin(ang)*o + (rng()-0.5)*1.2;
      c.beginPath();
      c.moveTo(x0+ox, y0+oy);
      const mx = (x0+x1)/2 + (rng()-0.5)*w*0.3;
      const my = (y0+y1)/2 + (rng()-0.5)*w*0.3;
      c.quadraticCurveTo(mx, my, x1+ox*0.6, y1+oy*0.6);
      c.strokeStyle = col;
      c.globalAlpha = a0 * (0.55 + rng()*0.45);
      c.lineWidth = Math.max(1.2, w/n * (0.7 + rng()*0.6));
      c.lineCap = 'round';
      c.stroke();
    }
    c.globalAlpha = 1;
  }

  function kitchenGround(c, heat) {
    const rng = R(27);
    const base = mix(P.cream, P.peach, 0.2 + heat*0.25);
    c.fillStyle = base;
    c.fillRect(0,0,W,H);
    for (let i = 0; i < 70; i++) {
      const x = rng()*W, y = rng()*H;
      bristle(c, x, y, x+(rng()-0.5)*120, y+(rng()-0.5)*40,
        6+rng()*16, mix(base, rng()<0.4?P.warmgrey:P.amber, rng()*0.35), rng, {bristles:3, alpha:0.2});
    }
    // counter band
    c.fillStyle = mix(P.ochre, P.ink, 0.35);
    c.globalAlpha = 0.25;
    c.fillRect(0, H-160, W, 160);
    c.globalAlpha = 1;
    for (let i = 0; i < 20; i++) {
      bristle(c, rng()*W, H-140+rng()*100, rng()*W, H-100+rng()*80,
        4, mix(P.ochre, P.ink, 0.2), rng, {bristles:2, alpha:0.2});
    }
  }

  function slateBoil(c) {
    const rng = R(44);
    c.fillStyle = P.slate;
    c.fillRect(0,0,W,H);
    for (let i = 0; i < 35; i++) {
      bristle(c, rng()*W, rng()*H, rng()*W, rng()*H, 4+rng()*10,
        mix(P.slate, P.navy, rng()), rng, {bristles:2, alpha:0.22});
    }
  }

  function drawKettle(c, cx, cy, scale, t, roaring) {
    const rng = R(91);
    const bodyW = 160 * scale;
    const bodyH = 200 * scale;
    // body — copper/amber vessel personality
    c.beginPath();
    c.moveTo(cx - bodyW*0.45, cy + bodyH*0.35);
    c.quadraticCurveTo(cx - bodyW*0.55, cy, cx - bodyW*0.4, cy - bodyH*0.35);
    c.lineTo(cx + bodyW*0.35, cy - bodyH*0.38);
    c.quadraticCurveTo(cx + bodyW*0.5, cy, cx + bodyW*0.42, cy + bodyH*0.35);
    c.closePath();
    const bodyCol = mix(P.copper, roaring ? P.cadmium : P.amber, roaring ? 0.45 : 0.25);
    c.fillStyle = bodyCol;
    c.fill();
    // impasto strokes on body
    for (let i = 0; i < 16; i++) {
      const yy = cy - bodyH*0.25 + i*bodyH*0.04;
      bristle(c, cx-bodyW*0.3, yy, cx+bodyW*0.3, yy+(rng()-0.5)*6,
        5+rng()*8, mix(bodyCol, P.gold, rng()*0.4), rng, {bristles:3, alpha:0.4});
    }
    // thick charcoal outline
    c.strokeStyle = P.ink;
    c.lineWidth = 8 * scale;
    c.stroke();
    // spout
    c.beginPath();
    c.moveTo(cx + bodyW*0.32, cy - bodyH*0.15);
    c.quadraticCurveTo(cx + bodyW*0.75, cy - bodyH*0.35, cx + bodyW*0.85, cy - bodyH*0.05);
    c.lineTo(cx + bodyW*0.7, cy + bodyH*0.05);
    c.quadraticCurveTo(cx + bodyW*0.45, cy, cx + bodyW*0.35, cy + bodyH*0.08);
    c.closePath();
    c.fillStyle = mix(bodyCol, P.ochre, 0.2);
    c.fill();
    c.stroke();
    // handle
    c.beginPath();
    c.arc(cx - bodyW*0.55, cy, 55*scale, -1.1, 1.1);
    c.strokeStyle = P.ink;
    c.lineWidth = 10*scale;
    c.lineCap = 'round';
    c.stroke();
    // lid knob — gold accent
    c.beginPath();
    c.arc(cx, cy - bodyH*0.42, 14*scale, 0, Math.PI*2);
    c.fillStyle = P.gold;
    c.fill();
    c.strokeStyle = P.ink;
    c.lineWidth = 3;
    c.stroke();
    // whistle spark when roaring
    if (roaring) {
      const wx = cx + bodyW*0.85;
      const wy = cy - bodyH*0.05;
      for (let k = 0; k < 5; k++) {
        const a = -0.8 + k*0.35 + Math.sin(t*8)*0.1;
        bristle(c, wx, wy, wx+Math.cos(a)*40, wy+Math.sin(a)*40,
          3, mix(P.cadmium, P.gold, k/5), R(50+k), {bristles:2, alpha:0.75});
      }
    }
  }

  function steamWeather(c, cx, cy, t, intensity) {
    // steam as cloud bands / weather system — monumental
    const rng = R(15);
    for (let i = 0; i < 8; i++) {
      const phase = t * (0.4 + i*0.08) + i;
      const x = cx + Math.sin(phase)*40*(1+i*0.15) + (i-4)*18;
      const y = cy - 80 - i*45 - Math.sin(t*2+i)*10;
      const rw = (50 + i*12) * intensity;
      const rh = (28 + i*6) * intensity;
      c.beginPath();
      c.ellipse(x, y, rw, rh, Math.sin(phase)*0.3, 0, Math.PI*2);
      c.fillStyle = mix(P.steam, i%2?P.turquoise:P.mist, 0.15 + i*0.04);
      c.globalAlpha = 0.25 + (1-i/8)*0.35 * intensity;
      c.fill();
      c.globalAlpha = 1;
      // bristle soft edge
      for (let j = 0; j < 4; j++) {
        bristle(c, x-rw*0.6, y+(rng()-0.5)*rh, x+rw*0.6, y+(rng()-0.5)*rh,
          3, mix(P.steam, P.ink, 0.05), rng, {bristles:2, alpha:0.15});
      }
    }
    // rain-from-steam drizzle returning — weather cycle joke
    if (intensity > 0.7) {
      for (let i = 0; i < 12; i++) {
        const x = cx - 100 + rng()*200;
        const y0 = cy - 350 + ((t*60 + i*40) % 200);
        bristle(c, x, y0, x+1, y0+20, 1.5, mix(P.turquoise, P.navy, 0.3), R(300+i), {bristles:1, alpha:0.25});
      }
    }
  }

  function pressureDiagram(c, t) {
    slateBoil(c);
    // concentric pressure rings — chaos→grid
    const cx = W*0.5, cy = H*0.52;
    const snap = (Math.sin(t*1.8)+1)*0.5;
    for (let i = 1; i <= 6; i++) {
      c.beginPath();
      if (snap < 0.4) {
        // wobble chaos rings
        const rng = R(100+i);
        c.moveTo(cx + i*55, cy);
        for (let a = 0; a < Math.PI*2; a += 0.3) {
          const j = (rng()-0.5)*12*(1-snap);
          c.lineTo(cx + Math.cos(a)*(i*55+j), cy + Math.sin(a)*(i*55+j));
        }
        c.closePath();
      } else {
        c.arc(cx, cy, i*55, 0, Math.PI*2);
      }
      c.strokeStyle = mix(P.amber, P.cadmium, i/6);
      c.lineWidth = 2.5;
      c.globalAlpha = 0.35 + i*0.08;
      c.stroke();
      c.globalAlpha = 1;
    }
    // boil bubbles as data dots
    for (let i = 0; i < 18; i++) {
      const a = (i/18)*Math.PI*2 + t;
      const r = 40 + (i%5)*35 + Math.sin(t*4+i)*8;
      const x = cx + Math.cos(a)*r;
      const y = cy + Math.sin(a)*r*0.7;
      c.beginPath();
      c.arc(x, y, 4+ (i%3), 0, Math.PI*2);
      c.fillStyle = i%3===0 ? P.gold : P.cadmium;
      c.globalAlpha = 0.8;
      c.fill();
      c.globalAlpha = 1;
    }
    // kettle silhouette ghost — match-cut continuity
    drawKettle(c, cx, cy+40, 0.55, t, true);
    // amber heat accent — reserved
    c.beginPath();
    c.arc(W-100, 100, 20, 0, Math.PI*2);
    c.fillStyle = P.amber;
    c.fill();
    // HUD-ish temperature ticks (Gill satnav energy, not Kevin neon)
    for (let i = 0; i < 8; i++) {
      const y = 200 + i*70;
      bristle(c, 60, y, 100 + (i===5?40:0), y, 2, mix(P.gold, P.cream, 0.3), R(400+i), {bristles:1, alpha:0.55});
    }
  }

  function revealingLens(c, cx, cy, r, drawInside) {
    c.save();
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI*2);
    c.clip();
    drawInside();
    c.restore();
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI*2);
    c.strokeStyle = P.ink;
    c.lineWidth = 9;
    c.stroke();
    c.beginPath();
    c.arc(cx, cy, r+6, 0, Math.PI*2);
    c.strokeStyle = P.amber;
    c.lineWidth = 3;
    c.globalAlpha = 0.55;
    c.stroke();
    c.globalAlpha = 1;
  }

  function drawKitchenScene(c, t) {
    const heat = 0.3 + 0.7 * Math.min(1, (Math.sin(t*0.9)*0.5+0.5));
    kitchenGround(c, heat);
    const roaring = heat > 0.55;
    // steam weather ABOVE — epic sky from kettle
    steamWeather(c, W*0.52, H*0.42, t, 0.5 + heat*0.5);
    drawKettle(c, W*0.48, H*0.62, 1.15, t, roaring);
    // tiny lightning joke in steam when roaring
    if (roaring && Math.sin(t*12) > 0.85) {
      bristle(c, W*0.55, H*0.22, W*0.62, H*0.32, 3, P.gold, R(7), {bristles:2, alpha:0.7});
      bristle(c, W*0.62, H*0.32, W*0.58, H*0.38, 2.5, P.cadmium, R(8), {bristles:2, alpha:0.7});
    }
  }

  function draw(t) {
    const u = ((t % DUR) + DUR) % DUR;
    // breathe kitchen 0-3, lens into boil 3-4.5, slate pressure 4.5-7, hard wipe 7-8.2, kitchen 8.2-10
    if (u < 3.0) {
      drawKitchenScene(ctx, u);
    } else if (u < 4.5) {
      drawKitchenScene(ctx, u);
      const p = (u - 3.0) / 1.5;
      // lens centres on spout / boil
      revealingLens(ctx, W*0.62, H*0.48, 30 + p*520, () => pressureDiagram(ctx, u));
    } else if (u < 7.0) {
      pressureDiagram(ctx, u);
    } else if (u < 8.3) {
      pressureDiagram(ctx, u);
      const p = (u - 7.0) / 1.3;
      // hard horizontal paint-over scrape
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, H - p*(H+40), W, H);
      ctx.clip();
      drawKitchenScene(ctx, u);
      ctx.restore();
      const y = H - p*(H+40);
      bristle(ctx, 0, y, W, y+6, 16, mix(P.cream, P.amber, 0.3), R(11), {bristles:7, alpha:0.55});
    } else {
      drawKitchenScene(ctx, u);
    }
  }

  window.draw = draw;
  let t0 = null;
  function frame(now) {
    if (t0 == null) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
