<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a life in colour</title>
<style>
  html, body { margin:0; height:100%; background:#100e0c; overflow:hidden; }
  body { display:grid; place-items:center; }
  canvas { width:min(100vw,100vh); height:min(100vw,100vh); display:block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
/* ---------------------------------------------------------------------------
   a life in colour  —  60.000s, the human condition in Gill Brophy's language
   Every frame is drawn by hand in JavaScript. No images, no fonts, no filters.
   See STYLE.md for the sampled palette and the eight rules this obeys.
--------------------------------------------------------------------------- */

const W = 1080, H = 1080;
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

/* --- palette: twelve sampled colours, two structural darks, few accents --- */
const P = {
  cream:'#F9EFD4', warmgrey:'#E2D8DB', peach:'#F4BB8E', vermilion:'#EF4404',
  orange:'#E45728', gold:'#F4B819',    pink:'#DFA3B9',  magenta:'#C8688E',
  turquoise:'#11AFCB', denim:'#4B96BA', night:'#0A517C', leaf:'#38633D',
  ink:'#1D1818', ochre:'#6D4513',
  // accents, all sampled: Moonset sun, Jacob's Pots teal, Small Crowd pale,
  // Fields of Gold earth, the woodland dark, Path to the River sage
  sun:'#F1895C', teal:'#17826B', pale:'#FACFAE', earth:'#8F704E',
  wood:'#2C2D32', sage:'#6F967F', deepred:'#B42408', slate:'#565D56'
};

/* ------------------------------ maths -------------------------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function R(seed){
  const f = mulberry32(seed>>>0 || 1);
  return { f, r:(a,b)=>a+(b-a)*f(), i:n=>Math.floor(f()*n), pick:a=>a[Math.floor(f()*a.length)] };
}
const clamp  = (v,a,b)=>v<a?a:v>b?b:v;
const smooth = t => (t=clamp(t,0,1), t*t*(3-2*t));
const eout   = t => 1-Math.pow(1-clamp(t,0,1),3);

/* ------------------------------ colour ------------------------------- */
function rgb(c){
  if (typeof c !== 'string') return c;
  return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
}
function shade(c,a){                       // +1 toward white, -1 toward black
  const p = rgb(c), t = a>0?255:0, k = Math.abs(a);
  return [p[0]+(t-p[0])*k, p[1]+(t-p[1])*k, p[2]+(t-p[2])*k];
}
function mix(a,b,k){
  const p=rgb(a), q=rgb(b);
  return [p[0]+(q[0]-p[0])*k, p[1]+(q[1]-p[1])*k, p[2]+(q[2]-p[2])*k];
}
function css(c,a){
  const p = rgb(c);
  return 'rgba('+(p[0]|0)+','+(p[1]|0)+','+(p[2]|0)+','+(a==null?1:clamp(a,0,1))+')';
}

/* ---------------------------- geometry ------------------------------- */
// a hand-drawn line: gentle bow plus three-octave wobble, never straight
function pathLine(x0,y0,x1,y1,o,rng){
  o = o||{};
  const n = o.n||18, bow = o.bow||0, wb = o.wob==null?4:o.wob;
  const dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy)||1;
  const nx = -dy/L, ny = dx/L;
  const p0=rng.r(0,6.28), p1=rng.r(0,6.28), p2=rng.r(0,6.28);
  const f0=0.7+rng.f()*0.8, f1=1.9+rng.f()*1.4, f2=3.7+rng.f()*2.2;
  const pts = [];
  for (let i=0;i<n;i++){
    const u = i/(n-1);
    let off = bow*Math.sin(Math.PI*u);
    off += wb*(0.62*Math.sin(f0*u*6.283+p0) + 0.28*Math.sin(f1*u*6.283+p1)
             + 0.16*Math.sin(f2*u*6.283+p2));
    pts.push({ x:x0+dx*u+nx*off, y:y0+dy*u+ny*off });
  }
  return pts;
}
function trim(pts,k){
  if (k>=1) return pts;
  if (k<=0 || !pts || pts.length<2) return null;
  const L = (pts.length-1)*k, i = Math.floor(L), f = L-i;
  const out = pts.slice(0,i+1);
  if (i+1 < pts.length){
    const a=pts[i], b=pts[i+1];
    out.push({ x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f });
  }
  return out.length>1 ? out : null;
}
function bbox(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  return { x:x0, y:y0, w:x1-x0, h:y1-y0, cx:(x0+x1)/2, cy:(y0+y1)/2 };
}
function poly(c,pts){
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
  for (let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
}
function norms(pts){
  const last = pts.length-1, out = [];
  for (let i=0;i<=last;i++){
    const q=pts[Math.min(i+1,last)], s=pts[Math.max(i-1,0)];
    let dx=q.x-s.x, dy=q.y-s.y; const L=Math.hypot(dx,dy)||1;
    out.push({ nx:-dy/L, ny:dx/L });
  }
  return out;
}
// wobbly ellipse — her circles are never compass circles
function ring(cx,cy,rx,ry,rng,o){
  o=o||{};
  const n = o.n||36, wob = o.wob==null?0.035:o.wob, rot=o.rot||0;
  const p0=rng.r(0,6.28), p1=rng.r(0,6.28);
  const f0=2+rng.i(2), f1=3+rng.i(3);
  const pts=[];
  for (let i=0;i<n;i++){
    const a = i/n*6.283;
    const d = 1 + wob*(0.65*Math.sin(f0*a+p0)+0.35*Math.sin(f1*a+p1));
    const x = Math.cos(a)*rx*d, y = Math.sin(a)*ry*d;
    pts.push({ x:cx+x*Math.cos(rot)-y*Math.sin(rot), y:cy+x*Math.sin(rot)+y*Math.cos(rot) });
  }
  return pts;
}
// a block with hand-drawn edges. she has no ruler
function rectPts(x,y,w,h,rng,wob){
  wob = wob==null ? Math.min(Math.abs(w),Math.abs(h))*0.035 : wob;
  const p=[];
  const run=(ax,ay,bx,by,n)=>{ for(let i=0;i<n;i++){ const u=i/n;
    p.push({ x:ax+(bx-ax)*u+rng.r(-wob,wob), y:ay+(by-ay)*u+rng.r(-wob,wob) }); } };
  const n1=Math.max(3,Math.round(Math.abs(w)/70)), n2=Math.max(3,Math.round(Math.abs(h)/70));
  run(x,y,x+w,y,n1); run(x+w,y,x+w,y+h,n2);
  run(x+w,y+h,x,y+h,n1); run(x,y+h,x,y,n2);
  return p;
}
// pointed at both ends: petals, buds, leaves
function almondPts(cx,cy,len,wid,rot,rng,tip){
  const n=16, ca=Math.cos(rot), sa=Math.sin(rot), out=[];
  const hw = u => wid*Math.pow(Math.sin(Math.PI*clamp(u,0,1)), tip==null?0.68:tip);
  for (let i=0;i<=n;i++){
    const u=i/n, x=(u-0.5)*len, y=hw(u);
    out.push({ x:cx+x*ca-y*sa+rng.r(-1.2,1.2), y:cy+x*sa+y*ca+rng.r(-1.2,1.2) });
  }
  for (let i=n;i>=0;i--){
    const u=i/n, x=(u-0.5)*len, y=-hw(u);
    out.push({ x:cx+x*ca-y*sa+rng.r(-1.2,1.2), y:cy+x*sa+y*ca+rng.r(-1.2,1.2) });
  }
  return out;
}
// smooth silhouette through keypoints — for bottles and pots
function profAt(list,u){
  for (let i=0;i<list.length-1;i++){
    if (u <= list[i+1][0]){
      const a=list[i], b=list[i+1];
      const f=(u-a[0])/Math.max(1e-6,b[0]-a[0]);
      return a[1]+(b[1]-a[1])*(0.5-0.5*Math.cos(f*Math.PI));
    }
  }
  return list[list.length-1][1];
}

/* ------------------------- painterly primitives ---------------------- */
// a loaded brush: a solid tapered core, then bristle grain on top of it
function bristle(c,pts,w,col,rng,o){
  if (!pts || pts.length<2) return;
  o = o||{};
  const alpha = o.alpha==null?0.85:o.alpha;
  const tone  = o.tone==null?0.14:o.tone;
  const last  = pts.length-1;
  const nm    = norms(pts);
  const tp    = o.taper!==false;
  const fall  = i => tp ? 0.40+0.60*Math.sin(Math.PI*clamp(i/Math.max(1,last),0,1)) : 1;

  if (o.core!==false){
    const hw = w*(o.coreW==null?0.86:o.coreW)*0.5;
    c.fillStyle = css(col, alpha*(o.coreA==null?0.95:o.coreA));
    c.beginPath();
    for (let i=0;i<=last;i++){
      const p=pts[i], n=nm[i], h=hw*fall(i);
      const x=p.x+n.nx*h, y=p.y+n.ny*h;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    for (let i=last;i>=0;i--){
      const p=pts[i], n=nm[i], h=hw*fall(i);
      c.lineTo(p.x-n.nx*h, p.y-n.ny*h);
    }
    c.closePath(); c.fill();
  }
  const bn  = o.bristles || clamp(Math.round(w/5)+2,3,11);
  const jit = o.jitter==null?w*0.07:o.jitter;
  c.lineCap = o.cap||'round'; c.lineJoin='round';
  for (let b=0;b<bn;b++){
    const u = bn===1?0:(b/(bn-1)-0.5);
    c.strokeStyle = css(shade(col,(rng.f()-0.5)*2*tone), alpha*rng.r(0.3,0.85));
    c.lineWidth = Math.max(0.7,(w/bn)*rng.r(0.7,1.6));
    c.beginPath();
    for (let i=0;i<=last;i++){
      const p=pts[i], n=nm[i];
      const e = u*w*0.94*fall(i) + (rng.f()-0.5)*jit;
      const x = p.x+n.nx*e, y = p.y+n.ny*e;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    c.stroke();
  }
}
// dark flecks laid into the paint (Small Crowd, Mirror Mirror, Growth)
function speckle(c,bb,col,n,rng,o){
  o=o||{};
  const amin=o.amin==null?0.10:o.amin, amax=o.amax==null?0.42:o.amax;
  for (let i=0;i<n;i++){
    const x = bb.x+rng.f()*bb.w, y = bb.y+rng.f()*bb.h;
    const s = rng.r(o.smin||0.8, o.smax||2.8);
    c.fillStyle = css(shade(col,(rng.f()-0.5)*0.3), rng.r(amin,amax));
    if (rng.f()<0.18) { c.beginPath(); c.arc(x,y,s*0.7,0,6.283); c.fill(); }
    else c.fillRect(x,y,s,s*rng.r(0.7,1.7));
  }
}
// sgraffito: fine lines raked back through paint that is still wet
function scratch(c,bb,col,n,rng,o){
  o=o||{};
  for (let i=0;i<n;i++){
    const x = bb.x+rng.f()*bb.w, y = bb.y+rng.f()*bb.h;
    const len = rng.r(o.lmin||bb.w*0.12, o.lmax||bb.w*0.5);
    const a  = (o.ang==null?0:o.ang)+rng.r(-0.22,0.22);
    const pts = pathLine(x,y,x+Math.cos(a)*len,y+Math.sin(a)*len,{n:8,wob:rng.r(1,4)},rng);
    c.strokeStyle = css(col, rng.r(o.amin||0.10,o.amax||0.40));
    c.lineWidth = rng.r(0.6,1.9); c.lineCap='round';
    c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
    for (let j=1;j<pts.length;j++) c.lineTo(pts[j].x,pts[j].y);
    c.stroke();
  }
}
// fill a shape the way she fills one: base coat, then short loaded patches
// with real ends and a wide tonal spread. a minority run across the grain.
function paintShape(c,pts,col,rng,o){
  o=o||{};
  const bb = bbox(pts);
  c.save();
  poly(c,pts); c.clip();
  c.fillStyle = css(shade(col,-0.04), o.base==null?1:o.base);
  c.fillRect(bb.x-3,bb.y-3,bb.w+6,bb.h+6);
  const dir0 = o.dir==null?Math.PI/2:o.dir;
  const diag = Math.hypot(bb.w,bb.h);
  const n = o.strokes || clamp(Math.round(bb.w*bb.h/2200),8,120);
  for (let i=0;i<n;i++){
    const cross = rng.f() < (o.cross==null?0.24:o.cross);
    const dir = dir0 + (cross?1.5708:0) + rng.r(-0.34,0.34);
    const dxu = Math.cos(dir), dyu = Math.sin(dir);
    const len = diag*rng.r(0.15, o.long==null?0.58:o.long);
    const mx  = bb.x+rng.f()*bb.w, my = bb.y+rng.f()*bb.h;
    const pl  = pathLine(mx-dxu*len/2,my-dyu*len/2,mx+dxu*len/2,my+dyu*len/2,
                         {n:9,wob:rng.r(1,1+len*0.05)},rng);
    const cc  = o.mixWith ? mix(col,o.mixWith,rng.f()*(o.mixK==null?0.5:o.mixK)) : col;
    bristle(c,pl,rng.r(o.bw||9,(o.bw||9)*2.6),
            shade(cc,(rng.f()-0.5)*2*(o.tone==null?0.2:o.tone)),rng,
            { alpha:rng.r(0.22,0.9), bristles:3, tone:0.1,
              core:rng.f()<0.6, coreA:0.7, jitter:2 });
  }
  if (o.speck) speckle(c,bb,o.speckCol||P.ink,o.speck,rng,{amin:0.06,amax:0.32});
  if (o.crack) scratch(c,bb,o.crackCol||P.ink,o.crack,rng,
                       {ang:o.crackAng==null?1.5708:o.crackAng,amin:0.1,amax:0.34,
                        lmin:bb.h*0.06,lmax:bb.h*0.3});
  if (o.scratch) scratch(c,bb,o.scratchCol||shade(col,0.55),o.scratch,rng,{ang:o.scratchAng||0});
  c.restore();
}
// edge treatment 1: a loaded ink contour of visibly varying width
function inkContour(c,pts,w,col,rng,k,o){
  o=o||{};
  const closed = pts.concat([pts[0]]);
  const cut = Math.max(2,Math.round(closed.length*clamp(k==null?1:k,0,1)));
  const seg = closed.slice(0,cut);
  for (let i=0;i<seg.length-1;i++){
    const a=seg[i], b=seg[i+1];
    c.strokeStyle = css(shade(col,(rng.f()-0.5)*0.22), rng.r(o.amin||0.55,o.amax||0.95));
    c.lineWidth = w*rng.r(0.5,1.8);
    c.lineCap='round';
    c.beginPath();
    c.moveTo(a.x+(rng.f()-0.5)*w*0.5, a.y+(rng.f()-0.5)*w*0.5);
    c.lineTo(b.x+(rng.f()-0.5)*w*0.5, b.y+(rng.f()-0.5)*w*0.5);
    c.stroke();
  }
}
// edge treatment 2: a soft charcoal bloom pushed outward, no line at all.
// clipped to the outside of the shape, so it never muddies what it surrounds.
// broad overlapping dabs at low alpha, thicker in some places than others.
function charcoalHalo(c,pts,spread,col,rng,alpha){
  const a = alpha==null?0.3:alpha;
  const bb = bbox(pts);
  c.save();
  c.beginPath();
  c.rect(0,0,W,H);
  c.moveTo(pts[0].x,pts[0].y);
  for (let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
  c.clip('evenodd');
  // the bloom itself: the shape swollen outward in thin coats, so the
  // darkness falls away smoothly instead of sitting in a ring
  const m = Math.max(bb.w,bb.h)||1;
  for (let pass=6; pass>=1; pass--){
    const g = pass/6;
    const s = 1 + (spread*2.1*g)/m;
    c.save();
    c.translate(bb.cx,bb.cy); c.scale(s,s); c.translate(-bb.cx,-bb.cy);
    poly(c,pts);
    c.fillStyle = css(col, a*0.17*(1.15-g));
    c.fill();
    c.restore();
  }
  // and grain scattered through it, so it reads as charcoal and not as glow
  const n = clamp(Math.round((bb.w+bb.h)/8),30,180);
  for (let i=0;i<n;i++){
    const t = i/n*pts.length;
    const j = Math.floor(t)%pts.length, f = t-Math.floor(t);
    const p = pts[j], q = pts[(j+1)%pts.length];
    const mx = p.x+(q.x-p.x)*f, my = p.y+(q.y-p.y)*f;
    let dx = mx-bb.cx, dy = my-bb.cy;
    const L = Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    const e = rng.r(-spread*0.1, spread*1.05);
    const s = rng.r(spread*0.06, spread*0.3);
    c.fillStyle = css(col, a*rng.r(0.1,0.5)*(1-clamp(e/spread,0,1)*0.8));
    c.beginPath();
    c.ellipse(mx+dx*e, my+dy*e, s, s*rng.r(0.6,1.5), rng.r(0,3.14), 0, 6.283);
    c.fill();
  }
  c.restore();
}
// one continuous charcoal line right round a shape, weight varying as it goes
function contourLine(c,pts,w,col,rng,k,alpha){
  const t = trim(pts.concat([pts[0]]), k==null?1:k);
  if (!t) return;
  bristle(c,t,w,col,rng,{ alpha:alpha==null?0.82:alpha, bristles:2, tone:0.22,
                          taper:false, jitter:w*0.55, coreA:0.88 });
}
// gravity left in the picture (Moonset)
function drip(c,x,y,len,w,col,rng,k){
  const L = len*clamp(k,0,1);
  const pts = pathLine(x,y,x+rng.r(-5,5),y+L,{n:12,wob:1.4},rng);
  bristle(c,pts,w,col,rng,{alpha:0.5,bristles:2,taper:false,jitter:w*0.3,coreA:0.6});
  if (k>0.85){
    c.fillStyle = css(shade(col,-0.1),0.45);
    c.beginPath(); c.arc(pts[pts.length-1].x,pts[pts.length-1].y,w*0.55,0,6.283); c.fill();
  }
}
// paint arriving with a ragged edge, never a hard wipe
function revealClip(c,x0,x1,bot,top,k,rng){
  const y = bot-(bot-top)*smooth(clamp(k,0,1));
  const p = [{x:x0,y:bot+30},{x:x1,y:bot+30}];
  for (let i=0;i<=9;i++){
    const u = 1-i/9;
    p.push({ x:x0+(x1-x0)*u, y:y+rng.r(-22,22) });
  }
  poly(c,p); c.clip();
}

/* ------------------------------ grounds ------------------------------ */
// never a flat fill: broad patches of mixed colour, then scumble both ways
function ground(c,cols,rng,o){
  o = o||{};
  c.fillStyle = css(cols[0]); c.fillRect(0,0,W,H);
  const np = o.patches==null?28:o.patches;
  for (let i=0;i<np;i++){
    const pp = ring(rng.r(-90,W+90),rng.r(-90,H+90),rng.r(130,440),rng.r(100,400),rng,{n:22,wob:0.3});
    const b2 = bbox(pp);
    c.save(); poly(c,pp); c.clip();
    c.fillStyle = css(mix(rng.pick(cols),rng.pick(cols),rng.f()), rng.r(0.12,0.45));
    c.fillRect(b2.x,b2.y,b2.w,b2.h);
    c.restore();
  }
  const dir = o.dir==null?Math.PI/2:o.dir;
  const n = o.strokes||100;
  for (let i=0;i<n;i++){
    const col = mix(rng.pick(cols), rng.pick(cols), rng.f());
    const cross = rng.f() < (o.cross==null?0.3:o.cross);
    const d = dir + (cross?1.5708:0) + rng.r(-(o.spread==null?0.3:o.spread),(o.spread==null?0.3:o.spread));
    const len = rng.r(H*0.22,H*0.95);
    const mx  = rng.r(-60,W+60), my = rng.r(-60,H+60);
    const pl  = pathLine(mx-Math.cos(d)*len/2,my-Math.sin(d)*len/2,
                         mx+Math.cos(d)*len/2,my+Math.sin(d)*len/2,
                         {n:14,wob:rng.r(3,18)},rng);
    bristle(c,pl,rng.r(30,110),col,rng,
            { alpha:rng.r(0.10,0.4), bristles:rng.i(3)+3, tone:0.1, core:false });
  }
  const full = { x:0, y:0, w:W, h:H, cx:W/2, cy:H/2 };
  if (o.speck !== 0) speckle(c,full,o.speckCol||P.ink,o.speck||1800,rng,{amin:0.03,amax:0.14,smin:0.7,smax:2.2});
  if (o.light !== 0) speckle(c,full,shade(cols[0],0.5),o.light||900,rng,{amin:0.04,amax:0.18,smin:0.8,smax:2.6});
  if (o.scratch) scratch(c,full,o.scratchCol||shade(cols[0],0.4),o.scratch,rng,
                         {ang:o.scratchAng||0,amin:0.04,amax:0.16});
}

/* --------------------------- her vocabulary -------------------------- */
// a slab person: tapered column, round head on top, no feet, no hands
function slabPts(x,top,bot,wTop,wBot,rng){
  const p=[];
  const wob = ()=> (rng.f()-0.5)*wTop*0.09;
  const capH = wTop*0.32;
  for (let i=0;i<=10;i++){
    const u=i/10, a=Math.PI*(1-u);
    p.push({ x:x+Math.cos(a)*(wTop/2)+wob(), y:top+capH-Math.sin(a)*capH+wob() });
  }
  for (let i=1;i<=13;i++){
    const u=i/13;
    p.push({ x:x+(wTop/2)+((wBot-wTop)/2)*u+wob(), y:top+capH+(bot-top-capH)*u });
  }
  for (let i=1;i<=4;i++){ const u=i/4; p.push({ x:x+wBot/2-wBot*u, y:bot+wob()*2 }); }
  for (let i=1;i<13;i++){
    const u=1-i/13;
    p.push({ x:x-((wTop/2)+((wBot-wTop)/2)*u)+wob(), y:top+capH+(bot-top-capH)*u });
  }
  return p;
}
function slabFigure(c,o,rng,k){
  k = k==null?1:k;
  if (k<=0) return;
  const w = o.w, r = w*(o.headR==null?0.46:o.headR);
  const headY = o.headY, bot = o.bot;
  // the head sits straight on the shoulders. she never paints a neck
  const bodyTop = headY + r*(o.sit==null?0.74:o.sit);
  const body = slabPts(o.x, bodyTop, bot, w*(o.taper==null?0.9:o.taper), w*(o.flare==null?1.05:o.flare), rng);
  const head = ring(o.x+(o.headDx||0), headY, r, r*rng.r(1.0,1.13), rng, {n:28,wob:0.055});
  const col  = o.col||P.peach;
  const sp   = o.speck==null?Math.round(w*0.5):o.speck;

  c.save();
  revealClip(c, o.x-w*1.5, o.x+w*1.5, bot+8, Math.min(headY-r*1.25,bodyTop), k, rng);
  c.globalAlpha = clamp(k*2.4,0,1);

  if (o.halo) charcoalHalo(c,body,o.halo,P.ink,rng,0.24);
  paintShape(c,body,col,rng,{ dir:Math.PI/2, bw:7, tone:0.17, long:0.5,
                              mixWith:o.mixWith||shade(col,0.26), mixK:0.6,
                              speck:sp, speckCol:P.ink,
                              crack:o.crack||0, crackAng:0.1 });
  if (o.ink!==false) inkContour(c,body,o.inkW||3.1,o.inkCol||P.ink,rng,1,{amin:0.35,amax:0.85});
  paintShape(c,head,mix(col,shade(col,0.14),0.5),rng,{ dir:1.1, bw:6, tone:0.14, long:0.55,
                              speck:Math.round(sp*0.45), speckCol:P.ink });
  if (o.ink!==false) inkContour(c,head,o.inkW||3.1,o.inkCol||P.ink,rng,1,{amin:0.35,amax:0.85});
  if (o.face) face(c,{ x:o.x+(o.headDx||0), y:headY, r:r },rng,o.face);
  c.restore();
}
// three marks and no more: dot eyes, a line mouth, a blushed cheek
function face(c,o,rng,k){
  k = clamp(k,0,1);
  const r = o.r;
  if (k>0.05){
    const a = clamp((k-0.05)/0.3,0,1);
    for (const s of [-1,1]){
      c.fillStyle = css(P.magenta, 0.32*a);
      c.beginPath(); c.ellipse(o.x+s*r*0.52, o.y+r*0.18, r*0.27, r*0.19, 0, 0, 6.283); c.fill();
      c.fillStyle = css(P.magenta, 0.17*a);
      c.beginPath(); c.ellipse(o.x+s*r*0.52, o.y+r*0.18, r*0.37, r*0.27, 0, 0, 6.283); c.fill();
    }
  }
  if (k>0.28){
    const a = clamp((k-0.28)/0.3,0,1);
    for (const s of [-1,1]){
      c.fillStyle = css(P.ink, 0.88*a);
      c.beginPath();
      c.ellipse(o.x+s*r*0.27+rng.r(-1.5,1.5), o.y-r*0.13,
                r*0.075*rng.r(0.85,1.2), r*0.092, rng.r(-0.3,0.3), 0, 6.283);
      c.fill();
    }
  }
  if (k>0.58){
    const a = clamp((k-0.58)/0.3,0,1);
    const mp = pathLine(o.x-r*0.23, o.y+r*0.43, o.x+r*0.23, o.y+r*0.43, {n:9,bow:r*0.14,wob:1.2}, rng);
    bristle(c,mp,3.0,P.ink,rng,{alpha:0.85*a,bristles:2,coreA:0.9});
  }
}
// tulips: petals splaying from where the stem ends. small spread = an upright
// bud, wide spread = an open head hanging over. both get an ink contour.
function tulipHead(c,o,rng,k){
  k = clamp(k==null?1:k,0,1);
  if (k<=0.02) return;
  const g = eout(k);
  const r = o.r*(0.5+0.5*g);
  const open = (o.open==null?0.3:o.open);
  const np = o.petals||3;
  const axis = o.rot||0;
  const col = o.col||P.orange;
  const set = [];
  for (let i=0;i<np;i++){
    const spread = np>1 ? (i-(np-1)/2)/(np-1) : 0;
    const a   = axis + spread*(0.40+open*1.45);
    // narrow, pointed, and longest down the middle: a tulip, not a daisy
    const len = r*(1.14-Math.abs(spread)*0.34)*rng.r(0.93,1.07);
    const wid = r*(0.20+open*0.10)*rng.r(0.88,1.12);
    const mx = o.cx+Math.cos(a)*len*0.46, my = o.cy+Math.sin(a)*len*0.46;
    set.push({ pts:almondPts(mx,my,len,wid,a,rng,0.88), a });
  }
  for (const q of set){
    paintShape(c,q.pts,col,rng,{ dir:q.a, bw:6, tone:0.22, long:0.7, cross:0.14,
                                 mixWith:o.mixWith||P.vermilion, mixK:0.7,
                                 speck:7, speckCol:P.deepred });
    // the darker throat, at the end nearest the stem
    c.save(); poly(c,q.pts); c.clip();
    const th = almondPts(o.cx+Math.cos(q.a)*r*0.16, o.cy+Math.sin(q.a)*r*0.16,
                         r*0.56, r*0.13, q.a, rng, 0.9);
    paintShape(c,th,shade(col,-0.42),rng,{ dir:q.a, bw:5, base:0.5, strokes:7 });
    c.restore();
  }
  for (const q of set) contourLine(c,q.pts,o.inkW||3.2,P.ink,rng,1,0.85);
  if (o.filament){
    for (let i=0;i<5;i++){
      const a = axis+rng.r(-0.5,0.5);
      const pl = pathLine(o.cx,o.cy,o.cx+Math.cos(a)*r*rng.r(0.5,1.0),
                                    o.cy+Math.sin(a)*r*rng.r(0.5,1.0),{n:8,wob:3},rng);
      bristle(c,pl,1.8,P.gold,rng,{alpha:rng.r(0.3,0.7),bristles:1,coreA:0.9});
    }
  }
}
function stem(c,o,rng,k){
  const pts = pathLine(o.x0,o.y0,o.x1,o.y1,{n:22,bow:o.bow||0,wob:o.wob==null?5:o.wob},rng);
  const t = trim(pts,k);
  if (!t) return;
  bristle(c,t,o.w||11,o.col||P.leaf,rng,{alpha:0.92,bristles:4,tone:0.2,taper:false,coreA:0.95});
  inkContour(c,t,2.0,P.ink,rng,1,{amin:0.2,amax:0.55});
  if (o.leaf && k>0.5){
    const lk = clamp((k-0.5)/0.5,0,1);
    const i = Math.floor(t.length*0.55), p = t[i]||t[0];
    const dir = o.leafDir==null?-0.7:o.leafDir;
    const len = 190*lk, wid = 30*lk;
    const lp = almondPts(p.x+Math.cos(dir)*len*0.45, p.y+Math.sin(dir)*len*0.45,
                         len, wid, dir, rng, 0.6);
    paintShape(c,lp,mix(P.leaf,P.sage,0.45),rng,{dir:dir,bw:5,strokes:12,long:0.8});
    contourLine(c,lp,2.4,P.ink,rng,1,0.5);
  }
}
// the broad five-petal flower with a white star centre (Flora — In the Pink)
function petalFlower(c,o,rng,k){
  k = clamp(k,0,1);
  if (k<=0.02) return;
  const n = o.n||5, Rr = o.r;
  // a big flower can be laid petal by petal, each one a mark of its own, so
  // the paint dries as it goes instead of being redrawn whole every frame
  const one = o.only==null ? -1 : o.only;
  const petals = [];
  if (!o.coreOnly) for (let i=(one<0?0:one); i<=(one<0?n-1:one); i++){
    const a  = (i/n)*6.283 + (o.rot||0);
    const kk = one<0 ? clamp((k-i*0.055)/0.55,0,1) : k;
    if (kk<=0.02) continue;
    const g  = eout(kk);
    const len = Rr*g*rng.r(0.95,1.1), wid = Rr*0.56*g*rng.r(0.9,1.12);
    const cx = o.cx+Math.cos(a)*len*0.54, cy = o.cy+Math.sin(a)*len*0.54;
    const pp = almondPts(cx,cy,len*1.02,wid,a,rng,0.42);
    petals.push({pp,a,g});
  }
  // the big ones get the smudged bloom; daisies are too small to want one
  if (!o.small) for (const q of petals) charcoalHalo(c,q.pp,34,P.ink,rng,0.42);
  for (const q of petals){
    paintShape(c,q.pp,o.col||P.pink,rng,{ dir:q.a, bw:7, tone:0.15, long:0.8, cross:0.1,
                                          mixWith:shade(o.col||P.pink,0.42), mixK:0.75,
                                          strokes:o.small?10:30 });
    c.save(); poly(c,q.pp); c.clip();
    for (let j=0;j<(o.small?4:11);j++){
      const sp = rng.r(-0.3,0.3);
      const L  = Rr*rng.r(0.3,0.8)*q.g;
      const pl = pathLine(o.cx,o.cy,o.cx+Math.cos(q.a+sp)*L,o.cy+Math.sin(q.a+sp)*L,{n:10,wob:3},rng);
      bristle(c,pl,rng.r(7,20),o.hot||P.magenta,rng,
              {alpha:rng.r(0.3,0.7),bristles:3,tone:0.18,core:false});
    }
    c.restore();
  }
  // the pale radiating centre, put in once the petals are there
  const a = o.coreOnly ? k : (one<0 ? clamp((k-0.5)/0.4,0,1) : 0);
  if (a>0.02){
    for (let j=0;j<(o.small?4:9);j++){
      const ang = rng.r(0,6.283), L = Rr*rng.r(0.06,0.3);
      const pl = pathLine(o.cx,o.cy,o.cx+Math.cos(ang)*L,o.cy+Math.sin(ang)*L,{n:6,wob:2},rng);
      bristle(c,pl,rng.r(4,13),shade(P.cream,0.58),rng,{alpha:0.85*a,bristles:2});
    }
  }
}
// bottles and pots as overlapping contours — you see through one into the next
const PROFILES = {
  bottle: [[0,0.90],[0.10,1.0],[0.40,0.96],[0.54,0.52],[0.66,0.26],[0.92,0.24],[1,0.30]],
  pot:    [[0,0.60],[0.20,0.93],[0.52,1.0],[0.80,0.85],[1,0.70]],
  vase:   [[0,0.40],[0.18,0.86],[0.44,1.0],[0.66,0.90],[0.86,0.46],[1,0.54]],
  bowl:   [[0,0.34],[0.42,0.70],[0.78,0.94],[1,1.0]],
  tumbler:[[0,0.86],[0.5,0.92],[1,0.99]]
};
function vesselPts(o,rng){
  const list = PROFILES[o.shape||'bottle'];
  const n = 40, left = [], right = [];
  for (let i=0;i<=n;i++){
    const u = i/n;
    const r = o.w*profAt(list,u)*0.5*(1+0.012*Math.sin(u*13+o.cx*0.01));
    const y = o.baseY - o.h*u;
    left.push({ x:o.cx-r+rng.r(-2,2), y:y+rng.r(-1.5,1.5) });
    right.push({ x:o.cx+r+rng.r(-2,2), y:y+rng.r(-1.5,1.5) });
  }
  return left.concat(right.reverse());
}
function vessel(c,o,rng,k){
  const pts = o.pts || vesselPts(o,rng);
  if (o.wash){
    c.save(); poly(c,pts); c.clip();
    c.globalAlpha = clamp(k*1.6,0,1);
    paintShape(c,pts,o.col||P.warmgrey,rng,{ dir:Math.PI/2, bw:11, base:o.washA==null?0.62:o.washA,
                                             strokes:30, tone:0.14, long:0.75, cross:0.16 });
    // one pale highlight down the shoulder, as glass gets
    const bb = bbox(pts);
    const hl = pathLine(bb.x+bb.w*0.3,bb.y+bb.h*0.12,bb.x+bb.w*0.24,bb.y+bb.h*0.88,{n:14,wob:6},rng);
    bristle(c,hl,bb.w*0.11,shade(P.cream,0.5),rng,{alpha:0.3,bristles:3,core:false});
    c.restore();
  }
  c.globalAlpha = clamp(k*1.4,0,1);
  contourLine(c,pts,o.inkW||4.2,o.inkCol||'#33302E',rng,k,0.85);
  c.globalAlpha = 1;
  return pts;
}
// the disc: sun, moon, fruit, a tree's head, or a head behind bars
function disc(c,o,rng,k){
  k = clamp(k,0,1);
  if (k<=0.02) return null;
  const r = o.r*(0.84+0.16*eout(k));
  const pts = ring(o.cx,o.cy,r,r*rng.r(0.97,1.03),rng,{n:o.n||44,wob:o.wob==null?0.025:o.wob});
  c.save();
  c.globalAlpha = clamp(k*1.9,0,1);
  if (o.halo) charcoalHalo(c,pts,o.halo,o.haloCol||P.ink,rng,0.34);
  paintShape(c,pts,o.col,rng,{ dir:o.dir==null?0.5:o.dir, bw:o.bw||9, tone:0.19, long:0.55,
                               mixWith:o.mixWith, mixK:o.mixK==null?0.7:o.mixK,
                               speck:o.speck||0, speckCol:P.ink,
                               scratch:o.scratch||0, scratchCol:o.scratchCol, scratchAng:o.scratchAng });
  if (o.ink) inkContour(c,pts,o.inkW||3.4,P.ink,rng,1,{amin:0.4,amax:0.88});
  c.restore();
  return pts;
}

/* ============================== SCENES ============================== */
/* Each scene is a list of marks in painting order. A mark is
   { at, grow, seed, f(ctx,k,rng) } with at/grow in seconds of scene time.
   Completed marks are baked into the scene's buffer, so paint accumulates
   the way paint does and the per-frame cost stays small. */

function builder(base){
  const marks = []; let n = 0;
  return {
    marks,
    add(at,grow,f){ marks.push({ at, grow, seed:(base*7919 + (++n)*104729)>>>0, f }); }
  };
}

        const pl = pathLine(x0,1124,x1,288,{n:22,bow:rng.r(-56,26),wob:rng.r(3,10)},rng);
        const t  = trim(pl,clamp(k*1.35-u*0.18,0,1)); if(!t) continue;
        // narrow toward the top by tapering the mark itself
        bristle(c,t,rng.r(14,52),mix('#C7AA8F',P.gold,rng.f()*0.5),rng,
                {alpha:rng.r(0.14,0.45),bristles:3,core:false});
      }
    });
    // weather comes through from the right: rain combed down over the field,
    // full height so nothing dangles, each one a mark and not a smear
    for (let g=0; g<2; g++){
      b.add(2.70+g*0.95, 1.05, (c,k,rng)=>{
        const n = 12;
        const shown = k*n*1.12;
        for (let i=0;i<n;i++){
          const a = clamp(shown-i,0,1);
          if (a<=0) continue;
          // it comes in off the right and stops short: the walker is still
          // in the light when it reaches him
          const x = W+80 - (g*0.26 + (i/n)*0.26)*(W+120) + rng.r(-30,30);
          const pl = pathLine(x,-80,x+rng.r(-60,60),H+80,{n:22,wob:rng.r(5,22)},rng);
          const col = rng.f()<0.34 ? mix(P.gold,'#F58B0C',rng.f())
                                   : mix(rng.pick(['#3F4A2C',P.leaf,P.night]),'#6B6F5A',rng.f()*0.5);
          bristle(c,trim(pl,a),rng.r(6,19),col,rng,
                  {alpha:rng.r(0.22,0.46)*a,bristles:3,tone:0.2,taper:false,coreA:0.5});
        }
      });
    }
    // one small figure, walking the path. the only thing in the film that moves
    b.add(1.90,4.55,(c,k,rng)=>{
      const u = smooth(clamp(k,0,1));
      const y = 1030 - u*716;
      const s = 1 - u*0.62;
      slabFigure(c,{ x:512+u*2, headY:y-150*s, bot:y, w:66*s, col:'#3A3730',
                     headR:0.46, taper:0.8, ink:s>0.7, inkW:2.4*s, speck:6 },rng,1);
    });
    return b.marks;
  }
});

/* --- 8. COMPANIONS --------------------------------------------- 5.5s */
SCENES.push({
  name:'companions', dur:5.5,
  ground: c => ground(c,['#C5B4A2','#C19A75','#D7D6D0','#998F82'],R(808),
                      { dir:Math.PI/2, spread:0.7, cross:0.36, strokes:104, patches:34,
                        speck:1500, light:1300 }),
  build(){
    const b = builder(8);
    const cx = 566, wide = 318, CROWN = 240, FOOT = 1120;
    // the head is a broad dome cropped by the bottom edge: a round cap, then
    // sides falling almost straight off the frame
    const CAPY = 652;
    function domePts(rng, grow){
      const g = grow||0, w = wide+g, ry = (CAPY-CROWN)+g;
      const pts = [], N = 36;
      for (let i=0;i<=N;i++){       // the cap, left shoulder over the crown
        const th = Math.PI-(i/N)*Math.PI, j = Math.sin(i/N*Math.PI);
        pts.push({ x:cx+Math.cos(th)*w+rng.r(-7,7)*(1-j*0.6),
                   y:CAPY-Math.sin(th)*ry+rng.r(-6,6)*(1-j*0.5) });
      }
      for (let i=1;i<=9;i++){       // down the right side
        const u=i/9;
        pts.push({ x:cx+w*(1-0.06*u)+rng.r(-8,8), y:CAPY+(FOOT-CAPY)*u+rng.r(-6,6) });
      }
      for (let i=9;i>=1;i--){       // and back up the left
        const u=i/9;
        pts.push({ x:cx-w*(1-0.06*u)+rng.r(-8,8), y:CAPY+(FOOT-CAPY)*u+rng.r(-6,6) });
      }
      return pts;
    }
    // one shape, reused, so rim and mass and fur-clip all register
    const DOME = domePts(R(8080),0);
    // the warm rim she puts behind an animal's head — brushed on in dabs that
    // follow the silhouette, thick in places and gone in others
    b.add(0.10,0.55,(c,k,rng)=>{
      // one continuous band, pushed a little off the silhouette, drawn in
      // overlapping runs so it never breaks into stitches
      const out = DOME.map(p=>{
        let dx = p.x-cx, dy = p.y-708;
        const L = Math.hypot(dx,dy)||1;
        const o = rng.r(3,13);
        return { x:p.x+dx/L*o, y:p.y+dy/L*o };
      });
      const RUN = 7, STEP = 4, runs = Math.ceil(46/STEP);
      for (let r=0;r<runs;r++){
        const a = clamp(k*runs*1.3-r,0,1);
        if (a<=0) continue;
        const seg = out.slice(r*STEP, r*STEP+RUN);
        if (seg.length<2) continue;
        // strongest round the crown, gone by the time it reaches the base
        const depth = clamp((seg[0].y-CAPY)/(FOOT-CAPY),0,1);
        const fade = 1-Math.pow(depth,0.7);
        if (fade<=0.04) continue;
        bristle(c,seg,rng.r(11,22),mix('#D2540F',P.vermilion,rng.f()),rng,
                {alpha:rng.r(0.55,0.95)*a*fade,bristles:3,tone:0.28,coreA:0.7,jitter:5});
      }
    });
    // the head mass, laid in flat before any fur
    b.add(0.42,0.80,(c,k,rng)=>{
      c.save(); revealClip(c,cx-wide*1.5,cx+wide*1.5,FOOT,CROWN-30,k,rng);
      paintShape(c,DOME,mix(P.cream,P.warmgrey,0.42),rng,{dir:Math.PI/2,bw:12,tone:0.1,
                 long:0.55,strokes:42});
      c.restore();
    });
    // the slate patches at the sides, under the coat, soft-edged — fur will
    // be combed straight through them
    [-1,1].forEach((s,i)=>{
      b.add(0.92+i*0.18,0.50,(c,k,rng)=>{
        c.save(); poly(c,DOME); c.clip();
        const pp = ring(cx+s*258, 690, 104, 250, rng, {n:26,wob:0.16,rot:s*0.2});
        c.globalAlpha = clamp(k*1.3,0,1)*0.62;
        paintShape(c,pp,mix(P.denim,'#2E4A58',0.6),rng,{dir:Math.PI/2+s*0.2,bw:9,
                   tone:0.24,long:0.6,base:0.6,strokes:26});
        c.restore();
      });
    });
    // fur: long locks combed down off the crown, thick knife-work, three
    // passes with the paint drying between them
    for (let pass=0; pass<3; pass++){
      b.add(1.24+pass*0.58, 0.62, (c,k,rng)=>{
        c.save(); poly(c,DOME); c.clip();
        const n = 46;
        for (let i=0;i<n;i++){
          const a = clamp(k*n*1.2-i,0,1);
          if (a<=0) continue;
          // locks cluster the way a comb leaves them, a few together
          const cluster = Math.floor(i/4);
          const hx = (((cluster*0.618)%1)*2-1)*0.94 + rng.r(-0.12,0.12);
          const x0 = cx+hx*wide, y0 = CROWN+rng.r(20,520)+Math.abs(hx)*190;
          const ang = hx*0.62 + rng.r(-0.18,0.18);
          const len = rng.r(110,620);
          const pl = pathLine(x0,y0,x0+Math.sin(ang)*len*0.42,y0+Math.cos(ang)*len,
                              {n:12,wob:rng.r(1,7),bow:rng.r(-26,26)},rng);
          // the coat is cream and warm white; the blue-grey only comes in at
          // the sides, where the head turns away from the light
          const u = rng.f(), edge = Math.abs(hx)>0.52;
          bristle(c,trim(pl,a),rng.r(9,36),
                  (edge && u<0.34) ? mix(P.denim,P.slate,rng.r(0.35,0.7))
                : u<0.14 ? mix(P.warmgrey,'#8E8478',rng.f()*0.8)
                : u<0.30 ? mix(P.pale,P.peach,rng.f()*0.5)
                : u<0.58 ? shade(P.cream,0.4)
                :          mix(P.cream,P.pale,rng.f()*0.45), rng,
                  {alpha:rng.r(0.4,0.95)*a,bristles:3,tone:0.13,coreA:0.86,jitter:5});
        }
        c.restore();
      });
    }
    // the nose: a soft black weight, off centre, no drawn edge —
    // and the dark of the muzzle under it. no eyes, they are under the coat
    b.add(2.54,0.55,(c,k,rng)=>{
      const a = clamp(k*1.7,0,1);
      c.save(); poly(c,DOME); c.clip();
      c.globalAlpha = a;
      const np = ring(cx-18,600,88,68,rng,{n:26,wob:0.1});
      paintShape(c,np,P.ink,rng,{dir:0.7,bw:7,tone:0.16,strokes:16});
      for (let i=0;i<26;i++){       // feather the edge into the fur
        const t = i/26*6.283;
        c.fillStyle = css(P.ink,rng.r(0.12,0.5));
        c.beginPath();
        c.ellipse(cx-18+Math.cos(t)*88*rng.r(0.9,1.1), 600+Math.sin(t)*68*rng.r(0.9,1.12),
                  rng.r(5,15), rng.r(5,13), rng.r(0,3.14), 0, 6.283);
        c.fill();
      }
      if (k>0.42){                  // the shadow under the muzzle, brushed in,
        const kk = clamp((k-0.42)/0.58,0,1);   // never drawn as an edge
        c.globalAlpha = a*kk;
        for (let i=0;i<16;i++){
          const x0 = cx+rng.r(-86,78), y0 = 668+rng.r(0,44);
          const pl = pathLine(x0,y0,x0+rng.r(-26,26),y0+rng.r(80,210),{n:10,wob:4},rng);
          bristle(c,pl,rng.r(14,40),mix(P.slate,P.ink,rng.r(0.25,0.6)),rng,
                  {alpha:rng.r(0.07,0.2),bristles:3,core:false,jitter:6});
        }
        const pl = pathLine(cx-20,676,cx-28,838,{n:14,wob:3},rng);
        bristle(c,trim(pl,kk),17,mix(P.slate,P.ink,0.55),rng,
                {alpha:0.4,bristles:3,core:false});
      }
      c.restore();
    });
    // and Willum, who is a cat, asleep in the corner while all this goes on
    const CATX = 138, CATY = 946;
    b.add(3.10,0.70,(c,k,rng)=>{
      const kk = clamp(k*1.25,0,1);
      const bp = ring(CATX,CATY,132,94,rng,{n:32,wob:0.09,rot:-0.12});
      c.save();
      revealClip(c,-30,320,1090,824,kk,rng);
      paintShape(c,bp,mix(P.slate,P.wood,0.45),rng,{dir:0.1,bw:7,tone:0.26,long:0.6,
                 mixWith:'#8A8B82',mixK:0.5,strokes:38});
      for (let i=0;i<46;i++){       // fur, lying the length of him
        const ang=rng.r(-0.4,0.4);
        const x0=rng.r(10,270), y0=rng.r(872,1032);
        const pl=pathLine(x0,y0,x0+rng.r(-74,74),y0+Math.cos(ang)*rng.r(18,54),{n:8,wob:2},rng);
        bristle(c,pl,rng.r(4,11),mix('#9A9B90',P.slate,rng.f()),rng,
                {alpha:rng.r(0.22,0.6),bristles:2,coreA:0.7});
      }
      for (const s of [-1,1]){      // ears
        const ep=[{x:CATX+s*76,y:882},{x:CATX+s*100,y:830},{x:CATX+s*112,y:892}];
        paintShape(c,ep,mix(P.wood,P.ink,0.4),rng,{dir:1,bw:5,strokes:6});
      }
      if (kk>0.55){                 // shut eyes, one line each
        const a=clamp((kk-0.55)/0.45,0,1);
        for (const s of [-1,1]){
          const ep=pathLine(CATX+s*46-17,920,CATX+s*46+17,922,{n:6,bow:5,wob:0.8},rng);
          bristle(c,ep,2.8,P.ink,rng,{alpha:0.85*a,bristles:2,coreA:0.9});
        }
      }
      c.restore();
    });
    // daisies along the bottom beside him, not on him
    const rngD = R(8181);
    for (let g=0; g<2; g++){
      const set = [];
      for (let i=0;i<8;i++){
        set.push({ x:rngD.r(196,430), y:rngD.r(952,1062),
                   r:rngD.r(17,36), rot:rngD.r(0,6.28) });
      }
      // one mark per daisy, so each is dry before the next goes in
      set.forEach((d,i)=>{
        if (d.y>1072) return;
        b.add(3.40+g*0.5+i*0.055, 0.30, (c,k,rng)=>{
          petalFlower(c,{ cx:d.x, cy:d.y, r:d.r, n:6, rot:d.rot,
                          col:shade(P.cream,0.45), hot:P.gold, small:true },rng,k);
        });
      });
    }
    b.add(4.45,0.55,(c,k,rng)=>{
      for (let i=0;i<8;i++){
        const a = clamp(k*9-i,0,1);
        if (a<=0) continue;
        const x = rng.r(16,252);
        const pl = pathLine(x,1078,x+rng.r(-24,24),rng.r(792,896),{n:14,wob:4},rng);
        const t = trim(pl,a); if(!t) continue;
        bristle(c,t,9,'#2889A5',rng,{alpha:0.75,bristles:3,tone:0.2,coreA:0.9});

  }
});

                     ink:true, inkW:2.9, speck:22, halo:12 },rng,clamp(k,0,1));
    });
    b.add(1.45,0.55,(c,k,rng)=>{
      c.globalAlpha=k*0.62;
      const sh = ring(472,894,170,19,rng,{n:26,wob:0.22});
      charcoalHalo(c,sh,26,P.ink,rng,0.5);
      paintShape(c,sh,P.ink,rng,{dir:0,bw:6,base:0.1,strokes:9});
      c.globalAlpha=1;
    });
    // the quiet mark, written into the ground with the brush she had in her
    // hand — drawn, not typeset, so it belongs to the paint
    b.add(1.00,0.55,(c,k,rng)=>{
      const a = clamp(k*1.2,0,1);
      // strokes in an em box: y=1 is the baseline
      const G = {
        o:[ [[0.30,0.44],[0.12,0.52],[0.06,0.72],[0.15,0.95],[0.33,1.00],[0.46,0.86],
             [0.44,0.60],[0.30,0.44]] ],
        p:[ [[0.06,0.46],[0.05,0.80],[0.06,1.10],[0.08,1.38]],
            [[0.06,0.52],[0.26,0.48],[0.42,0.62],[0.40,0.84],[0.22,0.97],[0.06,0.94]] ],
        u:[ [[0.05,0.46],[0.05,0.76],[0.12,0.95],[0.28,1.00],[0.40,0.90]],
            [[0.41,0.45],[0.41,0.74],[0.42,1.00]] ],
        s:[ [[0.40,0.54],[0.20,0.46],[0.07,0.56],[0.16,0.70],[0.36,0.78],[0.42,0.90],
             [0.28,1.00],[0.07,0.95]] ],
        five:[ [[0.42,0.28],[0.20,0.27],[0.10,0.29]],
            [[0.10,0.29],[0.09,0.44],[0.10,0.58]],
            [[0.10,0.58],[0.30,0.55],[0.45,0.70],[0.41,0.90],[0.20,1.01],[0.05,0.92]] ]
      };
      const word = [['o',0.54],['p',0.50],['u',0.50],['s',0.48],[null,0.30],['five',0.52]];
      const EM = 46;
      c.save();
      c.translate(884,986); c.rotate(-0.03);
      let pen = 0, si = 0;
      const total = 8;
      for (const [g,adv] of word){
        if (g) for (const st of G[g]){
          const sa = clamp(a*total*1.3-si,0,1); si++;
          if (sa<=0) { pen += 0; continue; }
          const pl = [];
          for (let i=0;i<st.length-1;i++){          // subdivide, for the brush
            for (let j=0;j<4;j++){
              const f = j/4;
              pl.push({ x:(pen+st[i][0]+(st[i+1][0]-st[i][0])*f)*EM,
                        y:(st[i][1]+(st[i+1][1]-st[i][1])*f)*EM-EM });
            }
          }
          pl.push({ x:(pen+st[st.length-1][0])*EM, y:st[st.length-1][1]*EM-EM });
          const t = trim(pl,sa); if (!t) continue;
          bristle(c,t,3.4,'#5A5550',rng,{alpha:0.34,bristles:2,tone:0.3,coreA:0.55,jitter:1.6});
        }
        pen += adv;
      }
      c.restore();
    });
    return b.marks;
  }
});

/* ============================ the machine =========================== */
const DUR = SCENES.map(s=>s.dur);
const START = [0];
for (let i=0;i<DUR.length;i++) START.push(START[i]+DUR[i]);
const TOTAL = START[START.length-1];        // 60.000
const TR = 1.10;                            // the paint-over transition

function newCanvas(){
  const el = document.createElement('canvas');
  el.width = W; el.height = H;
  return el;
}
function Layer(i){
  this.i = i;
  this.buf = newCanvas();
  this.bctx = this.buf.getContext('2d');
  this.marks = SCENES[i].build();
  this.reset();
}
Layer.prototype.reset = function(){
  this.bctx.setTransform(1,0,0,1,0,0);
  this.bctx.globalAlpha = 1;
  this.bctx.clearRect(0,0,W,H);
  SCENES[this.i].ground(this.bctx);
  this.baked = 0;
  this.p = 0;
};
// paint straight onto the target: the dried paint as one blit, then whatever
// is still wet on top of it. no intermediate canvas, so a frame costs one
// full-size copy instead of three
Layer.prototype.paint = function(dst, p){
  if (p < this.p - 0.05) this.reset();
  this.p = p;
  // bake the leading run of finished marks — paint that has dried
  while (this.baked < this.marks.length){
    const m = this.marks[this.baked];
    if (p >= m.at + m.grow + 1e-4){
      this.bctx.setTransform(1,0,0,1,0,0); this.bctx.globalAlpha = 1;
      m.f(this.bctx, 1, R(m.seed));
      this.baked++;
    } else break;
  }
  dst.setTransform(1,0,0,1,0,0); dst.globalAlpha = 1;
  dst.drawImage(this.buf,0,0);
  for (let i=this.baked;i<this.marks.length;i++){
    const m = this.marks[i];
    if (p <= m.at) continue;
    const k = m.grow>1e-6 ? Math.min(1,(p-m.at)/m.grow) : 1;
    dst.setTransform(1,0,0,1,0,0); dst.globalAlpha = 1;
    m.f(dst, k, R(m.seed));
  }
};

const layers = new Map();
function layer(i){
  let L = layers.get(i);
  if (!L){ L = new Layer(i); layers.set(i,L); }
  return L;
}

// the new ground is brushed over the old one. she paints over, she never cuts.
// the brush bands are the clip, so the incoming scene arrives band by band
// with a ragged bristled edge and no crossfade anywhere.
const TRN = 22, TRK = 1.35;          // bands in a wipe, and how fast they land

// `from` is the first band that still needs paint. bands are only ever added,
// so once one has gone on at full width it is already on the canvas and there
// is nothing to gain by laying it again. the randomness is still drawn for the
// skipped bands, so every band keeps the geometry it started with.
function paintOver(dst, L, q, seed, from){
  // the last of it: by here the bands cover everything anyway, and handing
  // over cleanly is what makes the loop seamless
  if (q > 0.96){ L.paint(dst, 0); return; }
  const rng  = R(4000+seed*977);
  const dir  = [Math.PI/2, 0.12, 1.9, 0.5, Math.PI/2, 1.1][seed % 6];
  const span = Math.abs(Math.cos(dir))*W + Math.abs(Math.sin(dir))*H;
  const step = span/TRN;
  const dxu = Math.cos(dir+Math.PI/2), dyu = Math.sin(dir+Math.PI/2);
  const path = new Path2D();
  let any = false;
  for (let i=0;i<TRN;i++){
    const a = clamp(q*TRN*TRK - i, 0, 1);
    if (a<=0) continue;
    const e = (i+0.5)*step - span/2 + rng.r(-step*0.3,step*0.3);
    const cxp = W/2 + Math.cos(dir)*e, cyp = H/2 + Math.sin(dir)*e;
    const len = span*1.7;
    const pl = pathLine(cxp-dxu*len/2, cyp-dyu*len/2, cxp+dxu*len/2, cyp+dyu*len/2,
                        {n:20,wob:rng.r(8,30)},rng);
    const nm = norms(pl);
    const hw = step*rng.r(0.72,1.05)*a;
    const last = pl.length-1;
    const halfAt = j => hw*(0.72+0.28*Math.sin(Math.PI*j/last)) + rng.r(-step*0.16,step*0.16);
    const want = i >= from;
    if (want) any = true;
    for (let j=0;j<=last;j++){
      const h = halfAt(j);
      if (!want) continue;
      const x = pl[j].x+nm[j].nx*h, y = pl[j].y+nm[j].ny*h;
      j ? path.lineTo(x,y) : path.moveTo(x,y);
    }
    for (let j=last;j>=0;j--){
      const h = halfAt(j);
      if (!want) continue;
      path.lineTo(pl[j].x-nm[j].nx*h, pl[j].y-nm[j].ny*h);
    }
    if (want) path.closePath();
  }
  if (!any) return;
  dst.save(); dst.clip(path); L.paint(dst, 0); dst.restore();
}

let warmedFor = -1;
let shown = { i:-1, baked:-1, over:-1, q:0 };   // what the canvas already holds

/* t in seconds from the start of the film. 60.000s, wrapping. */
function draw(t){
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  let i = 0;
  while (i < DUR.length-1 && t >= START[i+1]) i++;
  const local = t - START[i];
  const dur = DUR[i];
  const L = layer(i);

  // lay the next scene's ground well before it is needed, so nothing stutters
  if (warmedFor !== i){
    warmedFor = i;
    const j = (i+1) % SCENES.length;
    const N = layer(j);
    if (N.p > 0.001) N.reset();
  }

  const over = local > dur - TR;
  // is any paint still wet?
  let wet = false;
  for (let m=L.baked; m<L.marks.length; m++){
    if (local > L.marks[m].at){ wet = true; break; }
  }
  // a painting only changes when something is put on it. if nothing is wet,
  // nothing is being brushed over, and the dried paint is the same as it was
  // last frame, then the canvas already holds this frame — leave it alone.
  if (!over && !wet && shown.i === i && shown.baked === L.baked) return;

  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  if (over){
    const q = clamp((local - (dur-TR))/TR, 0, 1);
    const N = layer((i+1) % SCENES.length);
    // if nothing is wet underneath, the canvas already holds this painting
    // and every band that has finished going over it: carry on from there
    if (!wet && shown.over === i && q >= shown.q){
      paintOver(ctx, N, q, i, Math.max(0, Math.floor(shown.q*TRN*TRK - 1)));
    } else {
      L.paint(ctx, local);
      paintOver(ctx, N, q, i, 0);
    }
    shown.over = i; shown.q = q; shown.i = -1;
  } else {
    L.paint(ctx, local);
    shown.i = i; shown.over = -1;
  }
  shown.baked = L.baked;
}
window.draw = draw;

/* auto-start, no chrome, no controls */
let t0 = null;
function frame(now){
  if (t0 === null) t0 = now;
  draw((now - t0)/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
