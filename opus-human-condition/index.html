<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a life in colour</title>
<style>
  html, body { margin:0; height:100%; background:#100e0c; overflow:hidden; }
  body { display:grid; place-items:center; }
  canvas { width:min(100vw,100vh); height:min(100vw,100vh); display:block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
/* ---------------------------------------------------------------------------
   a life in colour  —  60.000s, the human condition in Gill Brophy's language
   Every frame is drawn by hand in JavaScript. No images, no fonts, no filters.
   See STYLE.md for the sampled palette and the eight rules this obeys.
--------------------------------------------------------------------------- */

const W = 1080, H = 1080;
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

/* --- palette: twelve sampled colours, two structural darks, few accents --- */
const P = {
  cream:'#F9EFD4', warmgrey:'#E2D8DB', peach:'#F4BB8E', vermilion:'#EF4404',
  orange:'#E45728', gold:'#F4B819',    pink:'#DFA3B9',  magenta:'#C8688E',
  turquoise:'#11AFCB', denim:'#4B96BA', night:'#0A517C', leaf:'#38633D',
  ink:'#1D1818', ochre:'#6D4513',
  // accents, all sampled: Moonset sun, Jacob's Pots teal, Small Crowd pale,
  // Fields of Gold earth, woodland dark, Path to the River sage
  sun:'#F1895C', teal:'#17826B', pale:'#FACFAE', earth:'#8F704E',
  wood:'#2C2D32', sage:'#6F967F', deepred:'#B42408', slate:'#565D56'
};

/* ------------------------------ maths -------------------------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function R(seed){
  const f = mulberry32(seed>>>0 || 1);
  return { f, r:(a,b)=>a+(b-a)*f(), i:n=>Math.floor(f()*n),
           pick:a=>a[Math.floor(f()*a.length)], s:()=>f()<0.5?-1:1 };
}
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const smooth = t => (t=clamp(t,0,1), t*t*(3-2*t));
const eout   = t => 1-Math.pow(1-clamp(t,0,1),3);

/* ------------------------------ colour ------------------------------- */
function rgb(c){
  if (typeof c !== 'string') return c;
  return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
}
function shade(c,a){                       // +1 toward white, -1 toward black
  const p = rgb(c), t = a>0?255:0, k = Math.abs(a);
  return [p[0]+(t-p[0])*k, p[1]+(t-p[1])*k, p[2]+(t-p[2])*k];
}
function mix(a,b,k){
  const p=rgb(a), q=rgb(b);
  return [p[0]+(q[0]-p[0])*k, p[1]+(q[1]-p[1])*k, p[2]+(q[2]-p[2])*k];
}
function css(c,a){
  const p = rgb(c);
  return 'rgba('+(p[0]|0)+','+(p[1]|0)+','+(p[2]|0)+','+(a==null?1:clamp(a,0,1))+')';
}

/* ---------------------------- geometry ------------------------------- */
// a hand-drawn line: gentle bow plus three-octave wobble, never straight
function pathLine(x0,y0,x1,y1,o,rng){
  o = o||{};
  const n = o.n||18, bow = o.bow||0, wb = o.wob==null?4:o.wob;
  const dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy)||1;
  const nx = -dy/L, ny = dx/L;
  const p0=rng.r(0,6.28), p1=rng.r(0,6.28), p2=rng.r(0,6.28);
  const f0=0.7+rng.f()*0.8, f1=1.9+rng.f()*1.4, f2=3.7+rng.f()*2.2;
  const pts = [];
  for (let i=0;i<n;i++){
    const u = i/(n-1);
    let off = bow*Math.sin(Math.PI*u);
    off += wb*(0.62*Math.sin(f0*u*6.283+p0) + 0.28*Math.sin(f1*u*6.283+p1)
             + 0.16*Math.sin(f2*u*6.283+p2));
    pts.push({ x:x0+dx*u+nx*off, y:y0+dy*u+ny*off });
  }
  return pts;
}
function trim(pts,k){
  if (k>=1) return pts;
  if (k<=0 || pts.length<2) return null;
  const L = (pts.length-1)*k, i = Math.floor(L), f = L-i;
  const out = pts.slice(0,i+1);
  if (i+1 < pts.length){
    const a=pts[i], b=pts[i+1];
    out.push({ x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f });
  }
  return out.length>1 ? out : null;
}
function bbox(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  return { x:x0, y:y0, w:x1-x0, h:y1-y0, cx:(x0+x1)/2, cy:(y0+y1)/2 };
}
function poly(c,pts){
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
  for (let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
}
// wobbly ellipse ring — her circles are never compass circles
function ring(cx,cy,rx,ry,rng,o){
  o=o||{};
  const n = o.n||36, wob = o.wob==null?0.035:o.wob, rot=o.rot||0;
  const p0=rng.r(0,6.28), p1=rng.r(0,6.28);
  const f0=2+rng.i(2), f1=3+rng.i(3);
  const pts=[];
  for (let i=0;i<n;i++){
    const a = i/n*6.283;
    const d = 1 + wob*(0.65*Math.sin(f0*a+p0)+0.35*Math.sin(f1*a+p1));
    const x = Math.cos(a)*rx*d, y = Math.sin(a)*ry*d;
    pts.push({ x:cx+x*Math.cos(rot)-y*Math.sin(rot), y:cy+x*Math.sin(rot)+y*Math.cos(rot) });
  }
  return pts;
}

/* ------------------------- painterly primitives ---------------------- */
// a loaded brush: several bristles, each with its own tone, width and drift
function bristle(c,pts,w,col,rng,o){
  if (!pts || pts.length<2) return;
  o = o||{};
  const bn    = o.bristles || clamp(Math.round(w/3.2),2,9);
  const alpha = o.alpha==null?0.85:o.alpha;
  const tone  = o.tone==null?0.14:o.tone;
  const jit   = o.jitter==null?w*0.16:o.jitter;
  const taper = o.taper!==false;
  c.lineCap = o.cap||'round'; c.lineJoin='round';
  for (let b=0;b<bn;b++){
    const u  = bn===1?0:(b/(bn-1)-0.5);
    const lw = Math.max(0.6,(w/bn)*rng.r(0.8,1.9)*(o.lw||1));
    c.strokeStyle = css(shade(col,(rng.f()-0.5)*2*tone), alpha*rng.r(0.55,1));
    c.lineWidth = lw;
    c.beginPath();
    const last = pts.length-1;
    for (let i=0;i<=last;i++){
      const p  = pts[i];
      const q  = pts[Math.min(i+1,last)], s = pts[Math.max(i-1,0)];
      let dx=q.x-s.x, dy=q.y-s.y; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      const fr = last?i/last:0;
      const fall = taper ? 0.35+0.65*Math.sin(Math.PI*clamp(fr,0,1)) : 1;
      const e = u*w*fall + (rng.f()-0.5)*jit;
      const x = p.x - dy*e, y = p.y + dx*e;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    c.stroke();
  }
}
// dark flecks laid into the paint (Small Crowd, Mirror Mirror, Growth)
function speckle(c,bb,col,n,rng,o){
  o=o||{};
  const amin=o.amin==null?0.10:o.amin, amax=o.amax==null?0.42:o.amax;
  for (let i=0;i<n;i++){
    const x = bb.x+rng.f()*bb.w, y = bb.y+rng.f()*bb.h;
    const s = rng.r(o.smin||0.8, o.smax||2.8);
    c.fillStyle = css(shade(col,(rng.f()-0.5)*0.3), rng.r(amin,amax));
    if (rng.f()<0.18) { c.beginPath(); c.arc(x,y,s*0.7,0,6.283); c.fill(); }
    else c.fillRect(x,y,s,s*rng.r(0.7,1.7));
  }
}
// sgraffito: fine light lines raked back through wet dark paint
function scratch(c,bb,col,n,rng,o){
  o=o||{};
  for (let i=0;i<n;i++){
    const x = bb.x+rng.f()*bb.w, y = bb.y+rng.f()*bb.h;
    const len = rng.r(o.lmin||bb.w*0.12, o.lmax||bb.w*0.5);
    const a  = (o.ang==null?0:o.ang)+rng.r(-0.22,0.22);
    const pts = pathLine(x,y,x+Math.cos(a)*len,y+Math.sin(a)*len,{n:8,wob:rng.r(1,4)},rng);
    c.strokeStyle = css(col, rng.r(o.amin||0.10,o.amax||0.40));
    c.lineWidth = rng.r(0.6,1.9); c.lineCap='round';
    c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
    for (let j=1;j<pts.length;j++) c.lineTo(pts[j].x,pts[j].y);
    c.stroke();
  }
}
// fill a shape the way she fills one: base, then directional loaded strokes
function paintShape(c,pts,col,rng,o){
  o=o||{};
  const bb = bbox(pts);
  c.save();
  poly(c,pts); c.clip();
  c.fillStyle = css(shade(col,-0.05), o.base==null?1:o.base);
  c.fillRect(bb.x-2,bb.y-2,bb.w+4,bb.h+4);
  const dir = o.dir==null?Math.PI/2:o.dir;
  const dxu = Math.cos(dir), dyu = Math.sin(dir);
  const diag = Math.hypot(bb.w,bb.h);
  const n = o.strokes || clamp(Math.round(bb.w*bb.h/2600),6,90);
  for (let i=0;i<n;i++){
    const e   = (rng.f()-0.5)*diag*1.05;
    const len = diag*rng.r(0.45,1.15);
    const mx  = bb.cx - dyu*e + dxu*(rng.f()-0.5)*diag*0.35;
    const my  = bb.cy + dxu*e + dyu*(rng.f()-0.5)*diag*0.35;
    const pl  = pathLine(mx-dxu*len/2,my-dyu*len/2,mx+dxu*len/2,my+dyu*len/2,
                         {n:9,wob:rng.r(1,5)},rng);
    const cc  = o.mixWith ? mix(col,o.mixWith,rng.f()*(o.mixK==null?0.5:o.mixK)) : col;
    bristle(c,pl,rng.r(o.bw||7,(o.bw||7)*2.4),
            shade(cc,(rng.f()-0.5)*2*(o.tone==null?0.17:o.tone)),rng,
            { alpha:rng.r(0.2,0.6), bristles:3 });
  }
  if (o.speck) speckle(c,bb,o.speckCol||P.ink,o.speck,rng,{amin:0.06,amax:0.3});
  if (o.scratch) scratch(c,bb,o.scratchCol||shade(col,0.55),o.scratch,rng,{ang:o.scratchAng||0});
  c.restore();
}
// edge treatment 1: a loaded ink contour of visibly varying width
function inkContour(c,pts,w,col,rng,k,o){
  o=o||{};
  const closed = pts.concat([pts[0]]);
  const kk = k==null?1:k;
  const cut = Math.max(2,Math.round(closed.length*clamp(kk,0,1)));
  const seg = closed.slice(0,cut);
  for (let i=0;i<seg.length-1;i++){
    const a=seg[i], b=seg[i+1];
    c.strokeStyle = css(shade(col,(rng.f()-0.5)*0.22), rng.r(o.amin||0.55,o.amax||0.95));
    c.lineWidth = w*rng.r(0.45,1.75);
    c.lineCap='round';
    c.beginPath();
    c.moveTo(a.x+(rng.f()-0.5)*w*0.5, a.y+(rng.f()-0.5)*w*0.5);
    c.lineTo(b.x+(rng.f()-0.5)*w*0.5, b.y+(rng.f()-0.5)*w*0.5);
    c.stroke();
  }
}
// edge treatment 2: a soft charcoal bloom pushed outward, no line (In the Pink)
function charcoalHalo(c,pts,spread,col,rng,alpha){
  const bb = bbox(pts);
  const a  = alpha==null?0.30:alpha;
  for (let pass=6; pass>=1; pass--){
    const g = pass/6;
    c.save();
    c.translate(bb.cx,bb.cy); c.scale(1+g*spread/Math.max(bb.w,bb.h)*2,1+g*spread/Math.max(bb.w,bb.h)*2);
    c.translate(-bb.cx,-bb.cy);
    poly(c,pts);
    c.fillStyle = css(col, a*(1-g)*0.5+0.03);
    c.fill();
    c.restore();
  }
  // broken-up outer edge so the bloom is grainy, not a glow
  for (let i=0;i<pts.length;i++){
    const p=pts[i], q=pts[(i+1)%pts.length];
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const dx=mx-bb.cx, dy=my-bb.cy, L=Math.hypot(dx,dy)||1;
    for (let j=0;j<3;j++){
      const e = rng.r(0,spread);
      c.fillStyle = css(col, rng.r(0.05,0.28));
      const s = rng.r(1.5,5);
      c.fillRect(mx+dx/L*e, my+dy/L*e, s, s*rng.r(0.6,1.6));
    }
  }
}
// gravity left in the picture (Moonset)
function drip(c,x,y,len,w,col,rng,k){
  const L = len*clamp(k,0,1);
  const pts = pathLine(x,y,x+rng.r(-5,5),y+L,{n:12,wob:1.4},rng);
  bristle(c,pts,w,col,rng,{alpha:0.5,bristles:2,taper:false,jitter:w*0.3});
  if (k>0.85){
    c.fillStyle = css(shade(col,-0.1),0.45);
    c.beginPath(); c.arc(pts[pts.length-1].x,pts[pts.length-1].y,w*0.55,0,6.283); c.fill();
  }
}

/* ------------------------------ grounds ------------------------------ */
// never a flat fill: one base coat, then a hundred-odd broad scumble strokes
function ground(c,cols,rng,o){
  o = o||{};
  c.fillStyle = css(cols[0]); c.fillRect(0,0,W,H);
  const dir = o.dir==null?Math.PI/2:o.dir;
  const n = o.strokes||110;
  for (let i=0;i<n;i++){
    const col = mix(rng.pick(cols), rng.pick(cols), rng.f());
    const d   = dir + rng.r(-(o.spread==null?0.3:o.spread),(o.spread==null?0.3:o.spread));
    const len = rng.r(H*0.35,H*1.15);
    const mx  = rng.r(-60,W+60), my = rng.r(-60,H+60);
    const pl  = pathLine(mx-Math.cos(d)*len/2,my-Math.sin(d)*len/2,
                         mx+Math.cos(d)*len/2,my+Math.sin(d)*len/2,
                         {n:14,wob:rng.r(2,12)},rng);
    bristle(c,pl,rng.r(26,96),col,rng,{ alpha:rng.r(0.10,0.34), bristles:rng.i(3)+3, tone:0.1 });
  }
  const full = { x:0, y:0, w:W, h:H, cx:W/2, cy:H/2 };
  if (o.speck !== 0) speckle(c,full,o.speckCol||P.ink,o.speck||1800,rng,{amin:0.03,amax:0.14,smin:0.7,smax:2.2});
  if (o.light !== 0) speckle(c,full,shade(cols[0],0.5),o.light||900,rng,{amin:0.04,amax:0.18,smin:0.8,smax:2.6});
  if (o.scratch) scratch(c,full,o.scratchCol||shade(cols[0],0.4),o.scratch,rng,
                         {ang:o.scratchAng||0,amin:0.04,amax:0.16});
}

/* --------------------------- her vocabulary -------------------------- */
// a slab person: tapered column, round head on top, no feet, no hands
function slabPts(x,top,bot,wTop,wBot,rng){
  const p=[];
  const wob = ()=> (rng.f()-0.5)*wTop*0.06;
  const capH = wTop*0.30;
  for (let i=0;i<=10;i++){
    const u=i/10, a=Math.PI*(1-u);
    p.push({ x:x+Math.cos(a)*(wTop/2)+wob(), y:top+capH-Math.sin(a)*capH+wob() });
  }
  for (let i=1;i<=11;i++){
    const u=i/11;
    p.push({ x:x+(wTop/2)+((wBot-wTop)/2)*u+wob(), y:top+capH+(bot-top-capH)*u });
  }
  for (let i=1;i<=4;i++){ const u=i/4; p.push({ x:x+wBot/2-wBot*u, y:bot+wob()*1.8 }); }
  for (let i=1;i<11;i++){
    const u=1-i/11;
    p.push({ x:x-((wTop/2)+((wBot-wTop)/2)*u)+wob(), y:top+capH+(bot-top-capH)*u });
  }
  return p;
}
function slabFigure(c,o,rng,k){
  k = k==null?1:k;
  if (k<=0) return;
  const w = o.w, r = w*0.47;
  const headY = o.headY, bot = o.bot;
  const bodyTop = headY + r*0.52;
  const body = slabPts(o.x, bodyTop, bot, w*0.9, w*(o.flare==null?1.04:o.flare), rng);
  const head = ring(o.x+(o.headDx||0), headY, r, r*rng.r(1.0,1.14), rng, {n:26,wob:0.05});
  const col  = o.col||P.peach;

  c.save();
  // reveal from the ground up — paint arriving, not an object fading in
  const top = Math.min(headY-r*1.2, bodyTop);
  c.beginPath(); c.rect(o.x-w*1.4, bot+8-(bot+8-top)*smooth(k), w*2.8, (bot+8-top)*smooth(k)+4); c.clip();
  c.globalAlpha = clamp(k*2.4,0,1);

  paintShape(c,body,col,rng,{ dir:Math.PI/2, bw:6, tone:0.15,
                              mixWith:o.mixWith||shade(col,0.22), mixK:0.55,
                              speck:o.speck==null?26:o.speck, speckCol:P.ink });
  paintShape(c,head,mix(col,shade(col,0.12),0.5),rng,{ dir:1.1, bw:5, tone:0.13,
                              speck:o.speck==null?10:Math.round(o.speck*0.4), speckCol:P.ink });
  if (o.halo) charcoalHalo(c,body,o.halo,P.ink,rng,0.18);
  if (o.ink!==false){
    inkContour(c,body,o.inkW||3.1,o.inkCol||P.ink,rng,1,{amin:0.35,amax:0.8});
    inkContour(c,head,o.inkW||3.1,o.inkCol||P.ink,rng,1,{amin:0.35,amax:0.8});
  }
  if (o.face) face(c,{ x:o.x+(o.headDx||0), y:headY, r:r },rng,o.face);
  c.restore();
}
// three marks and no more: dot eyes, a line mouth, a blushed cheek
function face(c,o,rng,k){
  k = clamp(k,0,1);
  const r = o.r;
  if (k>0.05){
    const a = clamp((k-0.05)/0.3,0,1);
    for (const s of [-1,1]){
      c.fillStyle = css(P.magenta, 0.30*a);
      c.beginPath(); c.ellipse(o.x+s*r*0.52, o.y+r*0.18, r*0.27, r*0.19, 0, 0, 6.283); c.fill();
      c.fillStyle = css(P.magenta, 0.16*a);
      c.beginPath(); c.ellipse(o.x+s*r*0.52, o.y+r*0.18, r*0.36, r*0.26, 0, 0, 6.283); c.fill();
    }
  }
  if (k>0.3){
    const a = clamp((k-0.3)/0.3,0,1);
    for (const s of [-1,1]){
      c.fillStyle = css(P.ink, 0.86*a);
      c.beginPath();
      c.ellipse(o.x+s*r*0.26+rng.r(-1.5,1.5), o.y-r*0.12, r*0.072*rng.r(0.85,1.2), r*0.088, rng.r(-0.3,0.3), 0, 6.283);
      c.fill();
    }
  }
  if (k>0.62){
    const a = clamp((k-0.62)/0.3,0,1);
    const mp = pathLine(o.x-r*0.22, o.y+r*0.42, o.x+r*0.22, o.y+r*0.42, {n:9,bow:r*0.13,wob:1.2}, rng);
    bristle(c,mp,2.6,P.ink,rng,{alpha:0.8*a,bristles:2,taper:true});
  }
}
// tulips: the upright bud and the drooping open head, both with ink contours
function tulipHead(c,o,rng,k){
  k = clamp(k==null?1:k,0,1);
  if (k<=0.02) return;
  const r = o.r*(0.45+0.55*eout(k));
  const open = o.open==null?0:o.open*eout(k);   // 0 = closed bud, 1 = full droop
  const rot = (o.rot||0) + open*(o.droop||0);
  const pts = [];
  const lobes = o.lobes||3;
  const n = 44;
  for (let i=0;i<n;i++){
    const a = i/n*6.283;
    // almond profile, pinched at the base, lobed at the lip as it opens
    let d = Math.pow(Math.abs(Math.sin(a*0.5)),0.62);
    d *= 1 + open*0.34*Math.cos(a*lobes);
    d *= 1 + 0.045*Math.sin(a*7+o.r);
    const x = Math.cos(a)*r*(0.52+open*0.30)*d;
    const y = Math.sin(a)*r*d;
    pts.push({ x:o.cx+x*Math.cos(rot)-y*Math.sin(rot), y:o.cy+x*Math.sin(rot)+y*Math.cos(rot) });
  }
  const col = o.col||P.orange;
  paintShape(c,pts,col,rng,{ dir:rot+Math.PI/2, bw:5, tone:0.2,
                             mixWith:o.mixWith||P.vermilion, mixK:0.65,

}
function stem(c,o,rng,k){
  const pts = pathLine(o.x0,o.y0,o.x1,o.y1,{n:22,bow:o.bow||0,wob:o.wob==null?5:o.wob},rng);

  inkContour(c,t,1.9,P.ink,rng,1,{amin:0.2,amax:0.55});
  if (o.leaf && k>0.55){
    const lk = clamp((k-0.55)/0.45,0,1);
    const i = Math.floor(t.length*0.5), p = t[i]||t[0];
    const dir = o.leafDir==null?-0.7:o.leafDir;
    const lp = ring(p.x+Math.cos(dir)*70*lk, p.y+Math.sin(dir)*40*lk, 78*lk, 19*lk, rng, {n:20,wob:0.1,rot:dir});

    inkContour(c,lp,2,P.ink,rng,1,{amin:0.25,amax:0.6});

// the broad five-petal flower with a white star centre (Flora — In the Pink)
function petalFlower(c,o,rng,k){
  k = clamp(k,0,1);
  if (k<=0.02) return;
  const n = o.n||5, Rr = o.r;
  const petals = [];
  for (let i=0;i<n;i++){
    const a  = (i/n)*6.283 + (o.rot||0);
    const kk = clamp((k-i*0.055)/0.55,0,1);
    if (kk<=0.02) continue;
    const g  = eout(kk);
    const len = Rr*g*rng.r(0.93,1.08), wid = Rr*0.50*g*rng.r(0.9,1.12);
    const cx = o.cx+Math.cos(a)*len*0.60, cy = o.cy+Math.sin(a)*len*0.60;
    const pp = ring(cx,cy,len*0.58,wid,rng,{n:30,wob:0.07,rot:a});
    petals.push({pp,a,cx,cy,g});
  }
  for (const q of petals) charcoalHalo(c,q.pp,26,P.ink,rng,0.34);
  for (const q of petals){
    paintShape(c,q.pp,o.col||P.pink,rng,{ dir:q.a, bw:6, tone:0.14,
                                          mixWith:shade(o.col||P.pink,0.4), mixK:0.7, strokes:26 });
    // magenta radiating out of the heart
    c.save(); poly(c,q.pp); c.clip();
    for (let j=0;j<11;j++){
      const sp = rng.r(-0.3,0.3);
      const L  = Rr*rng.r(0.3,0.78)*q.g;
      const pl = pathLine(o.cx,o.cy,o.cx+Math.cos(q.a+sp)*L,o.cy+Math.sin(q.a+sp)*L,{n:10,wob:3},rng);
      bristle(c,pl,rng.r(7,20),o.hot||P.magenta,rng,{alpha:rng.r(0.25,0.62),bristles:3,tone:0.18});
    }
    c.restore();
  }
  if (k>0.5){
    const a = clamp((k-0.5)/0.4,0,1);
    for (let j=0;j<9;j++){
      const ang = rng.r(0,6.283), L = Rr*rng.r(0.06,0.3);
      const pl = pathLine(o.cx,o.cy,o.cx+Math.cos(ang)*L,o.cy+Math.sin(ang)*L,{n:6,wob:2},rng);
      bristle(c,pl,rng.r(4,13),shade(P.cream,0.55),rng,{alpha:0.8*a,bristles:2});
    }
  }
}
// bottles and pots as overlapping transparent contours (Flora — Transparencies)
function vesselPts(o,rng){
  const p=[];
  const bw = o.w, nw = o.neck==null?o.w*0.22:o.neck, h=o.h;
  const by = o.baseY, ty = by-h;
  const prof = [];
  const shape = o.shape||'bottle';
  for (let i=0;i<=22;i++){
    const u = i/22;                        // 0 at base, 1 at lip
    let r;
    if (shape==='bottle') r = u<0.52 ? bw*(0.94+0.1*Math.sin(u*3.0)) : nw+(bw-nw)*Math.pow(1-(u-0.52)/0.48,1.9);
    else if (shape==='pot') r = bw*(0.62+0.42*Math.sin(Math.PI*clamp(u*0.9+0.08,0,1)));
    else if (shape==='vase') r = bw*(0.5+0.55*Math.sin(Math.PI*clamp(u*0.78+0.12,0,1)));
    else if (shape==='bowl') r = bw*(0.42+0.6*u);
    else r = bw*(0.86+0.14*u);             // tumbler
    prof.push({ u, r:r*(1+0.016*Math.sin(u*14+o.baseY)) });
  }
  for (const s of prof) p.push({ x:o.cx-s.r/2+(rng.f()-0.5)*2.4, y:by-h*s.u });
  for (let i=prof.length-1;i>=0;i--) p.push({ x:o.cx+prof[i].r/2+(rng.f()-0.5)*2.4, y:by-h*prof[i].u });
  return p;
}
function vessel(c,o,rng,k){
  const pts = vesselPts(o,rng);
  if (o.wash) {
    c.save(); poly(c,pts); c.clip();
    c.globalAlpha = clamp(k*1.6,0,1);
    paintShape(c,pts,o.col||P.warmgrey,rng,{ dir:Math.PI/2, bw:8, base:o.washA==null?0.3:o.washA,
                                             strokes:16, tone:0.1 });
    c.restore();
  }
  c.globalAlpha = clamp(k*1.4,0,1);
  inkContour(c,pts,o.w>140?3.4:2.6,o.inkCol||P.ink,rng,k,{amin:0.3,amax:0.75});
  c.globalAlpha = 1;
  return pts;
}
// the disc: sun, moon, or a head behind bars
function disc(c,o,rng,k){
  k = clamp(k,0,1);
  if (k<=0.02) return null;
  const r = o.r*(o.pop?eout(k):1);
  const pts = ring(o.cx,o.cy,r,r*rng.r(0.97,1.03),rng,{n:o.n||44,wob:o.wob==null?0.022:o.wob});
  c.save();
  c.beginPath(); c.rect(o.cx-r*1.3, o.cy+r*1.3-(r*2.6)*smooth(k), r*2.6, r*2.6*smooth(k)); c.clip();
  if (o.halo) charcoalHalo(c,pts,o.halo,o.haloCol||P.ink,rng,0.3);
  paintShape(c,pts,o.col,rng,{ dir:o.dir==null?0.5:o.dir, bw:o.bw||8, tone:o.tone==null?0.18:0.18,
                               mixWith:o.mixWith, mixK:o.mixK==null?0.7:o.mixK,
                               speck:o.speck||0, speckCol:P.ink,
                               scratch:o.scratch||0, scratchCol:o.scratchCol, scratchAng:o.scratchAng });
  if (o.ink) inkContour(c,pts,o.inkW||3.4,P.ink,rng,1,{amin:0.4,amax:0.85});
  c.restore();
  return pts;
}

/* ============================== SCENES ============================== */
/* Each scene is a list of marks in painting order. A mark is
   { at, grow, seed, f(ctx,k,rng) } with `at`/`grow` in seconds of scene time.
   Marks are baked into the scene's buffer once complete, so the film stays
   cheap without ever pre-rendering the composition. */

function builder(base){
  const marks = []; let n = 0;
  return {
    marks,
    add(at,grow,f){ marks.push({ at, grow, seed:(base*7919 + (++n)*104729)>>>0, f }); }
  };
}

      const y = rng.r(430,1090);
      const pl = pathLine(-60,y,W+60,y+rng.r(-12,12),{n:16,wob:rng.r(2,10)},rng);
      bristle(c,pl,rng.r(30,90),mix(rng.pick(['#6F7775','#969D99','#C4C6C3']),
              rng.pick(['#4A4D4A','#C4C6C3']),rng.f()),rng,{alpha:rng.r(0.18,0.55),bristles:4});
    }
    speckle(c,{x:0,y:420,w:W,h:660,cx:540,cy:750},'#1C1F23',1400,rng,{amin:0.04,amax:0.2});
  },
  build(){
    const b = builder(9);
    // the disc: her hottest colour, her smallest shape
    b.add(0.35,1.10,(c,k,rng)=>{
      disc(c,{ cx:628, cy:246, r:116, col:P.sun, mixWith:P.vermilion, mixK:0.75,
               dir:1.2, bw:7, pop:true, halo:36, haloCol:'#0A3D63' },rng,k);
    });
    // the black horizon band
    b.add(1.10,0.85,(c,k,rng)=>{
      const bp=[{x:-10,y:366},{x:1090,y:358},{x:1090,y:466},{x:-10,y:474}];
      c.save(); c.beginPath(); c.rect(-10,358,1100*smooth(k),120); c.clip();
      paintShape(c,bp,'#1C1F23',rng,{dir:0.01,bw:10,tone:0.18,strokes:36,speck:40,speckCol:'#000'});
      c.restore();
    });
    // two towers against it
    b.add(1.80,0.55,(c,k,rng)=>{
      [[752,296,22,84],[792,282,20,98],[700,318,26,62]].forEach((t,i)=>{
        const kk = clamp(k*1.4-i*0.18,0,1); if (kk<=0) return;
        const tp = slabPts(t[0],t[1],t[1]+t[3],t[2],t[2]*1.1,rng);
        c.save(); c.beginPath(); c.rect(t[0]-40,t[1]+t[3]-t[3]*smooth(kk),80,t[3]*smooth(kk)); c.clip();
        paintShape(c,tp,P.pale,rng,{dir:Math.PI/2,bw:4,strokes:7,tone:0.14});
        c.restore();
      });
    });
    // the blocks of a town, arriving one by one
    const rngB = R(9191);
    for (let i=0;i<26;i++){
      const x = rngB.r(-40,1040), y = rngB.r(470,940);
      const w = rngB.r(70,230), h = rngB.r(60,190);
      const col = rngB.pick(['#C4C6C3','#969D99','#6F7775',P.pale,'#B08A6E']);
      const at  = 1.90 + i*0.10;
      b.add(at,0.45,(c,k,rng)=>{
        const bp=[{x,y},{x:x+w,y:y+rng.r(-7,7)},{x:x+w+rng.r(-6,6),y:y+h},{x,y:y+h+rng.r(-5,5)}];
        c.save(); c.beginPath(); c.rect(x-6,y-6,w*smooth(k)+12,h+12); c.clip();
        paintShape(c,bp,col,rng,{dir:rng.f()<0.5?0:Math.PI/2,bw:7,tone:0.16,strokes:16,
                   speck:12,speckCol:'#1C1F23'});
        c.restore();
        if (k>0.6){                       // small dark windows
          const kk=clamp((k-0.6)/0.4,0,1);
          for (let j=0;j<3;j++){
            if (rng.f()>kk) continue;
            c.fillStyle = css('#1C1F23',rng.r(0.5,0.9));
            c.fillRect(x+rng.r(12,w-30),y+rng.r(12,h-30),rng.r(10,22),rng.r(12,26));
          }
        }
      });
    }
    // gravity, left in
    const rngD = R(9292);
    for (let i=0;i<15;i++){
      const x = rngD.r(20,1060), y = rngD.r(500,760);
      const len = rngD.r(120,420);
      const at = 2.60+i*0.12;
      b.add(at,2.4,(c,k,rng)=>{
        drip(c,x,y,len,rng.r(5,13),rng.f()<0.5?'#4A4D4A':'#8A7A66',rng,k);
      });
    }
    // and two of them left, standing close, facing it
    b.add(4.40,1.10,(c,k,rng)=>{
      slabFigure(c,{ x:352, headY:806, bot:1046, w:82, col:'#3A3A38', ink:true, inkW:2.6,
                     speck:14, halo:16 },rng,clamp(k*1.5,0,1));
      slabFigure(c,{ x:428, headY:838, bot:1050, w:70, col:'#4A4642', ink:true, inkW:2.4,
                     speck:12, halo:14 },rng,clamp(k*1.5-0.35,0,1));
    });
    return b.marks;
  }
});

/* --- 10. RETURN ------------------------------------------------- 4.0s */
SCENES.push({
  name:'return', dur:4.0,
  ground: OPEN_GROUND,                 // exactly the ground scene 1 opens on
  build(){
    const b = builder(10);
    // everything that happened, still in the cloth
    b.add(0.00,1.10,(c,k,rng)=>{
      const g = [ [P.vermilion,200,760,1.5],[P.turquoise,760,420,1.3],[P.gold,540,210,0.1],

      g.forEach((q,i)=>{

                            q[1]+Math.cos(q[3])*len/2,q[2]+Math.sin(q[3])*len/2,{n:16,wob:9},rng);
        bristle(c,trim(pl,a),rng.r(70,120),q[0],rng,{alpha:0.13,bristles:5,tone:0.1});

    // the first colour again — older paint, speckled, scratched through
    b.add(0.55,1.25,(c,k,rng)=>{
      const pl = pathLine(430,568,438,884,{n:26,bow:10,wob:7},rng);
      bristle(c,trim(pl,k),64,P.vermilion,rng,{alpha:0.9,bristles:7,tone:0.2,taper:false});
      if (k>0.55){
        const a=clamp((k-0.55)/0.45,0,1);

        speckle(c,{x:392,y:566,w:88,h:320,cx:436,cy:726},P.deepred,120,rng,{amin:0.1,amax:0.45});
        scratch(c,{x:392,y:566,w:88,h:320,cx:436,cy:726},shade(P.vermilion,0.5),14,rng,
                {ang:1.5,lmin:40,lmax:170,amin:0.12,amax:0.4});

    b.add(1.00,0.70,(c,k,rng)=>{

      paintShape(c,hd,mix(P.peach,P.pale,0.4),rng,{dir:1.0,bw:5,speck:14,speckCol:P.ink});
      c.globalAlpha = 1;
    });
    b.add(1.35,0.65,(c,k,rng)=>{
      const bd = slabPts(434,560,884,74,86,rng);
      const hd = ring(430,522,52,58,rng,{n:26,wob:0.06});
      inkContour(c,bd,3.4,P.ink,rng,k,{amin:0.25,amax:0.7});
      inkContour(c,hd,3.0,P.ink,rng,clamp(k*1.5,0,1),{amin:0.25,amax:0.7});
    });
    // the one who was far off in the first scene is standing next to them now
    b.add(1.15,1.05,(c,k,rng)=>{
      slabFigure(c,{ x:530, headY:596, bot:886, w:66, col:mix(P.peach,P.pale,0.5),
                     ink:true, inkW:2.8, speck:18, halo:10 },rng,clamp(k,0,1));
    });
    b.add(1.95,0.60,(c,k,rng)=>{
      c.globalAlpha=k;
      const sh = ring(470,894,166,18,rng,{n:24,wob:0.16});
      paintShape(c,sh,P.ink,rng,{dir:0,bw:5,base:0.13,strokes:8});
      c.globalAlpha=1;

    // the quiet mark, pencilled into the ground
    b.add(1.20,0.45,(c,k,rng)=>{
      const a = clamp(k,0,1);
      c.save();
      c.translate(902,1012); c.rotate(-0.035);
      c.font = 'italic 34px "Segoe Script","Bradley Hand","Apple Chancery",cursive,Georgia,serif';
      c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      for (let p=0;p<4;p++){
        c.fillStyle = css('#5A5550', 0.20*a);

/* ============================ the machine =========================== */
const DUR = SCENES.map(s=>s.dur);
const START = [0];
for (let i=0;i<DUR.length;i++) START.push(START[i]+DUR[i]);
const TOTAL = START[START.length-1];        // 60.000
const TR = 1.10;                            // paint-over transition

function newCanvas(){
  const el = document.createElement('canvas');
  el.width = W; el.height = H;
  return el;
}
const SCRATCH = newCanvas(), SCTX = SCRATCH.getContext('2d');
const MASK    = newCanvas(), MCTX = MASK.getContext('2d');

function Layer(i){
  this.i = i;
  this.buf = newCanvas();
  this.bctx = this.buf.getContext('2d');
  this.out = newCanvas();
  this.octx = this.out.getContext('2d');
  this.marks = SCENES[i].build();
  this.reset();
}
Layer.prototype.reset = function(){
  this.bctx.setTransform(1,0,0,1,0,0);
  this.bctx.globalAlpha = 1;
  this.bctx.clearRect(0,0,W,H);
  SCENES[this.i].ground(this.bctx);
  this.baked = 0;
  this.p = 0;
};
Layer.prototype.render = function(p){
  if (p < this.p - 0.05) this.reset();
  this.p = p;
  // bake the prefix of marks that have finished — paint that is dry
  while (this.baked < this.marks.length){
    const m = this.marks[this.baked];
    if (p >= m.at + m.grow + 1e-4){
      this.bctx.setTransform(1,0,0,1,0,0); this.bctx.globalAlpha = 1;
      m.f(this.bctx, 1, R(m.seed));
      this.baked++;
    } else break;
  }
  const o = this.octx;
  o.setTransform(1,0,0,1,0,0); o.globalAlpha = 1;
  o.clearRect(0,0,W,H);
  o.drawImage(this.buf,0,0);
  for (let i=this.baked;i<this.marks.length;i++){
    const m = this.marks[i];
    if (p <= m.at) continue;
    const k = m.grow>1e-6 ? Math.min(1,(p-m.at)/m.grow) : 1;
    o.setTransform(1,0,0,1,0,0); o.globalAlpha = 1;
    m.f(o, k, R(m.seed));
  }
  return this.out;
};

const layers = new Map();
function layer(i){
  let L = layers.get(i);
  if (!L){ L = new Layer(i); layers.set(i,L); }
  return L;
}

// the new ground is brushed over the old one — she paints over, she never cuts
function paintOver(dst, src, q, seed){
  const rng = R(4000+seed*977);
  SCTX.setTransform(1,0,0,1,0,0); SCTX.globalAlpha = 1;
  SCTX.globalCompositeOperation = 'source-over';
  SCTX.clearRect(0,0,W,H);
  SCTX.drawImage(src,0,0);

  MCTX.setTransform(1,0,0,1,0,0); MCTX.globalAlpha = 1;
  MCTX.globalCompositeOperation = 'source-over';
  MCTX.clearRect(0,0,W,H);

  const dir  = [Math.PI/2, 0.12, 1.9, 0.5, Math.PI/2, 1.1][seed % 6];
  const N    = 20;
  const span = Math.abs(Math.cos(dir))*W + Math.abs(Math.sin(dir))*H;
  const step = span/N;
  const dxu = Math.cos(dir+Math.PI/2), dyu = Math.sin(dir+Math.PI/2);
  for (let i=0;i<N;i++){
    const a = clamp(q*N*1.25 - i, 0, 1);
    if (a<=0) continue;
    const e  = (i+0.5)*step - span/2 + rng.r(-step*0.3,step*0.3);
    const mx = W/2 - Math.sin(dir)*0 + Math.cos(dir)*e*0 - dyu*0 + (-Math.sin(dir+Math.PI/2))*0;
    const cxp = W/2 + Math.cos(dir)*e, cyp = H/2 + Math.sin(dir)*e;
    const len = span*1.6;
    const pl = pathLine(cxp-dxu*len/2, cyp-dyu*len/2, cxp+dxu*len/2, cyp+dyu*len/2,
                        {n:18,wob:rng.r(6,26)},rng);
    bristle(MCTX, pl, step*rng.r(1.15,1.7), '#000000', rng,
            { alpha:a, bristles:rng.i(3)+4, tone:0, jitter:step*0.34, taper:false });
  }
  if (q>0.84){
    MCTX.globalAlpha = smooth((q-0.84)/0.16);
    MCTX.fillStyle = '#000'; MCTX.fillRect(0,0,W,H);
    MCTX.globalAlpha = 1;
  }
  SCTX.globalCompositeOperation = 'destination-in';
  SCTX.drawImage(MASK,0,0);
  SCTX.globalCompositeOperation = 'source-over';
  dst.drawImage(SCRATCH,0,0);
}

let warmedFor = -1;

/* t in seconds from the start of the film. 60.000s, wrapping. */
function draw(t){
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  let i = 0;
  while (i < DUR.length-1 && t >= START[i+1]) i++;
  const local = t - START[i];
  const dur = DUR[i];

  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(layer(i).render(local), 0, 0);

  // build the next scene's ground well before it is needed, so nothing stutters
  if (warmedFor !== i){
    warmedFor = i;
    const j = (i+1) % SCENES.length;
    const L = layer(j);
    if (L.p > 0.001) L.reset();
  }

  if (local > dur - TR){
    const q = clamp((local - (dur-TR))/TR, 0, 1);
    const j = (i+1) % SCENES.length;
    paintOver(ctx, layer(j).render(1e-4), q, i);
  }
}
window.draw = draw;

/* auto-start, no chrome, no controls */
let t0 = null;
function frame(now){
  if (t0 === null) t0 = now;
  draw((now - t0)/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
