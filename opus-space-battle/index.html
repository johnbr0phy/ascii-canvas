<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>opus space battle</title>
<style>
  html,body{margin:0;height:100%;background:#131110;overflow:hidden}
  body{display:grid;place-items:center}
  canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh)}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
/* opus space battle
   ------------------------------------------------------------------
   One file. No build, no npm, no library, no image, no webfont. Every
   mark on the sheet is a path this file computed.

   The whole piece is a pure function of time: draw(t), t in seconds
   from start, 30 s, loops. Nothing is integrated frame to frame, so
   the frame at t and the frame at t+30 are the same drawing and the
   seam is not a seam. Scrub it, capture it, skip into the middle of
   it — it comes out the same either way.

   Style is answerable to STYLE.md, which is answerable to the repos.
   The eight hard rules, short: two colourways and a hard cut between
   them; twelve drawings a second; boil the ink and not the ship;
   chrome is a drafting sheet and never a UI; fire is heat and not a
   team colour; capitals hold range and the heavy gun telegraphs;
   shade by hatching and texture by paper; one file.
*/
(() => {
"use strict";

/* ===================== 1. sheet ===================== */

const W = 1080, H = 1080, U = 1080;
const C = document.getElementById("c");
const X = C.getContext("2d", { alpha: false });
X.lineCap = "round";
X.lineJoin = "round";

const FONT = '"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

/* ===================== 2. maths ===================== */

const TAU = Math.PI * 2, PI = Math.PI;
const cos = Math.cos, sin = Math.sin, hyp = Math.hypot, abs = Math.abs;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

/* His three easings, and his reasons for them. Nothing here is a
   cubic-bezier: a body accelerating out of a pose is a sine, and a
   pose that holds is a sine with the middle squared out of it. */
const swing = x => sin(x * TAU);
const holdSin = (x, p = 0.45) => { const s = sin(x * TAU); return (s < 0 ? -1 : 1) * Math.pow(abs(s), p); };

function ih(a, b, c) {
  let n = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2147483647);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vn(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = ih(xi, yi, s), b = ih(xi + 1, yi, s), c = ih(xi, yi + 1, s), d = ih(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function RNG(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function norm(a) { const l = hyp(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

/* ===================== 3. palette ===================== */

/* Five hues and two grounds, and that is the whole range. The warm
   pair and the cold pair are lifted unchanged from the block that
   opens orbital-yard, mech-yard and moonbase; the fire ramp is the
   flash shader out of armada-war.html. */
const PAL = {
  paper: "#E4DFD5", ink: "#17120E", rule: "#C7BFB2", dim: "#6E665C",
  plate: "#0E2E52", plateInk: "#D9E6F2", plateDim: "#6E88A6",
  hero: "#85C794", foe: "#C7756B",           /* everyday fire */
  heroHot: "#73FF99", foeHot: "#FF5242",     /* the lance keeps the full voltage */
  emberA: "#FFF7E0", emberB: "#FF7329",      /* heat, never a team colour */
  alarm: "#F0450E", alarmInk: "#150F0B"
};

function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, u) {
  const A = hex(a), B = hex(b);
  return "rgb(" + Math.round(lerp(A[0], B[0], u)) + "," + Math.round(lerp(A[1], B[1], u)) + "," + Math.round(lerp(A[2], B[2], u)) + ")";
}
let MODE = "cold";      /* "warm" | "cold" | "alarm" */
let GROUND = PAL.plate;
let INK = PAL.plateInk;
let DIM = PAL.plateDim;
let WASH = PAL.paper;
let BOIL = 0;           /* the noise field the nib wanders through, shifted once per drawn frame */

function setMode(m) {
  MODE = m;
  if (m === "warm") { GROUND = PAL.paper; INK = PAL.ink; DIM = PAL.dim; WASH = mix(PAL.paper, PAL.ink, 0.055); }
  else if (m === "alarm") { GROUND = PAL.alarm; INK = PAL.alarmInk; DIM = PAL.alarmInk; WASH = mix(PAL.alarm, PAL.alarmInk, 0.10); }
  else { GROUND = PAL.plate; INK = PAL.plateInk; DIM = PAL.plateDim; WASH = PAL.plate; }
}
const warm = () => MODE !== "cold";

/* ===================== 4. paper ===================== */

/* Cartridge paper is not a flat tone: big soft blooms, then fibre
   lying in the sheet, then tooth. Three sheets are made at load and
   the drawing takes a different one each frame — the second drawing
   is a second drawing, which is the whole of why a flipbook lives. */
function makePaper(seed, base) {
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const rng = RNG(seed);
  c.fillStyle = base; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) {
    c.fillStyle = rng() < 0.5 ? "rgba(92,78,52,0.010)" : "rgba(255,252,244,0.016)";
    c.beginPath();
    c.ellipse(rng() * (W + 80) - 40, rng() * (H + 80) - 40, 60 + rng() * 240, 40 + rng() * 170, rng() * 6, 0, TAU);
    c.fill();
  }
  for (let i = 0; i < 2600; i++) {
    const a = rng() * TAU, len = 4 + rng() * 26, x = rng() * W, y = rng() * H;
    c.strokeStyle = rng() < 0.55 ? "rgba(74,60,40,0.075)" : "rgba(255,253,246,0.11)";
    c.lineWidth = 0.4 + rng() * 0.6;
    c.beginPath(); c.moveTo(x, y);
    c.quadraticCurveTo(x + cos(a) * len * 0.5 + rng() * 4 - 2, y + sin(a) * len * 0.5 + rng() * 4 - 2, x + cos(a) * len, y + sin(a) * len);
    c.stroke();
  }
  for (let i = 0; i < 9000; i++) {
    c.fillStyle = rng() < 0.6 ? "rgba(48,36,22,0.055)" : "rgba(255,255,255,0.065)";
    c.fillRect(rng() * W, rng() * H, 0.4 + rng() * 1.3, 0.3 + rng() * 0.9);
  }
  for (let i = 0; i < 70; i++) {
    c.fillStyle = "rgba(58,44,28,0.10)";
    c.beginPath();
    c.ellipse(rng() * W, rng() * H, 0.6 + rng() * 1.5, 0.4 + rng() * 1.0, rng() * 6, 0, TAU);
    c.fill();
  }
  return cv;
}
const SHEETS = { warm: null, alarm: null };

/* The plate is not paper. It is a wet blueprint: a flat ground with
   the odd bloom where the wash pooled. */
function layPlate(sheet) {
  X.fillStyle = GROUND; X.fillRect(0, 0, W, H);
  X.save();
  for (let i = 0; i < 14; i++) {
    const r1 = ih(i, sheet, 11), r2 = ih(i, sheet, 23), r3 = ih(i, sheet, 31);
    X.globalAlpha = 0.010 + r3 * 0.012;
    X.fillStyle = r1 < 0.5 ? "#FFFFFF" : "#000000";
    X.beginPath();
    X.ellipse(r1 * W, r2 * H, 70 + r3 * 260, 50 + r1 * 180, r2 * 6, 0, TAU);
    X.fill();
  }
  X.globalAlpha = 0.05;
  X.fillStyle = "#FFFFFF";
  for (let i = 0; i < 900; i++) X.fillRect(ih(i, sheet, 7) * W, ih(i, sheet, 9) * H, 1, 1);
  X.restore();
}

/* The ground does not boil. A new shot is a new sheet — the ink is
   redrawn twelve times a second on the same piece of paper, and paper
   that rearranged its own fibres under a still drawing would be the
   loudest tell on the page. */
function lay(sheet) {
  if (MODE === "cold") { layPlate(sheet); return; }
  const set = SHEETS[MODE === "alarm" ? "alarm" : "warm"];
  X.drawImage(set[sheet % set.length], 0, 0);
}

/* ===================== 5. the ink ===================== */

/* One entry point for every mark. Warm mode runs a dry nib: a filled
   variable-width ribbon with pressure running along it, pooling where
   it lands and lifting on the way out. Cold mode runs a fineliner:
   one dead-even width, no swell, no blot.

   Both wander through the same noise field and the field is shifted
   once per drawn frame, so the ink is redrawn rather than replayed
   while every structural decision about the ship stays exactly where
   it was. The boil is in the ink. It is never in the geometry. */

function resample(pts, step) {
  const out = [pts[0].slice(0, 2)];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let ax = pts[i - 1][0], ay = pts[i - 1][1];
    const bx = pts[i][0], by = pts[i][1];
    let seg = hyp(bx - ax, by - ay);
    let guard = 0;
    while (seg > 1e-6 && acc + seg >= step && guard++ < 4000) {
      const u = (step - acc) / seg;
      ax += (bx - ax) * u; ay += (by - ay) * u;
      out.push([ax, ay]);
      seg = hyp(bx - ax, by - ay); acc = 0;
    }
    acc += seg;
  }
  const L = pts[pts.length - 1], O = out[out.length - 1];
  if (hyp(L[0] - O[0], L[1] - O[1]) > step * 0.3) out.push([L[0], L[1]]);
  return out;
}

function wander(P, amp, seed) {
  const n = P.length;
  if (n < 2 || amp <= 0) return P;
  const Q = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const l = hyp(dx, dy) || 1; dx /= l; dy /= l;
    const w = (vn(i * 0.33, seed * 0.017, seed) - 0.5) * 2 * amp;
    Q[i] = [P[i][0] - dy * w, P[i][1] + dx * w];
  }
  return Q;
}

const _wid = new Map();
function charW(ch, size, weight) {
  const k = ch + "|" + size + "|" + weight;
  let v = _wid.get(k);
  if (v === undefined) { X.font = weight + " " + size + "px " + FONT; v = X.measureText(ch).width; _wid.set(k, v); }
  return v;
}

function stroke(pts, o) {
  o = o || {};
  if (!pts || pts.length < 2) return;
  const col = o.color || INK;
  const w0 = o.w === undefined ? 1.5 : o.w;
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  if (alpha <= 0.004 || w0 <= 0) return;
  const seed = ((o.seed || 0) * 131 + BOIL * 37) | 0;
  const flat = o.flat || !warm();
  const step = flat ? 9 : 5.5;
  let P = resample(pts, step);
  if (P.length < 2) return;

  /* amplitude off the run length, the way a hand's wobble grows with
     the length of the stroke it is trying to keep straight */
  let L = 0;
  for (let i = 1; i < P.length; i++) L += hyp(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  const base = Math.min(2.2, 0.24 + L * 0.0085);
  const amp = base * (o.wobble === undefined ? 1 : o.wobble) * (warm() ? 1 : 0.34);
  P = wander(P, amp, seed);

  X.globalAlpha = alpha;

  if (flat) {
    X.strokeStyle = col;
    X.lineWidth = w0;
    if (o.dash) X.setLineDash(o.dash); else X.setLineDash([]);
    X.beginPath();
    X.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < P.length; i++) X.lineTo(P[i][0], P[i][1]);
    X.stroke();
    X.setLineDash([]);
    X.globalAlpha = 1;
    return;
  }

  /* pressure: one to five swells along the run, off the seed */
  const swells = 1 + (Math.floor(ih(seed, 5, 3) * 5));
  const phase = ih(seed, 9, 4) * TAU;
  const press = o.press === undefined ? 1 : o.press;
  const dry = o.dry === undefined ? 1 : o.dry;
  const n = P.length;
  const hw = new Array(n);
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    let k = 1 + 0.34 * press * sin(u * TAU * swells + phase);
    /* lands heavy, lifts on the way out */
    k *= lerp(1.18, 0.62, u) * 0.5 + 0.62;
    k *= 0.86 + 0.28 * vn(i * 0.5, seed * 0.03 + 40, seed + 5);
    hw[i] = Math.max(0.18, w0 * 0.5 * k);
  }

  /* the nib skips where the paper's tooth beats the wet */
  const runs = [];
  let cur = [];
  for (let i = 0; i < n; i++) {
    const skip = dry > 0 && ih(i, seed, 77) < 0.035 * dry && i > 0 && i < n - 1;
    if (skip) { if (cur.length > 1) runs.push(cur); cur = []; }
    else cur.push(i);
  }
  if (cur.length > 1) runs.push(cur);
  if (!runs.length) runs.push([0, n - 1]);

  X.fillStyle = col;
  for (const run of runs) {
    X.beginPath();
    for (let j = 0; j < run.length; j++) {
      const i = run[j];
      const a = P[Math.max(run[0], i - 1)], b = P[Math.min(run[run.length - 1], i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const l = hyp(dx, dy) || 1; dx /= l; dy /= l;
      const x = P[i][0] - dy * hw[i], y = P[i][1] + dx * hw[i];
      if (j === 0) X.moveTo(x, y); else X.lineTo(x, y);
    }
    for (let j = run.length - 1; j >= 0; j--) {
      const i = run[j];
      const a = P[Math.max(run[0], i - 1)], b = P[Math.min(run[run.length - 1], i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const l = hyp(dx, dy) || 1; dx /= l; dy /= l;
      X.lineTo(P[i][0] + dy * hw[i], P[i][1] - dx * hw[i]);
    }
    X.closePath();
    X.fill();
  }

  /* pooling where the nib landed, filaments down the flanks of a fat mark */
  if (o.pool !== 0 && w0 > 1.1) {
    X.beginPath();
    X.arc(P[0][0], P[0][1], hw[0] * 1.15, 0, TAU);
    X.fill();
  }
  if (w0 > 1.9) {
    X.globalAlpha = alpha * 0.32;
    for (const s of [-1, 1]) {
      X.strokeStyle = col; X.lineWidth = 0.5;
      X.beginPath();
      for (let i = 0; i < n; i++) {
        const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
        let dx = b[0] - a[0], dy = b[1] - a[1];
        const l = hyp(dx, dy) || 1; dx /= l; dy /= l;
        const k = hw[i] * (1 + 0.5 * vn(i * 0.9, seed * 0.05 + s * 11, seed + 3));
        const x = P[i][0] - dy * k * s, y = P[i][1] + dx * k * s;
        if (i === 0) X.moveTo(x, y); else X.lineTo(x, y);
      }
      X.stroke();
    }
  }
  X.globalAlpha = 1;
}

function poly(pts, fill, strokeCol, w, o) {
  if (pts.length < 3) return;
  if (fill) {
    X.globalAlpha = (o && o.fillAlpha !== undefined) ? o.fillAlpha : 1;
    X.fillStyle = fill;
    X.beginPath();
    X.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]);
    X.closePath(); X.fill();
    X.globalAlpha = 1;
  }
  if (strokeCol) stroke(pts.concat([pts[0]]), Object.assign({ color: strokeCol, w: w }, o || {}));
}

function text(s, x, y, o) {
  o = o || {};
  let size = o.size || 15;
  const weight = o.weight || 500;
  let tr = o.tracking === undefined ? size * 0.13 : o.tracking;
  const str = o.lower ? s : String(s).toUpperCase();
  const run = () => { let w = 0; for (const ch of str) w += charW(ch, size, weight) + tr; return w - tr; };
  let wsum = run();
  /* one estimator, both targets: a line never overruns its cell. A
     title block that lets the designation run into the yard's name is
     a title block nobody at a desk would have signed off. */
  if (o.max && wsum > o.max) { const k = o.max / wsum; size *= k; tr *= k; wsum = run(); }
  if (o.measure) return wsum;
  let cx = o.anchor === "end" ? x - wsum : o.anchor === "middle" ? x - wsum / 2 : x;
  X.save();
  X.font = weight + " " + size + "px " + FONT;
  X.fillStyle = o.color || INK;
  X.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  const jit = warm() ? 0.42 : 0.14;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const jx = (vn(i * 1.7, BOIL * 0.31, 991) - 0.5) * jit;
    const jy = (vn(i * 1.7 + 50, BOIL * 0.31, 993) - 0.5) * jit;
    X.fillText(ch, cx + jx, y + jy);
    cx += charW(ch, size, weight) + tr;
  }
  X.restore();
  return wsum;
}

/* ===================== 6. drafting chrome ===================== */

/* Four corner marks and nothing joining them. They sit outside
   everything the scene repaints, so a frame never wipes them. */
function cornerTicks(a) {
  const m = U * 0.030, tk = U * 0.021, w = warm() ? 2.0 : 1.5;
  const o = { color: INK, w: w, alpha: a === undefined ? 1 : a, seed: 4 };
  stroke([[m, m + tk], [m, m], [m + tk, m]], o);
  stroke([[W - m - tk, m], [W - m, m], [W - m, m + tk]], o);
  stroke([[m, H - m - tk], [m, H - m], [m + tk, H - m]], o);
  stroke([[W - m - tk, H - m], [W - m, H - m], [W - m, H - m - tk]], o);
}

/* A label sits under a rule the full width of its cell, in tracked
   caps. It is not a caption and it is not a heading. */
function plateLabel(s, x, y, wCell, o) {
  o = o || {};
  stroke([[x, y], [x + wCell, y]], { color: INK, w: 1.5, alpha: o.alpha, seed: 7 });
  text(s, x, y + U * 0.030, { size: U * 0.0185, weight: 600, tracking: U * 0.0032, color: INK, alpha: o.alpha });
}

/* Left of the divider, who she is. Right, whose drawing it is. Under
   the rule, five ruled columns of metric. CREW reads NIL, never 0. */
function titleBlock(rows, right, a) {
  const m = U * 0.055;
  const bw = U * 0.50, bh = U * 0.128;
  const bx = W - m - bw, by = H - m - bh;
  const pad = bw * 0.026, div = bx + bw * 0.655, rMet = by + bh * 0.62;
  const lw1 = div - bx - pad * 2, rw1 = bx + bw - pad - (div + pad * 0.6);
  X.globalAlpha = (a === undefined ? 1 : a) * 0.90;
  X.fillStyle = GROUND; X.fillRect(bx, by, bw, bh);
  X.globalAlpha = 1;
  const o = { color: INK, alpha: a, seed: 12 };
  stroke([[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh], [bx, by]], Object.assign({ w: 1.7 }, o));
  stroke([[bx, rMet], [bx + bw, rMet]], Object.assign({ w: 1.3 }, o));
  stroke([[div, by], [div, rMet]], Object.assign({ w: 1.1 }, o));

  text(rows[0], bx + pad, by + bh * 0.25, { size: bh * 0.185, weight: 700, tracking: bh * 0.020, color: INK, alpha: a, max: lw1 });
  text(rows[1], bx + pad, by + bh * 0.40, { size: bh * 0.092, weight: 500, tracking: bh * 0.013, color: INK, alpha: a, max: lw1 });
  text(rows[2], bx + pad, by + bh * 0.53, { size: bh * 0.092, weight: 500, tracking: bh * 0.013, color: DIM, alpha: a, max: lw1 });

  text(right[0], bx + bw - pad, by + bh * 0.23, { size: bh * 0.100, weight: 600, tracking: bh * 0.020, color: INK, anchor: "end", alpha: a, max: rw1 });
  text(right[1], bx + bw - pad, by + bh * 0.39, { size: bh * 0.100, weight: 500, tracking: bh * 0.020, color: INK, anchor: "end", alpha: a, max: rw1 });
  text(right[2], bx + bw - pad, by + bh * 0.54, { size: bh * 0.085, weight: 500, tracking: bh * 0.015, color: DIM, anchor: "end", alpha: a, max: rw1 });

  const cols = rows[3];
  const colW = (bw - pad * 2) / cols.length;
  cols.forEach((c, i) => {
    const cx = bx + pad + colW * i;
    if (i) stroke([[cx - pad * 0.6, rMet], [cx - pad * 0.6, by + bh]], Object.assign({ w: 1.0 }, o));
    text(c[0], cx, by + bh * 0.775, { size: bh * 0.088, weight: 500, tracking: bh * 0.015, color: DIM, alpha: a, max: colW - pad });
    text(c[1], cx, by + bh * 0.925, { size: bh * 0.125, weight: 600, tracking: bh * 0.010, color: INK, alpha: a, max: colW - pad });
  });
  return { x: bx, y: by, w: bw, h: bh };
}

/* Scale given twice: once as a ruler, once as a body. The figure is
   1.8 m and at this scale it is four pixels tall, which is the whole
   argument. */
function scaleBar(x, y, px, label, a, figure) {
  const o = { color: INK, w: 1.5, alpha: a, seed: 19 };
  stroke([[x, y], [x + px, y]], o);
  for (let i = 0; i <= 4; i++) stroke([[x + px * i / 4, y], [x + px * i / 4, y - (i % 2 ? U * 0.009 : U * 0.016)]], o);
  text("0", x, y + U * 0.024, { size: U * 0.0155, weight: 500, tracking: U * 0.002, color: INK, alpha: a });
  text(label, x + px, y + U * 0.024, { size: U * 0.0155, weight: 500, tracking: U * 0.002, color: INK, anchor: "end", alpha: a });
  if (!figure) return;
  const fx = x + px + U * 0.055, fh = figure.h, fw = Math.max(1.4, fh * 0.26);
  poly([[fx - fw * 0.5, y], [fx - fw * 0.5, y - fh * 0.52], [fx - fw * 0.85, y - fh * 0.78],
  [fx - fw * 0.35, y - fh * 0.80], [fx, y - fh * 0.62], [fx + fw * 0.35, y - fh * 0.80],
  [fx + fw * 0.85, y - fh * 0.78], [fx + fw * 0.5, y - fh * 0.52], [fx + fw * 0.5, y]],
    INK, null, 0, { fillAlpha: a === undefined ? 1 : a });
  X.globalAlpha = a === undefined ? 1 : a;
  X.fillStyle = INK; X.beginPath(); X.arc(fx, y - fh * 0.92, Math.max(0.9, fh * 0.11), 0, TAU); X.fill();
  X.globalAlpha = 1;
  text(figure.label, fx, y + U * 0.024, { size: U * 0.014, weight: 500, tracking: U * 0.0018, color: INK, anchor: "middle", alpha: a });
}

/* ===================== 7. tactical geometry ===================== */

const CHAIN = [U * 0.016, U * 0.007, U * 0.004, U * 0.007];  /* ISO chain line */

function ring(cx, cy, r, o) {
  const n = Math.max(28, Math.round(r * 0.42));
  const p = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU; p.push([cx + cos(a) * r, cy + sin(a) * r]); }
  stroke(p, o);
}

function arc(cx, cy, r, a0, a1, o) {
  const n = Math.max(8, Math.round(abs(a1 - a0) * r * 0.10));
  const p = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + cos(a) * r, cy + sin(a) * r]); }
  stroke(p, o);
  return p;
}

/* Range rings, labelled on the 045 radial the way a plot labels them. */
function rangeRings(cx, cy, step, n, unit, o) {
  for (let i = 1; i <= n; i++) {
    const r = step * i;
    ring(cx, cy, r, { color: INK, w: 1.0, alpha: (o.alpha || 1) * (i === n ? 0.9 : 0.55), dash: i % 2 ? CHAIN : null, seed: 30 + i });
    const a = -PI * 0.25;
    text((i * (o.per || 20)) + " " + unit, cx + cos(a) * r + 6, cy + sin(a) * r - 5,
      { size: U * 0.0125, weight: 500, tracking: U * 0.0022, color: DIM, alpha: (o.alpha || 1) * 0.85 });
  }
}

/* Coordinate ticks walk the inside of the sheet: a short mark every
   five degrees of the plot, a long one and a bearing every thirty. */
function coordTicks(cx, cy, r, a) {
  for (let d = 0; d < 360; d += 5) {
    const th = (d - 90) * PI / 180;
    const long = d % 30 === 0;
    const r0 = r, r1 = r + (long ? U * 0.020 : U * 0.009);
    stroke([[cx + cos(th) * r0, cy + sin(th) * r0], [cx + cos(th) * r1, cy + sin(th) * r1]],
      { color: long ? INK : DIM, w: long ? 1.3 : 0.9, alpha: a, seed: 40 + d });
    if (long) {
      const rr = r1 + U * 0.019;
      text(String(d).padStart(3, "0"), cx + cos(th) * rr, cy + sin(th) * rr + U * 0.006,
        { size: U * 0.0125, weight: 500, tracking: U * 0.0022, color: DIM, anchor: "middle", alpha: a });
    }
  }
}

/* A callout is a node, a kinked leader and a line of tracked caps.
   It draws itself on rather than appearing. */
function callout(x, y, dx, dy, lines, o) {
  o = o || {};
  const rev = clamp(o.reveal === undefined ? 1 : o.reveal, 0, 1);
  if (rev <= 0.01) return;
  const col = o.color || INK;

  /* A leader that walks its label off the sheet is worse than no
     leader. Measure the block, and if the side it wants does not fit,
     take the other one. */
  const sz = U * 0.0145, tr = U * 0.0025;
  let wmax = 0;
  for (let i = 0; i < lines.length; i++) wmax = Math.max(wmax, text(lines[i], 0, 0, { size: i ? U * 0.0125 : sz, tracking: tr, measure: true }));
  const marg = U * 0.055;
  const tailLen = o.tail === undefined ? U * 0.055 : o.tail;
  if (dx >= 0 && x + dx + tailLen + wmax > W - marg) dx = -Math.abs(dx);
  else if (dx < 0 && x + dx - tailLen - wmax < marg) dx = Math.abs(dx);
  let kx = x + dx;
  if (dx >= 0) kx = Math.min(kx, W - marg - tailLen - wmax);
  else kx = Math.max(kx, marg + tailLen + wmax);
  const ky = clamp(y + dy, marg + U * 0.020, H - marg - U * 0.050);
  const tail = tailLen * (dx < 0 ? -1 : 1);
  const path = [[x, y], [kx, ky], [kx + tail, ky]];
  /* the leader draws on: cut the path at the revealed length */
  let tot = 0; const segs = [];
  for (let i = 1; i < path.length; i++) { const l = hyp(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]); segs.push(l); tot += l; }
  let want = tot * rev, out = [path[0]];
  for (let i = 0; i < segs.length; i++) {
    if (want >= segs[i]) { out.push(path[i + 1]); want -= segs[i]; }
    else { const u = want / (segs[i] || 1); out.push([lerp(path[i][0], path[i + 1][0], u), lerp(path[i][1], path[i + 1][1], u)]); want = 0; break; }
  }
  stroke(out, { color: col, w: 1.1, alpha: o.alpha, seed: o.seed || 51 });
  X.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  X.fillStyle = col; X.beginPath(); X.arc(x, y, 2.6, 0, TAU); X.fill();
  X.globalAlpha = 1;
  if (rev > 0.92) {
    const anchor = dx < 0 ? "end" : "start";
    const tx = kx + tail * 1.02;
    lines.forEach((ln, i) => {
      text(ln, tx, ky - U * 0.006 + i * U * 0.019,
        { size: i ? U * 0.0125 : sz, weight: i ? 500 : 600, tracking: tr, color: i ? DIM : col, anchor: anchor, alpha: o.alpha });
    });
  }
}

/* Four uprights and a diagonal. A tally is how a plot counts things
   it has not had time to name. */
function tally(x, y, n, o) {
  o = o || {};
  const h = o.h || U * 0.020, gap = o.gap || U * 0.0072, grp = o.grp || U * 0.016;
  let cx = x;
  for (let g = 0; g * 5 < n; g++) {
    const inGrp = Math.min(5, n - g * 5);
    for (let i = 0; i < Math.min(4, inGrp); i++) {
      stroke([[cx + i * gap, y], [cx + i * gap + h * 0.10, y - h]], { color: o.color || INK, w: 1.5, alpha: o.alpha, seed: 60 + g * 7 + i });
    }
    if (inGrp === 5) stroke([[cx - gap * 0.45, y - h * 0.92], [cx + gap * 3.5, y + h * 0.10]], { color: o.color || INK, w: 1.5, alpha: o.alpha, seed: 70 + g });
    cx += gap * 4 + grp;
  }
  return cx - x;
}

/* A dimension line: two witness ticks, a run between them with arrow
   terminators, and the figure sitting on the run. */
function dimension(x0, y0, x1, y1, label, o) {
  o = o || {};
  const col = o.color || DIM;
  let dx = x1 - x0, dy = y1 - y0; const l = hyp(dx, dy) || 1; dx /= l; dy /= l;
  stroke([[x0, y0], [x1, y1]], { color: col, w: 1.0, alpha: o.alpha, seed: 80 });
  const a = U * 0.008;
  for (const [px, py, s] of [[x0, y0, 1], [x1, y1, -1]]) {
    stroke([[px + (dx * s - dy) * a, py + (dy * s + dx) * a], [px, py], [px + (dx * s + dy) * a, py + (dy * s - dx) * a]],
      { color: col, w: 1.0, alpha: o.alpha, seed: 81 });
    stroke([[px - dy * a * 1.5, py + dx * a * 1.5], [px + dy * a * 1.5, py - dx * a * 1.5]],
      { color: col, w: 0.9, alpha: o.alpha, seed: 82 });
  }
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const wd = text(label, 0, 0, { size: U * 0.0135, measure: true });
  X.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  X.fillStyle = GROUND; X.fillRect(mx - wd / 2 - 4, my - U * 0.014, wd + 8, U * 0.020);
  X.globalAlpha = 1;
  text(label, mx, my, { size: U * 0.0135, weight: 500, tracking: U * 0.0022, color: col, anchor: "middle", alpha: o.alpha });
}

/* A small ruled box with its own subject inside it. A plot keeps one
   of these open on whatever it is not looking at. */
function inset(x, y, w, h, title, a, body) {
  X.globalAlpha = (a === undefined ? 1 : a) * 0.92;
  X.fillStyle = GROUND; X.fillRect(x, y, w, h);
  X.globalAlpha = 1;
  stroke([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]], { color: INK, w: 1.3, alpha: a, seed: 90 });
  stroke([[x, y + U * 0.026], [x + w, y + U * 0.026]], { color: INK, w: 1.0, alpha: a, seed: 91 });
  text(title, x + U * 0.010, y + U * 0.018, { size: U * 0.0128, weight: 600, tracking: U * 0.0026, color: INK, alpha: a });
  X.save();
  X.beginPath(); X.rect(x + 1, y + U * 0.027, w - 2, h - U * 0.028); X.clip();
  body(x, y + U * 0.027, w, h - U * 0.028);
  X.restore();
}

/* ===================== 8. bodies ===================== */

function camera(o) {
  const yaw = o.yaw || 0, pitch = o.pitch || 0, s = o.scale || 1;
  const cx = o.cx === undefined ? W / 2 : o.cx, cy = o.cy === undefined ? H / 2 : o.cy;
  const cyw = cos(yaw), syw = sin(yaw), cp = cos(pitch), sp = sin(pitch);
  return {
    s: s,
    project(p) {
      const x = p[0] * cyw - p[2] * syw;
      const z = p[0] * syw + p[2] * cyw;
      const y = p[1] * cp - z * sp;
      const d = z * cp + p[1] * sp;
      return [cx + x * s, cy - y * s, d];
    }
  };
}

function place(o) {
  const cy = cos(o.yaw || 0), sy = sin(o.yaw || 0);
  const cr = cos(o.roll || 0), sr = sin(o.roll || 0);
  const cp = cos(o.pitch || 0), sp = sin(o.pitch || 0);
  const k = o.k === undefined ? 1 : o.k;
  return p => {
    let px = p[0] * k, py = p[1] * k, pz = p[2] * k;
    let t;
    t = py * cr - pz * sr; pz = py * sr + pz * cr; py = t;
    t = px * cp - py * sp; py = px * sp + py * cp; px = t;
    t = px * cy - pz * sy; pz = px * sy + pz * cy; px = t;
    return [px + (o.x || 0), py + (o.y || 0), pz + (o.z || 0)];
  };
}

/* A body is a chain of stations [x,y,z,r]. Rings are circles of that
   radius in the plane normal to the local spine. The fill is the
   depth buffer: lay the whole silhouette down in ground first, then
   only draw the half of every frame and stringer that faces us, and
   nothing behind shows through. Crude next to real hidden-line
   removal, and indistinguishable at this size. */
const RN = 16;

/* A warship is not a cylinder. The section is a superellipse squashed
   in one axis and stretched in the other, so a hull comes out with a
   deck on top and a chine down each flank — and a cylinder, when you
   want one, is just e = 2 with both scales at one. */
function secPt(th, e) {
  const c = cos(th), s = sin(th), p = 2 / e;
  return [Math.sign(c) * Math.pow(abs(c), p), Math.sign(s) * Math.pow(abs(s), p)];
}

function bodyRings(sts, xf, sec) {
  const e = (sec && sec.e) || 2, ky = (sec && sec.ky) || 1, kz = (sec && sec.kz) || 1;
  const rings = [];
  for (let i = 0; i < sts.length; i++) {
    const s = sts[i];
    const a = sts[Math.max(0, i - 1)], b = sts[Math.min(sts.length - 1, i + 1)];
    const d = norm([b[0] - a[0], b[1] - a[1], b[2] - a[2]]);
    const up = abs(d[1]) > 0.92 ? [0, 0, 1] : [0, 1, 0];
    const u = norm(cross(d, up)), v = cross(d, u);   /* u lateral, v vertical */
    const R = [];
    const c = xf([s[0], s[1], s[2]]);
    for (let k = 0; k < RN; k++) {
      const th = k / RN * TAU;
      const sp = secPt(th, e);
      const a2 = sp[0] * kz, b2 = sp[1] * ky;
      const nx = u[0] * a2 + v[0] * b2;
      const ny = u[1] * a2 + v[1] * b2;
      const nz = u[2] * a2 + v[2] * b2;
      const p = xf([s[0] + nx * s[3], s[1] + ny * s[3], s[2] + nz * s[3]]);
      /* the normal has to turn with the ship or the terminator sits
         still while the hull rotates under it, which is the tell */
      const q = xf([s[0] + nx, s[1] + ny, s[2] + nz]);
      R.push({ p: p, n: norm(sub(q, c)) });
    }
    R.c = c;
    R.r = s[3];
    rings.push(R);
  }
  return rings;
}

const LIGHT = norm([-0.55, 0.72, 0.42]);

function drawBody(sts, xf, cam, o) {
  o = o || {};
  const rings = bodyRings(sts, xf, o.sec);
  const PR = rings.map(R => {
    const q = R.map(m => ({ s: cam.project(m.p), n: m.n }));
    q.c = cam.project(R.c);
    return q;
  });
  const col = o.color || INK;
  const lw = o.w === undefined ? 1.6 : o.w;

  /* 1. the silhouette, as one path, filled once */
  const path = new Path2D();
  for (let i = 0; i < PR.length - 1; i++) {
    const A = PR[i], B = PR[i + 1];
    path.moveTo(A[0].s[0], A[0].s[1]);
    for (let k = 1; k < RN; k++) path.lineTo(A[k].s[0], A[k].s[1]);
    for (let k = RN - 1; k >= 0; k--) path.lineTo(B[k].s[0], B[k].s[1]);
    path.closePath();
  }
  const fa = o.fillAlpha === undefined ? (warm() ? 0.90 : 0.80) : o.fillAlpha;
  if (fa > 0) {
    X.globalAlpha = fa;
    /* not flat ground: a hull carries the faintest wash of its own ink,
       or it reads as a hole cut in the paper rather than a mass on it */
    X.fillStyle = o.fill || (warm() ? WASH : GROUND);
    X.fill(path, "nonzero");
    X.globalAlpha = 1;
    if (warm() && o.hatch) {
      /* a flat field with speckle on it is the easiest thing on the
         sheet to spot as printed: put the tooth back inside the hull */
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const R of PR) for (const m of R) {
        if (m.s[0] < x0) x0 = m.s[0]; if (m.s[0] > x1) x1 = m.s[0];
        if (m.s[1] < y0) y0 = m.s[1]; if (m.s[1] > y1) y1 = m.s[1];
      }
      X.save(); X.clip(path, "nonzero");
      X.globalAlpha = 0.10; X.fillStyle = INK;
      for (let i = 0; i < 140; i++) {
        X.fillRect(x0 + vn(i * 0.71, BOIL * 0.2, 301) * (x1 - x0),
          y0 + vn(i * 0.71 + 30, BOIL * 0.2, 303) * (y1 - y0), 1.1, 0.9);
      }
      X.globalAlpha = 1; X.restore();
    }
  }

  /* 2. hatching, cut in the surface's own parameter space and kept on
        the hull by the same path. Ordered dither over the slot index,
        so density steps rather than fades. */
  if (o.hatch) {
    X.save(); X.clip(path, "nonzero");
    for (let k = 0; k < RN; k++) {
      const tone = clamp(0.5 + 0.5 * dot(rings[0][k].n, LIGHT), 0, 1);
      const th = 0.40 + ((k * 7) % 5) * 0.080;
      if (tone > th) continue;
      const line = [];
      for (let i = 0; i < PR.length; i++) line.push(PR[i][k].s);
      const hwid = warm() ? 1.4 : 0.95;
      stroke(line, { color: col, w: hwid, alpha: (o.hatchAlpha || 0.85) * (1 - tone), flat: true, seed: 110 + k });
      /* the darkest pass gets a second family laid between the first,
         which is how a hatch gets darker without getting thicker */
      if (tone < 0.30) {
        const k2 = (k + 1) % RN, l2 = [];
        for (let i = 0; i < PR.length; i++) l2.push([(PR[i][k].s[0] + PR[i][k2].s[0]) / 2, (PR[i][k].s[1] + PR[i][k2].s[1]) / 2]);
        stroke(l2, { color: col, w: hwid * 0.8, alpha: (o.hatchAlpha || 0.85) * 0.7, flat: true, seed: 130 + k });
      }
    }
    X.restore();
  }

  /* 3. the outline: the top and bottom envelope of the projected rings */
  const top = [], bot = [];
  for (const R of PR) {
    let a = R[0].s, b = R[0].s;
    for (const m of R) { if (m.s[1] < a[1]) a = m.s; if (m.s[1] > b[1]) b = m.s; }
    top.push(a); bot.push(b);
  }
  const so = { color: col, w: lw, alpha: o.alpha, seed: o.seed || 140, dry: o.dry, press: o.press };
  stroke(top, so);
  stroke(bot, so);
  /* close the ends on the near half of the end rings. Depth runs the
     one way throughout: a larger d is nearer the eye, which is also
     why drawShip sorts ascending and lays the far bodies down first. */
  for (const idx of [0, PR.length - 1]) {
    const R = PR[idx], p = [];
    for (let k = 0; k <= RN; k++) { const m = R[k % RN]; if (m.s[2] >= R.c[2]) p.push(m.s); else { if (p.length > 1) stroke(p, so); p.length = 0; } }
    if (p.length > 1) stroke(p, so);
  }

  /* 4. frames, near half only */
  if (o.frames !== false) {
    for (let i = 1; i < PR.length - 1; i++) {
      const R = PR[i], p = [];
      for (let k = 0; k <= RN; k++) {
        const m = R[k % RN];
        if (m.s[2] >= R.c[2]) p.push(m.s);
        else { if (p.length > 1) stroke(p, { color: col, w: lw * 0.55, alpha: (o.alpha === undefined ? 1 : o.alpha) * 0.8, seed: 150 + i }); p.length = 0; }
      }
      if (p.length > 1) stroke(p, { color: col, w: lw * 0.55, alpha: (o.alpha === undefined ? 1 : o.alpha) * 0.8, seed: 150 + i });
    }
  }

  /* 5. stringers */
  for (const k of [0, RN >> 2, RN >> 1, (RN * 3) >> 2]) {
    const p = [];
    for (let i = 0; i < PR.length; i++) {
      const m = PR[i][k];
      if (m.s[2] >= PR[i].c[2]) p.push(m.s);
      else { if (p.length > 1) stroke(p, { color: col, w: lw * 0.45, alpha: (o.alpha === undefined ? 1 : o.alpha) * 0.7, seed: 170 + k }); p.length = 0; }
    }
    if (p.length > 1) stroke(p, { color: col, w: lw * 0.45, alpha: (o.alpha === undefined ? 1 : o.alpha) * 0.7, seed: 170 + k });
  }

  return { rings: PR, depth: PR[(PR.length / 2) | 0].c[2] };
}

/* ===================== 9. the two ships ===================== */

/* BATELEUR. A crown ship is a keel with masses berthed along it, a
   tower forward of amidships, four barbettes on the dorsal deck and
   a lance the length of her. Everything in metres; she is 380 of
   them, bow at +190. */
const SEC = {
  hull: { e: 3.4, ky: 0.62, kz: 1.22 },   /* deck on top, chine down each flank */
  block: { e: 4.2, ky: 0.80, kz: 0.95 },
  tube: { e: 2.0, ky: 1.00, kz: 1.00 },
  fin: { e: 4.0, ky: 1.00, kz: 0.07 },   /* a plate, seen edge-on from abeam */
  grown: { e: 2.3, ky: 1.10, kz: 0.86 }
};

function crown() {
  const B = [];
  /* the keel: a long flat mass, full amidships, cut to a wedge forward */
  const prof = [[-192, 10], [-178, 30], [-152, 38], [-112, 42], [-58, 44], [-6, 42], [46, 37], [98, 30], [140, 21], [172, 11], [192, 3]];
  B.push({ sts: prof.map(([x, r]) => [x, 0, 0, r]), hatch: true, w: 2.2, sec: SEC.hull, key: "hull" });

  /* the two flanking masses — a crown berths more than one hull, and
     the link is drawn because a link that is not drawn reads floating */
  for (const s of [-1, 1]) {
    B.push({
      sts: [[-158, -14, s * 52, 5], [-126, -14, s * 56, 17], [-56, -14, s * 58, 20], [16, -14, s * 56, 16], [68, -14, s * 52, 5]],
      hatch: true, w: 1.6, sec: SEC.hull, key: "pod"
    });
    B.push({ sts: [[-96, -10, s * 26, 5], [-96, -12, s * 50, 5]], hatch: false, w: 1.3, sec: SEC.tube, frames: false, key: "link" });
    B.push({ sts: [[-8, -10, s * 24, 5], [-8, -12, s * 48, 5]], hatch: false, w: 1.3, sec: SEC.tube, frames: false, key: "link" });
    /* radiator vanes: swept aft off the quarter, and the only part of
       her that is a plate rather than a mass */
    B.push({ sts: [[-132, 20, s * 16, 7], [-172, 52, s * 18, 19], [-214, 82, s * 20, 8]], hatch: true, w: 1.4, sec: SEC.fin, key: "vane" });
  }

  /* bridge tower, forward of amidships and narrow across */
  B.push({ sts: [[-50, 22, 0, 20], [-46, 44, 0, 17], [-42, 70, 0, 12], [-40, 88, 0, 5]], hatch: true, w: 1.7, sec: SEC.block, key: "tower" });
  B.push({ sts: [[-40, 88, 0, 1.6], [-38, 122, 0, 1.0]], hatch: false, w: 1.0, sec: SEC.tube, frames: false, key: "mast" });

  /* the dorsal rail the barbettes stand on */
  B.push({ sts: [[-150, 24, 0, 6], [0, 26, 0, 7], [140, 23, 0, 5]], hatch: false, w: 1.2, sec: SEC.block, frames: false, key: "rail" });

  /* four barbettes, each with a twin mount */
  for (const bx of [-124, -80, 20, 78]) {
    B.push({ sts: [[bx, 22, 0, 15], [bx, 40, 0, 16], [bx, 50, 0, 13]], hatch: true, w: 1.4, sec: SEC.tube, key: "barbette" });
    for (const s of [-1, 1]) B.push({ sts: [[bx, 47, s * 6, 2.6], [bx + 42, 47, s * 6, 2.0]], hatch: false, w: 1.2, sec: SEC.tube, frames: false, key: "barrel" });
  }

  /* the spinal lance runs inside her, and only the muzzle is outboard.
     In blueprint mode the hull goes to a ghost and you read it straight
     through her, which is the whole reason it is drawn inside. */
  B.push({ sts: [[-140, 2, 0, 9], [60, 2, 0, 9], [160, 2, 0, 8], [196, 2, 0, 10], [206, 2, 0, 5]], hatch: false, w: 1.6, sec: SEC.tube, key: "lance" });

  /* engine bells */
  for (const s of [-1, 1]) {

  }
  B.push({ sts: [[-192, 4, 0, 12], [-206, 4, 0, 16]], hatch: true, w: 1.4, sec: SEC.tube, key: "bell" });
