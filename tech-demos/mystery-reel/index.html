<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Mystery Reel — city fingerprints</title>
  <style>
    :root {
      --bg: #0c0d0b;
      --panel: #161712;
      --ink: #e8e2d2;
      --mute: #9a937f;
      --line: #3a382e;
      --accent: #d8a15a;
      --flash: #f0d59a;
      --pad: max(16px, env(safe-area-inset-left));
      --pad-r: max(16px, env(safe-area-inset-right));
      --pad-b: max(20px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    body {
      padding: 16px var(--pad-r) var(--pad-b) var(--pad);
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .lede {
      color: var(--mute);
      font-size: 14px;
      margin: 0 0 16px;
    }
    .stage {
      position: relative;
      background: var(--panel);
      border: 2px solid var(--line);
      padding: 10px;
    }
    #c {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      background: #111;
      touch-action: manipulation;
      cursor: pointer;
    }
    .paused {
      position: absolute;
      inset: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(12, 13, 11, 0.42);
    }
    .paused[hidden] { display: none; }
    .paused span {
      min-height: 56px;
      min-width: 200px;
      padding: 16px 22px;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #1a140c;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }
    button {
      font: inherit;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 52px;
      min-width: 52px;
      padding: 12px 16px;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #1a140c;
      cursor: pointer;
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: var(--flash); border-color: var(--flash); }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .time {
      color: var(--mute);
      letter-spacing: 0.08em;
      font-size: 14px;
      min-height: 52px;
      display: flex;
      align-items: center;
      margin-left: auto;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
      margin: 0 0 6px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 44px;
      background: transparent;
      margin: 0 0 8px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      background: var(--line);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 44px;
      margin-top: -18px;
      background: var(--accent);
      border: 2px solid #1a140c;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      background: var(--line);
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 44px;
      background: var(--accent);
      border: 2px solid #1a140c;
      border-radius: 0;
      cursor: pointer;
    }
    .status {
      color: var(--mute);
      font-size: 13px;
      min-height: 1.3em;
      margin: 0 0 8px;
    }
    a { color: var(--accent); }
    footer {
      margin-top: 20px;
      color: var(--mute);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Mystery Reel</h1>
  <p class="lede">Why some city grids look like fingerprints from above. Tap the picture or press space.</p>

  <div class="stage">
    <canvas id="c" width="1080" height="1080" aria-label="Mystery reel film"></canvas>
    <div class="paused" id="paused" hidden><span>Tap to play</span></div>
  </div>

  <div class="row">
    <button type="button" id="play">Pause</button>
    <button type="button" class="ghost" id="restart">Restart</button>
    <span class="time" id="time">0:00 / 1:04</span>
  </div>
  <label for="scrub">Scrub</label>
  <input id="scrub" type="range" min="0" max="640" value="0" step="1">
  <p class="status" id="status">Playing.</p>

  <footer>
    Inspired by <a href="https://x.com/emollick/status/2100767116819325141">Ethan Mollick’s bookmark</a>.
    Open this file — no build. <a href="README.md">The mystery and how to run it</a>.
  </footer>

<script>
"use strict";
/* =============================================================================
   Mystery Reel — 64.0s, 1080×1080, Canvas 2D, no assets.
   Mystery: why do some city grids look like fingerprints from above?
   Dual mode: warm paper/ink vs cold navy plate. Hard cuts. No fades.

   Numbered beats
   01  0.00–1.80  RIDGE CLOSE     warm  three ridges at monument scale
   02  1.80–5.40  THE PRINT       warm  hard cut wide — a fingerprint
   03  5.40–10.2  THE CITY        warm  match-cut: same ridges, now streets
   04  10.2–17.2  PATH TRACE      warm  viz 1 — walk ring 3 (EXAMPLE DATA)
   05  17.2–24.4  SCALE + DUAL    mix   intersection close-up; A/B heartbeat
   06  24.4–31.2  THE PLAN        cold  hard cut — a ruler city
   07  31.2–41.2  SCATTER         cold  viz 2 — entropy vs plan year
   08  41.2–51.2  BARS            warm  viz 3 — two orientation roses
   09  51.2–56.6  OVERLAY         mix   print sits on the city; grid refuses it
   10  56.6–64.0  END CARD        warm  title, one-line guess, credit
   ============================================================================= */

var W = 1080, H = 1080;
var DURATION = 64;
var FPS = 12;
var TAU = Math.PI * 2;

var WARM = {
  bg: "#E4DFD5", ink: "#17120E", dim: "#6E665C", rule: "#C7BFB2",
  accent: "#8B3A1A", paper: "#E4DFD5"
};
var COLD = {
  bg: "#0E2E52", ink: "#D9E6F2", dim: "#7A93A8", rule: "#2A4A6E",
  accent: "#85C794", paper: "#0E2E52"
};

var CITIES = [
  { name: "WHORL", year: 1284, ent: 0.92, kind: "ring" },
  { name: "RIDGEPORT", year: 1390, ent: 0.88, kind: "ring" },
  { name: "OLD HARBOR", year: 1512, ent: 0.84, kind: "ring" },
  { name: "THIS CITY", year: 1460, ent: 0.86, kind: "ring", hero: true },
  { name: "CANAL BELT", year: 1613, ent: 0.79, kind: "ring" },
  { name: "MARKET RING", year: 1688, ent: 0.73, kind: "ring" },
  { name: "WALL TOWN", year: 1740, ent: 0.68, kind: "ring" },
  { name: "NEW RECT", year: 1811, ent: 0.21, kind: "grid" },
  { name: "GRIDON", year: 1856, ent: 0.16, kind: "grid" },
  { name: "SHEET 12", year: 1899, ent: 0.13, kind: "grid" },
  { name: "RULER CITY", year: 1934, ent: 0.11, kind: "grid" },
  { name: "PLANO", year: 1958, ent: 0.08, kind: "grid" }
];
var BINS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
var RING_BARS = [18, 16, 14, 17, 19, 15, 16, 20];
var GRID_BARS = [4, 2, 42, 3, 5, 2, 40, 3];

function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function holdSin(t, p) {
  var s = Math.sin(clamp(t, 0, 1) * Math.PI);
  return Math.pow(Math.abs(s), p == null ? 0.45 : p);
}
function fmtTime(s) {
  s = Math.max(0, Math.min(DURATION, s));
  var m = Math.floor(s / 60);
  var r = Math.floor(s % 60);
  return m + ":" + (r < 10 ? "0" : "") + r;
}

function tracked(ctx, str, x, y, opt) {
  opt = opt || {};
  var size = opt.size || 28;
  var track = opt.track != null ? opt.track : 0.1;
  var align = opt.align || "left";
  ctx.font = (opt.weight || "600") + " " + size + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  ctx.fillStyle = opt.color;
  ctx.textBaseline = opt.base || "alphabetic";
  var spacing = size * track;
  var w = 0;
  var i;
  for (i = 0; i < str.length; i++) w += ctx.measureText(str[i]).width + spacing;
  if (str.length) w -= spacing;
  var cx = x;
  if (align === "center") cx = x - w / 2;
  if (align === "right") cx = x - w;
  for (i = 0; i < str.length; i++) {
    ctx.fillText(str[i], cx, y);
    cx += ctx.measureText(str[i]).width + spacing;
  }
  return w;
}

function bakePaper(seed) {
  var rng = mulberry32(seed);
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var g = c.getContext("2d");
  g.fillStyle = WARM.bg;
  g.fillRect(0, 0, W, H);
  var i, x, y, a;
  for (i = 0; i < 18; i++) {
    x = rng() * W; y = rng() * H;
    a = 0.035 + rng() * 0.04;
    g.fillStyle = "rgba(190,170,140," + a + ")";
    g.beginPath();
    g.ellipse(x, y, 80 + rng() * 160, 50 + rng() * 110, rng() * TAU, 0, TAU);
    g.fill();
  }
  g.strokeStyle = "rgba(70,55,40,0.045)";
  g.lineWidth = 1;
  for (i = 0; i < 1400; i++) {
    x = rng() * W; y = rng() * H;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + (rng() - 0.5) * 18, y + (rng() - 0.35) * 6);
    g.stroke();
  }
  for (i = 0; i < 900; i++) {
    g.fillStyle = "rgba(40,30,20," + (0.04 + rng() * 0.08) + ")";
    g.fillRect(rng() * W, rng() * H, 1 + rng() * 2, 1 + rng() * 2);
  }
  return c;
}

function bakePlate() {
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var g = c.getContext("2d");
  g.fillStyle = COLD.bg;
  g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(217,230,242,0.07)";
  var x, y;
  for (x = 40; x < W; x += 36) {
    for (y = 40; y < H; y += 36) g.fillRect(x, y, 2, 2);
  }
  g.strokeStyle = "rgba(217,230,242,0.08)";
  g.lineWidth = 1;
  g.beginPath();
  for (x = 40; x < W; x += 108) { g.moveTo(x, 40); g.lineTo(x, H - 40); }
  for (y = 40; y < H; y += 108) { g.moveTo(40, y); g.lineTo(W - 40, y); }
  g.stroke();
  return c;
}

function ticks(ctx, pal) {
  var m = 28, L = 22;
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(W - m, m + L); ctx.lineTo(W - m, m); ctx.lineTo(W - m - L, m);
  ctx.moveTo(m, H - m - L); ctx.lineTo(m, H - m); ctx.lineTo(m + L, H - m);
  ctx.moveTo(W - m, H - m - L); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m - L, H - m);
  ctx.stroke();
}

function ellipseArc(cx, cy, rx, ry, rot, a0, a1, n, wob, phase) {
  var pts = [];
  var i, t, wr, x, y, xr, yr;
  for (i = 0; i <= n; i++) {
    t = a0 + (a1 - a0) * (i / n);
    wr = 1 + wob * Math.sin(3 * t + phase) + wob * 0.45 * Math.sin(5 * t + phase * 0.6);
    x = Math.cos(t) * rx * wr;
    y = Math.sin(t) * ry * wr;
    xr = x * Math.cos(rot) - y * Math.sin(rot);
    yr = x * Math.sin(rot) + y * Math.cos(rot);
    pts.push({ x: cx + xr, y: cy + yr });
  }
  return pts;
}

function pathLen(pts) {
  var L = 0, i;
  for (i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return L;
}

function along(pts, u) {
  if (!pts || pts.length < 2) return { x: 0, y: 0, a: 0 };
  var target = pathLen(pts) * clamp(u, 0, 1);
  var acc = 0, i, d, t;
  for (i = 1; i < pts.length; i++) {
    d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (acc + d >= target || i === pts.length - 1) {
      t = d ? (target - acc) / d : 0;
      t = clamp(t, 0, 1);
      return {
        x: lerp(pts[i - 1].x, pts[i].x, t),
        y: lerp(pts[i - 1].y, pts[i].y, t),
        a: Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x)
      };
    }
    acc += d;
  }
  return { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y, a: 0 };
}

function trimPath(pts, k) {
  if (k >= 1) return pts;
  if (k <= 0 || !pts || pts.length < 2) return null;
  var L = (pts.length - 1) * k;
  var i = Math.floor(L);
  var f = L - i;
  var out = pts.slice(0, i + 1);
  if (i + 1 < pts.length) {
    out.push({
      x: pts[i].x + (pts[i + 1].x - pts[i].x) * f,
      y: pts[i].y + (pts[i + 1].y - pts[i].y) * f
    });
  }
  return out.length > 1 ? out : null;
}

function strokePath(ctx, pts, k, width, color, frame, closed) {
  var cut = trimPath(pts, k);
  if (!cut) return;
  ctx.beginPath();
  var i, b;
  for (i = 0; i < cut.length; i++) {
    b = Math.sin(i * 12.9898 + frame * 0.55) * Math.min(0.9, width * 0.12);
    if (i === 0) ctx.moveTo(cut[i].x + b, cut[i].y + b * 0.5);
    else ctx.lineTo(cut[i].x + b, cut[i].y + b * 0.5);
  }
  if (closed && k >= 1) ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke();
}

function buildWorld() {
  var CX = 540, CY = 458;
  var ridges = [];
  var i, rx, ry, rot, wob, pts;

  for (i = 0; i < 7; i++) {
    rx = 32 + i * 20;
    ry = 24 + i * 16;
    rot = -0.14;
    wob = 0.038 + i * 0.005;
    pts = ellipseArc(CX, CY - 8, rx, ry, rot, 0, TAU, 72, wob, i * 1.7);
    ridges.push({ kind: "loop", pts: pts, ring: i });
  }

  for (i = 0; i < 14; i++) {
    rx = 188 + i * 26;
    ry = 158 + i * 21;
    rot = -0.09 + (i % 3) * 0.012;
    wob = 0.028 + (i % 5) * 0.004;
    pts = ellipseArc(CX + 6, CY + 18, rx, ry, rot, -0.18 * Math.PI, 1.18 * Math.PI, 88, wob, i * 2.1);
    ridges.push({ kind: "flow", pts: pts, ring: 7 + i });
  }

  var spokes = [];
  var angles = [0.22, 0.72, 1.18, 1.72, 2.28, 3.55, 4.15, 4.85, 5.45];
  for (i = 0; i < angles.length; i++) {
    var a = angles[i];
    var r0 = 70, r1 = 470;
    var p0 = { x: CX + Math.cos(a) * r0, y: CY + Math.sin(a) * r0 * 0.84 };
    var p1 = { x: CX + Math.cos(a) * r1, y: CY + Math.sin(a) * r1 * 0.84 + 20 };
    var mid = [];
    var n, u, bow;
    for (n = 0; n <= 18; n++) {
      u = n / 18;
      bow = Math.sin(u * Math.PI) * (10 + (i % 3) * 4);
      mid.push({
        x: lerp(p0.x, p1.x, u) + Math.cos(a + Math.PI / 2) * bow,
        y: lerp(p0.y, p1.y, u) + Math.sin(a + Math.PI / 2) * bow
      });
    }
    spokes.push(mid);
  }

  var walk = ridges[10] && ridges[10].pts ? ridges[10].pts : ridges[6].pts;
  var node = along(walk, 0.38);

  var grid = [];
  var x0 = 148, y0 = 168, x1 = 932, y1 = 912;
  var cols = 11, rows = 10, c, r, x, y;
  for (c = 0; c <= cols; c++) {
    x = x0 + (x1 - x0) * c / cols;
    grid.push([{ x: x, y: y0 }, { x: x, y: y1 }]);
  }
  for (r = 0; r <= rows; r++) {
    y = y0 + (y1 - y0) * r / rows;
    grid.push([{ x: x0, y: y }, { x: x1, y: y }]);
  }

  return {
    ridges: ridges,
    spokes: spokes,
    walk: walk,
    node: node,
    grid: grid,
    paper: bakePaper(0xA11CE5),
    plate: bakePlate()
  };
}

var WORLD = buildWorld();

function fillGround(ctx, mode) {
  ctx.drawImage(mode === "cold" ? WORLD.plate : WORLD.paper, 0, 0);
}

function caption(ctx, pal, line, sub) {
  ctx.fillStyle = pal.bg;
  ctx.globalAlpha = 0.82;
  ctx.fillRect(64, H - 168, W - 128, sub ? 112 : 78);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2;
  ctx.strokeRect(64, H - 168, W - 128, sub ? 112 : 78);
  tracked(ctx, line, W / 2, H - (sub ? 118 : 112), {
    size: 34, track: 0.14, align: "center", color: pal.ink
  });
  if (sub) {
    tracked(ctx, sub, W / 2, H - 76, {
      size: 20, track: 0.1, align: "center", color: pal.dim, weight: "500"
    });
  }
}

function stampExample(ctx, pal) {
  ctx.save();
  ctx.fillStyle = pal.bg;
  ctx.strokeStyle = pal.accent;
  ctx.lineWidth = 2;
  ctx.fillRect(56, 56, 248, 40);
  ctx.strokeRect(56, 56, 248, 40);
  tracked(ctx, "EXAMPLE DATA", 180, 84, {
    size: 18, track: 0.16, align: "center", color: pal.accent
  });
  ctx.restore();
}

function drawPrint(ctx, pal, k, frame, asCity, extra) {
  extra = extra || {};
  var ridges = WORLD.ridges;
  var i, rk, wInk, wCity;
  var reveal = clamp(k, 0, 1);
  for (i = 0; i < ridges.length; i++) {
    rk = clamp((reveal - i * 0.018) / 0.55, 0, 1);
    if (rk <= 0) continue;
    wInk = ridges[i].kind === "loop" ? 2.4 : 2.8;
    wCity = ridges[i].kind === "loop" ? 5.5 : 6.2;
    strokePath(ctx, ridges[i].pts, rk, asCity ? wCity : wInk, pal.ink, frame, ridges[i].kind === "loop");
  }
  if (asCity) {
    for (i = 0; i < WORLD.spokes.length; i++) {
      rk = clamp((reveal - 0.35 - i * 0.03) / 0.4, 0, 1);
      if (rk > 0) strokePath(ctx, WORLD.spokes[i], rk, 3.4, pal.dim, frame + 3, false);
    }
    if (reveal > 0.55) {
      ctx.fillStyle = pal.ink;
      for (i = 0; i < ridges.length; i += 2) {
        var p = along(ridges[i].pts, 0.22 + (i % 5) * 0.12);
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      }
    }
  } else if (reveal > 0.4) {
    ctx.fillStyle = pal.dim;
    for (i = 0; i < ridges.length; i += 1) {
      var q = along(ridges[i].pts, 0.15 + (i % 7) * 0.11);
      ctx.beginPath();
      ctx.arc(q.x, q.y, 1.6, 0, TAU);
      ctx.fill();
    }
  }
  if (extra.walkK > 0) {
    var cut = trimPath(WORLD.walk, extra.walkK);
    strokePath(ctx, WORLD.walk, extra.walkK, 8, pal.accent, frame, false);
    if (cut) {
      var tip = along(WORLD.walk, extra.walkK);
      ctx.fillStyle = pal.accent;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 10, 0, TAU);
      ctx.fill();
      ctx.fillStyle = pal.bg;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 4, 0, TAU);
      ctx.fill();
    }
  }
}

function drawGridCity(ctx, pal, k, frame) {
  var i, rk;
  for (i = 0; i < WORLD.grid.length; i++) {
    rk = clamp((k - i * 0.012) / 0.28, 0, 1);
    if (rk > 0) strokePath(ctx, WORLD.grid[i], rk, 3.2, pal.ink, frame, false);
  }
}

function drawCloseDetail(ctx, pal, asCity, frame) {
  var n = WORLD.node;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(3.15, 3.15);
  ctx.translate(-n.x, -n.y);
  drawPrint(ctx, pal, 1, frame, asCity, {});
  if (asCity) {
    ctx.strokeStyle = pal.accent;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(n.x - 14, n.y - 14, 28, 28);
  }
  ctx.restore();
}

function sceneAt(t) {
  if (t < 1.80) return 1;
  if (t < 5.40) return 2;
  if (t < 10.2) return 3;
  if (t < 17.2) return 4;
  if (t < 24.4) return 5;
  if (t < 31.2) return 6;
  if (t < 41.2) return 7;
  if (t < 51.2) return 8;
  if (t < 56.6) return 9;
  return 10;
}

function drawScatter(ctx, pal, k, frame) {
  var x0 = 150, y0 = 220, x1 = 930, y1 = 760;
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1);
  ctx.stroke();
  var ticksY = [0, 0.5, 1];
  var ti, ty, year;
  for (ti = 0; ti < ticksY.length; ti++) {
    ty = lerp(y1, y0, ticksY[ti]);
    ctx.beginPath();
    ctx.moveTo(x0 - 8, ty); ctx.lineTo(x0, ty);
    ctx.stroke();
    tracked(ctx, String(ticksY[ti]), x0 - 16, ty + 6, {
      size: 14, track: 0.04, color: pal.dim, align: "right", weight: "500"
    });
  }
  var years = [1300, 1600, 1900];
  for (ti = 0; ti < years.length; ti++) {
    year = years[ti];
    var tx = lerp(x0 + 20, x1 - 20, (year - 1250) / (1980 - 1250));
    ctx.beginPath();
    ctx.moveTo(tx, y1); ctx.lineTo(tx, y1 + 8);
    ctx.stroke();
    tracked(ctx, String(year), tx, y1 + 32, {
      size: 14, track: 0.04, color: pal.dim, align: "center", weight: "500"
    });
  }
  ctx.save();
  ctx.translate(56, (y0 + y1) / 2);
  ctx.rotate(-Math.PI / 2);
  tracked(ctx, "STREET-ANGLE ENTROPY", 0, 0, {
    size: 16, track: 0.12, color: pal.dim, align: "center"
  });
  ctx.restore();
  tracked(ctx, "YEAR OF FIRST PLAN", (x0 + x1) / 2, y1 + 64, {
    size: 16, track: 0.12, color: pal.dim, align: "center"
  });

  var shown = Math.floor(CITIES.length * clamp(k, 0, 1) + 0.001);
  var i, c, px, py;
  for (i = 0; i < shown; i++) {
    c = CITIES[i];
    px = lerp(x0 + 20, x1 - 20, (c.year - 1250) / (1980 - 1250));
    py = lerp(y1 - 20, y0 + 20, c.ent);
    ctx.fillStyle = c.kind === "ring" ? pal.ink : pal.accent;
    if (c.hero) {
      var pulse = 7 + holdSin((frame % 24) / 24, 0.7) * 5;
      ctx.beginPath();
      ctx.arc(px, py, pulse, 0, TAU);
      ctx.fill();
      tracked(ctx, c.name, px + 16, py - 10, { size: 16, track: 0.08, color: pal.ink });
    } else {
      ctx.fillRect(px - 5, py - 5, 10, 10);
    }
  }
  tracked(ctx, "RING-GROWN", x0 + 24, y0 + 36, { size: 18, track: 0.12, color: pal.ink });
  tracked(ctx, "RULER-PLANNED", x1 - 24, y1 - 28, {
    size: 18, track: 0.12, color: pal.accent, align: "right"
  });
}

function drawBars(ctx, pal, k) {
  var left = 90, mid = 540, right = 990, top = 250, bot = 780;
  var gap = 36;
  var w = (mid - left - gap) / BINS.length;
  var i, h, x;
  tracked(ctx, "RIDGE TOWN", (left + mid - gap) / 2, 210, {
    size: 22, track: 0.14, align: "center", color: pal.ink
  });
  tracked(ctx, "GRID TOWN", (mid + right) / 2, 210, {
    size: 22, track: 0.14, align: "center", color: pal.accent
  });
  ctx.strokeStyle = pal.rule;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mid, 190); ctx.lineTo(mid, 820);
  ctx.stroke();

  for (i = 0; i < BINS.length; i++) {
    h = RING_BARS[i] / 42 * (bot - top) * clamp((k - i * 0.04) / 0.35, 0, 1);
    x = left + i * w;
    ctx.fillStyle = pal.ink;
    ctx.fillRect(x + 4, bot - h, w - 8, h);
    tracked(ctx, BINS[i], x + w / 2, bot + 32, {
      size: 14, track: 0.06, align: "center", color: pal.dim
    });

    h = GRID_BARS[i] / 42 * (bot - top) * clamp((k - 0.15 - i * 0.04) / 0.35, 0, 1);
    x = mid + gap + i * w;
    ctx.fillStyle = pal.accent;
    ctx.fillRect(x + 4, bot - h, w - 8, h);
    tracked(ctx, BINS[i], x + w / 2, bot + 32, {
      size: 14, track: 0.06, align: "center", color: pal.dim
    });
  }
  tracked(ctx, "HOW MANY STREETS POINT EACH WAY", W / 2, 860, {
    size: 18, track: 0.1, align: "center", color: pal.dim
  });
}

function drawEnd(ctx, pal) {
  ticks(ctx, pal);
  tracked(ctx, "THE MYSTERY", W / 2, 220, {
    size: 18, track: 0.22, align: "center", color: pal.dim
  });
  tracked(ctx, "WHY SOME CITY GRIDS", W / 2, 320, {
    size: 40, track: 0.1, align: "center", color: pal.ink
  });
  tracked(ctx, "LOOK LIKE FINGERPRINTS", W / 2, 380, {
    size: 40, track: 0.1, align: "center", color: pal.ink
  });
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(180, 430); ctx.lineTo(900, 430);
  ctx.stroke();
  tracked(ctx, "BEST GUESS", W / 2, 490, {
    size: 16, track: 0.2, align: "center", color: pal.dim
  });
  tracked(ctx, "RINGS OF WALKING, WATER, AND WALLS — NOT A PLAN.", W / 2, 550, {
    size: 22, track: 0.06, align: "center", color: pal.ink, weight: "500"
  });
  tracked(ctx, "TECH DEMO  ·  ASCII-CANVAS", W / 2, 860, {
    size: 20, track: 0.16, align: "center", color: pal.dim
  });
}

function drawFrame(t) {
  var ctx = drawFrame.ctx;
  var frame = Math.floor(t * FPS);
  var tq = frame / FPS;
  var s = sceneAt(tq);
  var pal, k, mode;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;

  if (s === 1) {
    pal = WARM; fillGround(ctx, "warm");
    drawCloseDetail(ctx, pal, false, frame);
    ticks(ctx, pal);
    if (tq > 0.45) caption(ctx, pal, "A RIDGE", "CLOSE ENOUGH TO TOUCH");
  } else if (s === 2) {
    pal = WARM; fillGround(ctx, "warm");
    k = clamp((tq - 1.80) / 2.6, 0, 1);
    drawPrint(ctx, pal, 0.55 + 0.45 * k, frame, false, {});
    ticks(ctx, pal);
    caption(ctx, pal, "A FINGERPRINT", "NESTED LOOPS AROUND A CORE");
  } else if (s === 3) {
    pal = WARM; fillGround(ctx, "warm");
    drawPrint(ctx, pal, 1, frame, true, {});
    ticks(ctx, pal);
    caption(ctx, pal, "A CITY FROM ABOVE", "SAME LINES. DIFFERENT JOB.");
  } else if (s === 4) {
    pal = WARM; fillGround(ctx, "warm");
    k = clamp((tq - 10.2) / 5.4, 0, 1);
    drawPrint(ctx, pal, 1, frame, true, { walkK: 0.08 + 0.84 * smooth(k) });
    stampExample(ctx, pal);
    var km = (14.2 * (0.08 + 0.84 * smooth(k))).toFixed(1);
    caption(ctx, pal, "WALK RING 3", km + " KM  ·  11 TURNS  ·  NO RIGHT ANGLES");
    ticks(ctx, pal);
  } else if (s === 5) {
    var local = tq - 17.2;
    var snaps = [0, 1.15, 2.25, 3.35, 4.45];
    var idx = 0;
    while (idx < snaps.length - 1 && local >= snaps[idx + 1]) idx++;
    mode = idx % 2 === 0 ? "warm" : "cold";
    pal = mode === "warm" ? WARM : COLD;
    fillGround(ctx, mode);
    var close = idx < 4;
    if (close) drawCloseDetail(ctx, pal, true, frame);
    else drawPrint(ctx, pal, 1, frame, true, {});
    ticks(ctx, pal);
    caption(ctx, pal, close ? "ONE JUNCTION" : "THE WHOLE PRINT",
      mode === "cold" ? "COLD READ  ·  SURVEY" : "WARM READ  ·  SKIN");
  } else if (s === 6) {
    pal = COLD; fillGround(ctx, "cold");
    k = clamp((tq - 24.4) / 3.2, 0, 1);
    drawGridCity(ctx, pal, k, frame);
    ticks(ctx, pal);
    caption(ctx, pal, "THIS ONE WAS DRAWN FIRST", "A PLAN, NOT A PRINT");
  } else if (s === 7) {
    pal = COLD; fillGround(ctx, "cold");
    k = clamp((tq - 31.2) / 7.2, 0, 1);
    drawScatter(ctx, pal, k, frame);
    stampExample(ctx, pal);
    ticks(ctx, pal);
    caption(ctx, pal, "TWO CLUSTERS", "GROWN CITIES STAY MESSY");
  } else if (s === 8) {
    pal = WARM; fillGround(ctx, "warm");
    k = clamp((tq - 41.2) / 6.5, 0, 1);
    drawBars(ctx, pal, k);
    stampExample(ctx, pal);
    ticks(ctx, pal);
    caption(ctx, pal, "A PRINT HAS MANY HEADINGS", "A PLAN HAS TWO");
  } else if (s === 9) {
    var u = tq - 51.2;
    mode = u < 2.6 ? "warm" : "cold";
    pal = mode === "warm" ? WARM : COLD;
    fillGround(ctx, mode);
    if (mode === "warm") {
      drawPrint(ctx, pal, 1, frame, true, {});
      ctx.globalAlpha = 0.55;
      drawPrint(ctx, pal, 1, frame + 2, false, {});
      ctx.globalAlpha = 1;
      caption(ctx, pal, "THE PRINT FITS THE CITY", "RIDGES ARE OLD BOUNDARIES");
    } else {
      drawGridCity(ctx, pal, 1, frame);
      ctx.globalAlpha = 0.35;
      drawPrint(ctx, pal, 1, frame, false, {});
      ctx.globalAlpha = 1;
      caption(ctx, pal, "THE GRID REFUSES THE PRINT", "A RULER HAS NO WHORL");
    }
    ticks(ctx, pal);
  } else {
    pal = WARM; fillGround(ctx, "warm");
    drawEnd(ctx, pal);
  }
}

(function () {
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d", { alpha: false });
  drawFrame.ctx = ctx;
  var playBtn = document.getElementById("play");
  var restartBtn = document.getElementById("restart");
  var timeEl = document.getElementById("time");
  var scrub = document.getElementById("scrub");
  var statusEl = document.getElementById("status");
  var pausedEl = document.getElementById("paused");

  var playing = true;
  var t = 0;
  var lastNow = 0;
  var ended = false;
  var scrubbing = false;

  var params = new URL(location.href).searchParams;
  var hold = parseFloat(params.get("t"));
  if (isFinite(hold)) {
    t = clamp(hold, 0, DURATION);
    playing = params.get("play") === "1";
  }

  function setChrome() {
    playBtn.textContent = playing ? "Pause" : "Play";
    timeEl.textContent = fmtTime(t) + " / " + fmtTime(DURATION);
    if (!scrubbing) scrub.value = String(Math.round(t * 10));
    pausedEl.hidden = playing;
    if (ended && t >= DURATION - 0.0001) statusEl.textContent = "End card. Tap to play from the start.";
    else statusEl.textContent = playing ? "Playing." : "Paused.";
  }

  function paint() {
    drawFrame(t);
    setChrome();
  }

  function toggle() {
    if (ended && t >= DURATION - 0.0001) {
      t = 0;
      ended = false;
      playing = true;
      lastNow = 0;
    } else {
      playing = !playing;
      lastNow = 0;
    }
    setChrome();
  }

  function loop(now) {
    if (playing) {
      if (!lastNow) lastNow = now;
      t += (now - lastNow) / 1000;
      lastNow = now;
      if (t >= DURATION) {
        t = DURATION;
        playing = false;
        ended = true;
        lastNow = 0;
      }
    } else {
      lastNow = 0;
    }
    paint();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("click", toggle);
  playBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    toggle();
  });
  restartBtn.addEventListener("click", function () {
    t = 0;
    ended = false;
    playing = true;
    lastNow = 0;
    setChrome();
  });
  scrub.addEventListener("pointerdown", function () { scrubbing = true; playing = false; ended = false; });
  scrub.addEventListener("input", function () {
    t = clamp(parseInt(scrub.value, 10) / 10, 0, DURATION);
    ended = t >= DURATION;
    paint();
  });
  scrub.addEventListener("pointerup", function () { scrubbing = false; });
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.matches && e.target.matches("input, textarea, button")) {
      if (e.code !== "Space") return;
    }
    if (e.code === "Space") {
      e.preventDefault();
      toggle();
    }
  });

  window.draw = drawFrame;
  window.DURATION = DURATION;
  paint();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
